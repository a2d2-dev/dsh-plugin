const ISSUE_FIXTURES = /* ISSUE_FIXTURE_START */[{"id":3342,"title":"[Task] 镜像仓库关联遗留问题收尾：页面与删除生命周期","shortTitle":"镜像仓库关联遗留问题收尾：页面与删除生命周期","url":"https://github.com/theriseunion/freeland/issues/3342","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"待处理","milestone":"3.0","tags":[],"parent":null,"children":[3270,3025,3026,2979],"body":"## 目标\n\n集中跟踪 API 规范改造结束后剩余的四项关联问题。按 LF 2026-10-21 指令独立归拢，作为后续工作的统一入口。\n\n已完成的 API 主线 #2987、#2995 及 #3027–#3031 保持关闭。API 验收见 [#3031 记录](https://github.com/theriseunion/freeland/issues/3031#issuecomment-6313237527)。本汇总不重开或扩大已结案的 API 工作。\n\n## 四项范围\n\n- [ ] #3270 普通登录外壳读取管理目录 403，导致远程页面误报不存在。\n- [ ] #3025 独立外部镜像 Tab，以及未选集群时的托管配置提示。\n- [ ] #3026 托管写操作的迟到响应可能覆盖新项目目录。\n- [ ] #2979 历史 NovaInference/NovaCustomService 删除卡 finalizer。\n\n每项的复现、已完成代码、PR、未验项及验收条件，以原票正文和最新评论为准。此处只提供汇总入口，不复制规格、不重置进度。\n\n## 跟踪约定\n\n- 四张原票作为本票的原生子单，保留原编号、负责人、优先级、历史证据和当前状态。\n- #3270 从已关闭的 #2995 转移到本汇总；其余三项归入本汇总。原 API 任务只保留历史交叉引用。\n- 已合并或部分实现的内容先核对原票证据，避免重复开发；未解决或未验收的原票保持打开。\n- 只跟踪这四项，不自动增加页面改版、通用网络治理或新的镜像业务目标。新增问题另行登记。\n- 本次操作仅整理任务关系，不启动实现、测试或部署。\n\n## 汇总完成条件\n\n四张子单分别按原验收条件复核并关闭后，再关闭本汇总。重组任务不代表问题已经修复。\n\n版本：3.0。原子单负责人保持不变，汇总负责人负责状态协调。\n\n— reported by Codex/a2d2-orchestrator-remaining-issues\n","prs":[]},{"id":3270,"title":"[Bug] 普通登录外壳读取管理目录403导致远程页面误报不存在","shortTitle":"普通登录外壳读取管理目录403导致远程页面误报不存在","url":"https://github.com/theriseunion/freeland/issues/3270","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"进行中","milestone":"3.0","tags":["bug","ready-for-agent"],"parent":3342,"children":[],"body":"汇总父任务：theriseunion/freeland#3342。\n\n原 API 父任务 #2995 已关闭；本问题转入独立遗留汇总，原验收条件与负责人不变。本次操作仅整理跟踪关系，不启动或恢复下方历史实现。\n\n## 问题描述\n\n普通用户能访问自有Workspace的项目与canonical镜像消费者接口，但Console外壳读取管理插件目录和模块导航时返回403。远程插件脚本未加载，正式页面被显示为PageNotFound。Home镜像卡仍提供不可达点击。\n\n## 复现步骤\n\n1. 在rg-meta发布入口，用无global role的普通用户正常password表单登录。用户只有自有Workspace的scoped角色。\n2. 打开自有Workspace项目或部署页。项目列表、repositories计数及公共镜像list/tags/pullbindings正常返回200。\n3. 观察GET `/oapis/rise.io/v1alpha1/plugins` 和 `/oapis/modules/v1/navigation?tenantId=\u003cownWS>`，两者返回403；Dock显示Failed to load menus。\n4. 点击Home的Images入口。目标为本Workspace正式Registry页面，但显示PageNotFound，Registry UMD未请求。\n\n## 期望与实际\n\n期望：普通登录外壳能在合法上下文装配已发布前端。管理目录仍保持管理授权，业务菜单与动作仍由当前scoped UIkeys和业务RBAC控制。目录失败显示真实加载/权限错误，无目标权限不提供不可达点击。\n\n实际：管理目录403变为成功空插件数组，Loader判定settled并且不插脚本，resolver显示PageNotFound。当前Workspace另无Registry模块UI角色；这不是给普通用户平台目录权限的理由。\n\n## 环境与证据\n\n已复现Console `620bc4a0b1e0afbf4f3e6088e8a09c41fbc7fc53`、API `f752686a03494d028b848e3f345d9cb99976fc4a`、Registry `29a5007dfd4730d695f3e2e54718d362e6563a79`，rg-meta/rg-member开发环境。后续meta Console已更新为304f5f7c，正式C/D功能祖先及真实loaded hash由父任务单独记录。\n\n已核源证：InstalledPluginsContext 80–106、RemotePluginLoader 79–112、scoped-page-resolver 215–230。正式standard-user fixture明确没有等价普通内置模板；当前插件RoleTemplates与已物化scoped角色符合既有声明。诊断和HTTP/UI安全证据由父任务2995持有，独立spec将在本票timeline给出固定commit链接。\n\n## 验收条件\n\n- [ ] 普通ownWS与合法Project主体可读最小安全装配视图；管理plugins接口仍403，匿名拒绝。\n- [ ] 他人/未知WS、错误Project绑定、伪造或冲突Scope拒绝，不以tenantId或header进入管理态。\n- [ ] 响应不包含values、Secret、Agent或后台配置，不改变公共SDK注册schema、默认模板/聚合和双轴继承。\n- [ ] 目录403/500为真实可翻译可重试错误，成功空目录才PageNotFound；不同主体/Scope缓存及迟到响应不混入。\n- [ ] 无Registry UIkey时计数可读但不提供不可达点击；合法本scope模块授权后原三个Tab可真实使用。\n- [ ] 适用测试、正常CI、一次新安全面fixed-head Standards+Spec复核通过，正式部署后由普通身份真实UI复测。\n\n范围不包含恢复freeland#3200/rise-global#1656已经移除的四页batchUI。父任务保原batch条款历史并标superseded-by；其它当前活动调用和E验收不减少。\n\n影响程度建议：P1。普通用户的远程模块入口受阻；有其它可达业务路径。\n\n执行状态：Main49已获Root明确业务授权。独立framework worktree `wt/2995-console-shell-view`，分支 `fix/2995-console-shell-view`，固定实现基线17a7a9c1944570a73aee040a85e6793f0e9edfeb。由fresh codex medium工程TDD实现；新安全code单独复核，不重开旧C/D审查。\n\n— reported by codex/Main49-2995\n","prs":[]},{"id":3025,"title":"[registry] 独立外部镜像 Tab，并修复未选集群时的托管配置误提示","shortTitle":"独立外部镜像 Tab，并修复未选集群时的托管配置误提示","url":"https://github.com/theriseunion/freeland/issues/3025","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"进行中","milestone":"3.0","tags":["bug","P1","ready-for-agent"],"parent":3342,"children":[],"body":"## 问题\n\n用户在 aaa 工作空间的镜像仓库页面选择“私有镜像”，顶部集群仍为“全部”时，看到“管理员尚未为本集群登记托管仓库地址与管理凭据”。该提示把“尚未选定集群、尚未读取配置”误当成“该集群未配置”。\n\n## 已复现证据\n\n页面：http://10.126.126.52:30710/workspace/aaa/rise.io/v1/registry/image-registry 。实际私有页/全部状态下警告存在、初始化按钮不存在。只把顶部选择改为rg-member后，警告消失，项目bbb出现“立即初始化”；未修改任何配置或开通项目。\n\n两个真实只读API均HTTP200且configured=true：/oapis/registry.rise.io/v1alpha1/privateregistries 与 /clusters/rg-member/oapis/registry.rise.io/v1alpha1/privateregistries。两边native PrivateRegistry/default也存在，domain=10.126.126.53:30016，凭据仅引用harbor-admin，defaultQuota=50Gi。密码/token未输出。\n\n源码ImageRegistryPage.tsx配置effect在!cluster时直接return；初始EMPTY_CONFIG.configured=false；SpaceCard将notConfigured渲染为管理员缺配置。还需验证“具体集群→全部”和迟到配置响应，防止继续展示前一集群的状态或写入口。\n\n## 目标 / 验收\n\n- 未选择具体集群（全部）时，显示“请选择集群”一类中性引导，不声称管理员缺配置。\n- 具体集群实际返回configured=false时保留真实未配置提示；读取失败保留真实错误，不能统一掩盖。\n- 具体集群configured=true时，项目空间按既有状态显示；不自动创建/开通项目空间。\n- 从具体集群切回全部、旧请求迟到时，不显示前一集群的可写入口或凭据卡；有效的项目/集群响应围栏保持。\n- 用真实页面组件/取数状态的测试先复现原误提示，再修绿；无选集群时不发无意义配置请求。不是只断言源码字符串。\n- pnpm test/typecheck、i18n与Chart guard等适用检查；registry Chart版本按仓规bump，后端无变化则appVersion不改。\n- 发布后回原页面验证全部与rg-member/host切换，截图不暴露凭据。\n\n## 范围\n\n仅registry前端状态呈现、必要的状态模型与中英文词条、回归测试、Chart版本。不得修改PrivateRegistry/Secret/Harbor配置、角色权限、后端API或开通现有项目；不得夹带#2995的API重构。原托管配置有效，用户无需重复填写。\n\n## 关联\n\n来自当前交付会话中LF的直接配置请求；与theriseunion/freeland#2995并行，修复不能等待API重构，也不得覆盖已完成镜像业务。\n\n## LF 补充需求：独立外部镜像 Tab\n\nLF 明确要求外部镜像放在公共镜像、私有镜像之后，并采用独立 Tab。页面固定为三个同级页签：**公共镜像 → 私有镜像 → 外部镜像**，默认公共镜像。\n\n- 私有镜像页仅显示项目托管空间、托管目录、凭据/配额与托管操作。\n- 外部镜像页显示项目外部登记记录及登记/移除登记等既有操作；不显示托管空间卡，不依赖PrivateRegistry是否配置。\n- 公共镜像筛选/卡片/列表/详情保持；项目选择与迟到响应围栏保持。三页计数按各自镜像记录计算，不把tag/空间/未加载数据冒充数量。\n- 外部移除仍只移除登记，绝不删除远端内容；权限/后端API/凭据链路不变。\n- 补真实组件测试：三Tab顺序与内容隔离、外部页在托管未配置/加载失败时仍可用、登记/移除行为、切项目与切回全部的状态隔离。用户可见中英文文案与空态同步。\n- 这是对原两Tab混排布局的明确用户调整；可更新旧布局测试的导航步骤，不得删除其业务安全断言。不得夹带#2995 API迁移。\n","prs":[{"url":"https://github.com/theriseunion/rise-global-extension/pull/1937","number":1937,"title":"fix(swiss): adopt wrapper with host-owned styles (theriseunion/freeland#3025)","repo":"theriseunion/rise-global-extension","state":"MERGED","relation":"交叉引用"},{"url":"https://github.com/theriseunion/rise-global-extension/pull/1940","number":1940,"title":"docs: record Swiss A release acceptance and SDK session gate","repo":"theriseunion/rise-global-extension","state":"OPEN","relation":"交叉引用"}]},{"id":3026,"title":"[registry] 托管写操作迟到响应可能覆盖新项目目录","shortTitle":"托管写操作迟到响应可能覆盖新项目目录","url":"https://github.com/theriseunion/freeland/issues/3026","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"待处理","milestone":"3.0","tags":["bug","P1"],"parent":3342,"children":[],"body":"## 问题与证据\n\n#3025独立Spec评审在固定base567ce907及head ee490c43均发现：ImageRegistryPage.tsx的applyContentView直接setCatalogView，托管删tag/删image的成功、失败、finally及tag-sheet onApplied未检查发起时选择/请求代际。\n\n场景：在项目A提交托管写操作，响应在途时切换至B且B目录已加载；A迟到响应仍可能回填A目录或影响B的错误、弹窗/busy状态。当前仅静态链路核对，未在真实Harbor执行破坏性复现，需先用实际组件与deferred响应建立红测试。\n\n这在#3025的base已存在；三Tab/All门禁修复没有引入它。All状态有渲染门禁，因此不将本项作为已合extension#1930的新增阻断，也不声称该PR已修所有写回调。\n\n## 目标 / 验收\n\n- 先补实际组件回归：A写在途→B目录已就绪→A成功/失败迟到，B目录/错误/弹窗/busy不受旧操作影响。\n- 对托管删除与tag-sheet回调使用捕获的scope/请求代际；所有成功/失败/finally分支一致，不只挡catalog成功结果。\n- 保留API、权限、原托管操作语义和#3025三个独立Tab，不改后端/Harbor配置，不用真实用户数据做删除复现。\n- 证明当前选择的正常写回仍工作，旧响应不被改写成当前项目数据，不吞真实错误。\n\n## 关联 / 状态\n\n来源：#3025 Spec reviewer session-5b08f19c-012f-4f59-bd37-d1fab76061fa，评审严重级别P2；本票单独记账，不混入三Tab发布。#2995未来若触及同一前端写流程需协调本票，避免重复修改。\n","prs":[{"url":"https://github.com/theriseunion/rise-global-extension/pull/1941","number":1941,"title":"feat(registry): prepare all canonical frontend callers on latest main (theriseunion/freeland#3030)","repo":"theriseunion/rise-global-extension","state":"MERGED","relation":"交叉引用"}]},{"id":2979,"title":"[Bug] NovaInference/NovaCustomService 删除卡 finalizer：控制器 30s 超时不收敛","shortTitle":"NovaInference/NovaCustomService 删除卡 finalizer：控制器 30s 超时不收敛","url":"https://github.com/theriseunion/freeland/issues/2979","repo":"theriseunion/freeland","owners":["wuxs"],"mine":false,"remote":"OPEN","projectStatus":"不解决","milestone":"3.0","tags":["bug"],"parent":3342,"children":[],"body":"## 背景\n在 freeland#2933 的真实环境闭环验收（专用项目 `zz-2933-hosted`）里，删除项目命名空间时 **NovaInference / NovaCustomService 卡在 finalizer**：\n\n- finalizer：`finalizer.novanotebook.rasi.io`\n- 控制器反复报：`operation timed out after 30s for custom service zz-2933-hosted/zz-2933-app`\n- 4 分钟未收敛，项目命名空间一直 Terminating；为完成 #2933 清理，验收人手工删除了 finalizer。\n\n## 影响\n- 真实删除项目/清理流程在**有 nova 推理或应用实例**的项目上会被 finalizer 卡住，`ProjectSpace` 的托管空间清理也会被拖住（其前提是项目 namespace 删除/终止）。\n- #2933 记录见 `docs/artifacts/image-registry-2854-20261017/2933/verification.md` §4 B5（此缺陷未修、不属 #2933 范围）。\n\n## 目标\n1. 复现并定位 nova 控制器删除路径 30s timeout 的根因（外部依赖不可达？状态机不前进？幂等/重试设计？）。\n2. 让 NovaInference/NovaCustomService 在依赖不可用时也能在**有界时间**内完成删除或把真实失败原因暴露可操作（不得无限卡、不得靠人手删 finalizer）。\n3. 加回归测试/证据；与 #2929/#2930 的托管清理语义（两段确认、失败可观测、可重试）对齐。\n\n## 边界\n只改 nova 相关插件删除路径；不改 #2854 已合并的托管空间清理契约。","prs":[{"url":"https://github.com/theriseunion/rise-global/pull/1668","number":1668,"title":"fix(notebook): 补齐 HPA 清理权限，解除删除 finalizer 阻塞","repo":"theriseunion/rise-global","state":"OPEN","relation":"交叉引用"}]},{"id":2272,"title":"[需求] 账号锁定与本地密码生命周期管理（母单）","shortTitle":"账号锁定与本地密码生命周期管理（母单）","url":"https://github.com/theriseunion/freeland/issues/2272","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"待处理","milestone":"3.0","tags":["enhancement"],"parent":null,"children":[1671,1672],"body":"## 使用者与交付目标\n\n平台管理员管理账号锁定与解锁，用户的本地登录按已配置的失败次数和密码生命周期策略执行。交付目标是账号状态、密码策略与登录门禁语义一致，同时保持正常登录、退出和刷新可用。\n\n本单由 LF 于 2026-10-12 要求整理待处理 issue 后建立，只有两个共享账号状态与登录流程的已有需求；不收拢所有安全、IAM 或认证问题，不代表原功能已经实施。\n\n## 子单范围\n\n| 子单 | 独立交付 | 原范围 |\n|---|---|---|\n| #1671 | 管理员主动锁定/解锁、未登录超时锁定、状态与原因回显 | 保留与禁用区分、可配置天数等原要求 |\n| #1672 | 连续登录失败限制、定期改密、首次改密、缺省口令限制 | 保留四项完整要求、多实例与登录/退出/刷新/member 回归 |\n\n两单挂为 GitHub 原生 sub-issues，原状态、指派、验收与实施边界不变。新增本单不新增或批准 User CRD、默认 IAM/RBAC、凭据或认证实现的改动；涉及受保护契约时仍遵循原项目评审规则。\n\n## 关闭条件\n\n- [ ] 两个子单按其原完整验收分别完成并关闭。\n- [ ] 对照子单证据核对管理员主动锁定、未登录锁定与连续失败临时锁定的组合语义，不将它们混成没有原因或截止时间的通用禁用状态。\n- [ ] 按各子单原要求证明密码过期、首次改密及默认口令策略执行正确；没有仅前端提示而绕过服务端限制的验收结论。\n- [ ] 按既有证据确认正常登录、退出、刷新和规定 member 路径不发生回归。复用子单证据，不引入第三套额外审批或验收范围。\n\n当前两项都未完成，本单 Status 为待处理，原生进度按两个子单的关闭数计算。本轮未写账号、密码、策略、源码或集群，也未启动实现。\n\n## 关系边界\n\n- 没有新增 #1671 与 #1672 的串行 blocking；共享状态与策略应协调，不等于必须一单全关才能开始另一单。\n- #1365 IAM 确定性命名碰撞分析、#2101 扩展中心登录跳转核验是不同根因与验收，保持独立。\n- #1352 权限收紧、#2090 storage 安全加固、#854 插件 private 配置身份仍按各自延期或独立决定跟踪，不纳入本单。\n- 看板继续平铺子单，不修改现有视图分组、折叠、筛选或排序。\n\n— reported by Codex/pending-delivery-grouping\n","prs":[]},{"id":1671,"title":"[需求] 用户账号支持主动锁定与超时未登录自动锁定","shortTitle":"用户账号支持主动锁定与超时未登录自动锁定","url":"https://github.com/theriseunion/freeland/issues/1671","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"待处理","milestone":"3.1","tags":["enhancement"],"parent":2272,"children":[],"body":"## 需求描述\n\n用户账号生命周期需要支持：\n- 管理员**主动锁定 / 解锁**账号（与「禁用」区分）；\n- 超过设定天数未登录的账号**自动锁定**，天数可配置；\n- 列表与详情回显锁定状态及原因。\n\n这是账号安全基线（等保 / 客户安全检查）要求的项。\n\n## 现状（已核实，代码基线 `theriseunion/rise-global` main@684df9fc（2026-10-02））\n\n- 用户状态只有 `Active` / `Pending` / `Disabled` 三种（`apiserver/api/iam/v1alpha1/user_types.go:24-32`），没有锁定态。\n- 管理端用户列表已展示状态并支持启用 / 禁用（带原因）（`console/src/plugins/access/pages/UsersPage.tsx`）。\n- 已记录 `status.lastLoginTime`（user_types.go:69-71），但没有任何按未登录时长处理账号的逻辑。\n- 登录时仅判断状态是否为 Active（`apiserver/pkg/oapis/oauth/user_auth.go:67`）。\n\n## 来源\n\n功能完成度核查（docs/global-feature-plan.xlsx，一期第 74 行「账号状态/生命周期 (锁定/超时锁定/禁用)」）。\n\n## 紧急程度\n\n常规\n\n— reported by claude-opus/global-feature-plan-核查\n","prs":[]},{"id":1672,"title":"[需求] 本地登录密码策略：失败次数上限、定期改密、首次改密、禁用缺省口令","shortTitle":"本地登录密码策略：失败次数上限、定期改密、首次改密、禁用缺省口令","url":"https://github.com/theriseunion/freeland/issues/1672","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"待处理","milestone":"3.0","tags":["enhancement"],"parent":2272,"children":[],"body":"## 需求描述\n\n本地账号登录与密码策略需要支持（账号安全基线 / 等保要求）：\n- **登录失败次数上限**：连续失败达到次数后锁定一段时间，次数和时长可配置；\n- **定期强制改密**：密码超过有效期后登录时必须修改，有效期可配置；\n- **首次登录改密**：管理员创建或重置密码后，用户首次登录必须修改；\n- **缺省口令禁用**：平台初始/默认口令不能长期使用。\n\n## 现状（已核实，代码基线 `theriseunion/rise-global` main@684df9fc（2026-10-02））\n\n- 已有密码复杂度策略：最小长度、大小写、数字、特殊字符，可在页面配置（`console/src/plugins/core/pages/PasswordPolicyPage.tsx`），创建 / 改密时校验（`apiserver/pkg/utils/password_validation.go:21-27`）。\n- apiserver 中没有登录失败计数、密码有效期、首次登录改密、默认口令相关的字段或逻辑（全仓检索 failed attempts / password age / must change / first login 均无结果）。\n\n## 来源\n\n功能完成度核查（docs/global-feature-plan.xlsx，一期第 75 行「本地登录/密码策略」）。\n\n## 紧急程度\n\n常规\n\n— reported by claude-opus/global-feature-plan-核查\n","prs":[]},{"id":2633,"title":"[Bug] 插件不得提供 IAMRole：框架把 IAMRole 列为插件全局路由 GVK，7 个插件共 17 个 IAMRole","shortTitle":"插件不得提供 IAMRole：框架把 IAMRole 列为插件全局路由 GVK，7 个插件共 17 个 IAMRole","url":"https://github.com/theriseunion/freeland/issues/2633","repo":"theriseunion/freeland","owners":["wuxs"],"mine":false,"remote":"OPEN","projectStatus":"进行中","milestone":"3.0","tags":["bug"],"parent":null,"children":[2637,2638,2639,2640,2641,2642,2643,2644,2645,2646,2942,2944],"body":"## 原则（LF 2026-10-15，本单的最高口径）\n\n1. **插件侧**：插件管理的是「它的功能需要哪些权限」。这些权限按 **RoleTemplate** 组织成不同的**功能**，供权限管理系统使用。\n2. **平台权限管理系统侧**：它在**各个 Scope 内通过角色聚合 RoleTemplate**。例如创建角色时可以勾选某个业务的某些功能，这些功能所需的 RoleTemplate 就会聚合到该角色，也就是 **IAMRole**。\n3. **因此插件不应该定义 IAMRole**——角色的定义权属于用户/平台（在具体 Scope 内挑功能），插件只负责声明「它的功能需要哪些权限」。\n\n> 直白说：**插件交付的是「功能 → 权限」的映射（RoleTemplate）；「角色 → 功能」的组合（IAMRole）是用户在权限管理系统里做的选择。**\n\n---\n\n## 架构口径（LF，2026-10-15 明确）\n\n- **IAMRole 由用户创建**；**插件不允许提供 IAMRole**。\n- 插件**只能提供 RoleTemplate**，再由对应的 controller 完成聚合，提供对应的权限能力。\n\n## 已核实的反向事实（这就是 bug）\n\n1. **框架文档把 IAMRole 列为插件的合法全局路由 GVK**：`docs/architecture/plugin-gvk-routing.md`（`origin/main`）\n   - 第 25 行：hook 中出现 `RoleTemplate` 或 `IAMRole` 都按「可路由的 IAM GVK」处理；\n   - 第 98–99 行 Global Route Table 明确列出：\n     | API group/version | Kind | Reason |\n     |---|---|---|\n     | `iam.theriseunion.io/v1alpha1` | `RoleTemplate` | IAM permission templates are business control-plane data. |\n     | `iam.theriseunion.io/v1alpha1` | **`IAMRole`** | IAM roles are business control-plane data and must be visible through Karmada/global APIs. |\n2. **框架代码与文档一致**：`apiserver/internal/controller/plugin_gvk_routing.go` 的 `pluginGlobalRouteGVKs` 同时包含 `Category`、`RoleTemplate`、`IAMRole`；插件 chart 渲染出的这些对象会被打上 `plugin.rise.io/name|uid` 归属标签并 SSA 到全局面。\n3. **7 个插件 chart 实际声明了 IAMRole，共 17 个对象**（extension 仓 `main`）：\n   | 插件 | 文件 | IAMRole 数量 |\n   |---|---|---|\n   | billing | `plugins/billing/templates/iamroles.yaml` | 4 |\n   | export | `plugins/export/templates/iamroles.yaml` | 1 |\n   | metering | `plugins/metering/templates/iamroles.yaml` | 2 |\n   | novanotebook | `plugins/novanotebook/templates/iamroles.yaml` | 2 |\n   | recycle-rule | `plugins/recycle-rule/templates/iamroles.yaml` | 2 |\n   | registry | `plugins/registry/templates/iamroles.yaml` | 3 |\n   | storage | `plugins/storage/templates/iamroles.yaml` | 3 |\n   例（`plugins/registry/templates/iamroles.yaml`）：\n   ```yaml\n   apiVersion: iam.theriseunion.io/v1alpha1\n   kind: IAMRole\n   metadata:\n     name: registry-reader\n     labels: { category: registry }\n   spec:\n     aggregationRoleTemplates: { templateNames: [registry-reader] }\n   ```\n4. **平台已有正确机制**：`apiserver/internal/controller/iam/iamrole_controller.go`（`IAMRoleReconciler`：聚合 RoleTemplate 成 IAMRole rules，并投影为 ClusterRole）与 `roletemplate_helper.go` 的 `aggregateRoleTemplates`。文档 `docs/architecture/codebase-module-map.md` 亦记「IAMRoleReconciler | IAMRole/RoleTemplate | 聚合权限并投影为 ClusterRole」。\n\n## 影响\n\n- 插件越权定义「可绑定角色」，权限能力的定义权从用户/平台转移到插件交付物。\n- 插件禁用/卸载路径按 UID 归属删除这些 IAMRole（theriseunion/freeland#1994 已源码证实禁用分支会删 IAM），而 `IAMRoleBinding` 不在删除清单内 → **绑定留下、roleRef 指向已删角色**。\n- 与 `IAMRoleReconciler` 的聚合语义重叠：插件写死的 IAMRole 与用户聚合出的角色可能同名/同义，归属与覆盖关系不清。\n- 文档与实现的口径本身也不一致：同一文档第 45 行仍写 “Disable or uninstall deletes only global-routed objects…”，与 #1994 修复后「禁用不删 IAM」不符。\n\n## 发现来源\n\ntheriseunion/freeland#1994（禁用会删 IAM 配置）的源码核查过程中发现，属**比原单更大的口径问题**。\n\n## 待设计细化（本单先定口径，再拆实施票）\n\n- 插件 chart **不得**声明 IAMRole；上述 7 个插件的 17 个对象应改为只声明 RoleTemplate（或删除冗余 IAMRole）。\n- 框架 **Global Route Table 与 `pluginGlobalRouteGVKs` 对插件 IAMRole 应 fail loud 拒绝**，而不是路由；文档同步修改。\n- 保留用户/平台创建 IAMRole + `IAMRoleBinding` 的能力，以及 `IAMRoleReconciler` 的聚合行为不变。\n- 回归：插件 chart 含 IAMRole 时安装被明确拒绝；只用 RoleTemplate 的插件权限能力不回归。\n\n## 验收（草稿）\n\n- [ ] 记录最终口径到 ADR/CONTEXT，并链接回本单与 #1994。\n- [ ] RED：插件 chart 含 IAMRole 时，现状可安装成功（即缺陷可复现）；GREEN：框架明确拒绝且报错可读。\n- [ ] 7 个插件改为只声明 RoleTemplate，权限能力（聚合后的 ClusterRole/授权生效）不回归。\n- [ ] 用户创建的 IAMRole + IAMRoleBinding 路径不受影响。\n- [ ] 环境：默认 rg-meta；不访问 173/190/prod。\n\n— recorded by A2D2 CEO（发现自 #1994 核查）\n\n","prs":[{"url":"https://github.com/theriseunion/rise-global-extension/pull/1858","number":1858,"title":"fix(registry): 仅交付 RoleTemplate (theriseunion/freeland#2644)","repo":"theriseunion/rise-global-extension","state":"CLOSED","relation":"交叉引用"},{"url":"https://github.com/theriseunion/rise-global-extension/pull/1860","number":1860,"title":"fix(storage): 仅交付 RoleTemplate (theriseunion/freeland#2645)","repo":"theriseunion/rise-global-extension","state":"MERGED","relation":"交叉引用"}]},{"id":2638,"title":"[Task] 只读核查 rg-meta 插件旧 IAMRole 引用并出迁移方案（母单 #2633）","shortTitle":"只读核查 rg-meta 插件旧 IAMRole 引用并出迁移方案（母单 #2633）","url":"https://github.com/theriseunion/freeland/issues/2638","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"进行中","milestone":"3.0","tags":["ready-for-agent"],"parent":2633,"children":[],"body":"Part of theriseunion/freeland#2633. 关联 theriseunion/freeland#1994 与 #2549。\n\n设计：[ADR0045](https://github.com/theriseunion/rise-global/blob/docs/2633-plugin-iam-boundary/docs/adr/0045-plugin-roletemplate-only.md)。LF 口径：插件=功能→权限映射 RoleTemplate；用户/平台=具体 Scope 内角色→功能组合 IAMRole。平台/工作空间/项目/集群等 Scope 内聚合和绑定，不得跨 Scope 预置角色。Category 由平台/用户持有，不由插件交付。\n\n硬边界：只写 /data/src/github.com/riseaicloud/rise-g -only.md)。LF 口径：插件=功能→权限映射 RoleTemplate；用户/平台=具体 Scope 内角色→功能组合 IAMRole。平台/工作空间/项目/集群等 Scope 内聚合和绑定，不得跨 Scope 预置角色。Category 由平台/用户持有，不由插件交付。\n\n硬边界：只写 /data/src/github.com/riseaicloud/rise-global 下本票专属 worktree 与私有2633-artifacts；不写 /root，不请求提权，不调用 ask_user_question。所有 shell 加 timeout；不循环忙等。不访问173/190/prod；默认rg-meta。环境动作前读本地 .dsh/a2d2/SOUL.md、env-info/environment/workspace.yaml、目标仓 docs/agents/environments.md。不做集群删除/改绑定/解除所有权，不触碰#1994活动worktree或重用其旧分发授权。\n\n每票从最新origin/main创建持久worktree和唯一分支，首步核pwd/branch。test-first，RED与GREEN均保存命令及真实退出码。每阶段commit，push开PR，不合并。权限边界一轮fresh评审，main核清后按LF授权squash；CI全pass才合并，合并不等于部署或真实请求通过。\n\n## Scope\n专属框架worktree docs/artifacts/issue-2633-2026-10-15 的正确夹具、验收合同与脚本/脱敏报告；私有2633-artifacts/acceptance。必要rg-meta-only可回滚部署记录单独评估，不改共享values/CI/默认策略。\n\n## 验收\n记录框架/七插件mergeCommit、CI、镜像digest及真实部署来源；不得用合并代替部署。rg-meta验证含IAMRole chart被明确拒绝、无该角色写入；RoleTemplate-only正确交付。用户/平台独立角色与绑定不含插件归属，controller聚合七插件同等功能并投影ClusterRole，普通用户同Scope实际允许/拒绝及跨Scope拒绝。清晰记录每个Scope与实际API；既有默认平台管理员请求不作为授权证明。不得删除角色/改绑定来准备测试；所需新测试角色/绑定创建先将精确方案报main，不碰存量。#1994/#2549旧证据不改，新合同改为插件不产生IAMRole/Category+独立用户角色绑定聚合生效，原UI/HTTP/Helm/配置/对照AC不减，现场生命周期由#1994 main执行。本票须另给正确的新夹具，历史基线不混用。未部署/未验证明确标出。\n\n## 依赖\nhttps://github.com/theriseunion/freeland/issues/2637\nhttps://github.com/theriseunion/freeland/issues/2639\nhttps://github.com/theriseunion/freeland/issues/2640\nhttps://github.com/theriseunion/freeland/issues/2641\nhttps://github.com/theriseunion/freeland/issues/2642\nhttps://github.com/theriseunion/freeland/issues/2643\nhttps://github.com/theriseunion/freeland/issues/2644\nhttps://github.com/theriseunion/freeland/issues/2645\n\n## Out of scope\n许可证、默认RBAC/CRD/认证、无关重构、集群迁移执行。\n\n— reported by codex/2633-main","prs":[{"url":"https://github.com/theriseunion/rise-global-extension/pull/1860","number":1860,"title":"fix(storage): 仅交付 RoleTemplate (theriseunion/freeland#2645)","repo":"theriseunion/rise-global-extension","state":"MERGED","relation":"交叉引用"},{"url":"https://github.com/theriseunion/rise-global/pull/1541","number":1541,"title":"docs(iam): 插件只交付 RoleTemplate 的部署与授权验收记录 (theriseunion/freeland#2646)","repo":"theriseunion/rise-global","state":"OPEN","relation":"交叉引用"}]},{"id":2104,"title":"[需求] Global 插件交付与安装闭环：CLI、CRD、性能与全新部署","shortTitle":"Global 插件交付与安装闭环：CLI、CRD、性能与全新部署","url":"https://github.com/theriseunion/freeland/issues/2104","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"进行中","milestone":"3.0","tags":["enhancement"],"parent":null,"children":[1395,563,1284,2114],"body":"\u003c!-- a2d2-execution-status -->\n## 当前进度\n- 母单保持OPEN，原各子项验收分别取证，不以CLI合并关闭母单。\n- CLI原PR1360已合main ec8d97ed，实际P1补丁b5a采用拒绝全部目录符号链接策略；PR1475/39951a96补齐实际策略文档。本地受控HTTP/真实Helm/race及精确CI证据已核，主干已构建可执行dev-f6304b50。未称Global安装/性能/离线已验。\n- CLI子单2114曾按原本机验收关闭并回读已修复，但随后同账号于13:22:29Z重开且未附新增说明；当前保留OPEN，不反复争写状态。原证据有效，后续2649-2652仍OPEN且父2114/祖父2104，无新增blocking。\n- 当前实际实施1395 values+schema有界缓存切片，基于新主干adc20d33；保持精确包版本和schema/defaults一致，经实际HTTP/Helm文件建立重复下载RED。原六项保留，不能只缓存完成就关1395。旧测量工具未交现场不重造，不再重复snapshot/QPS改造。\n- 1395真实性能/安装八段、1284平台CRD和563全新部署仍各自待完成；当前只必要定点验证，相关批次统一完整回归，项目CI/hook/审批门保留。\n\u003c!-- /a2d2-execution-status -->\n\n## 总体目标\n缩短 Global 插件从交付包生成、导入、环境准备到安装可用和集成验证的路径，形成可诊断、可验收的交付与安装闭环。\n\n## 来源与已确认范围\n产品 owner 在本会话确认：母单扩大为总体交付与安装闭环，CLI 首版作为独立子项先交付。命令名 global，builder 为子命令，代码放 theriseunion/rise-global/cli/。不带入第三方产品代码或调研内容。\n\n## 工作线与验收映射\n- CLI 首版：用户登录/登出、CI token、已构建插件 Chart 的离线校验打包、上传与精确 Chart 版本目录确认。独立子单保留原已确认接口和验收。不自动覆盖，不安装或升级。\n- 平台前置条件：#1284。平台 CRD 按正确目标 API 有受控交付路径、缺失可检测、存量安全收敛。保留原验收；全量覆盖不表示把全部 CRD 混装到每个集群。\n- 安装与性能：#1395。保留 API P50/P95、固定 K8s 请求数、values 下载/缓存及完整安装分段要求和已有历史证据，不重复实现已落地主干改造。\n- 全新服务端部署：#563。保留全新部署、不迁移旧版本/数据的原范围。离线物料、镜像治理、配置提示与 infra 边界的细化方案仍需按该单讨论逐项确认，不把候选评论直接当全部已批准规格。\n\n## 职责约束\nCLI 负责用户入口与制品，不直接绕过平台执行安装，不自动 apply 全部 CRD。安装由目标集群现有 PluginReconciler 执行；PCI 负责声明式交付与当前状态回流，不恢复 agent 或远程 Helm 旧路径。有 GitOps 的环境保留 Git -> ArgoCD 对期望声明的唯一写者。平台部署、插件 Chart、离线制品构建各保留自己的职责和验收。\n\n## 阶段成功条件\n插件包有效、目录可见、目标平台就绪、当前版本安装/加载可用、性能达标、全新断网交付分别取证。publish 成功不能证明安装、性能、CRD 或离线部署成功。\n\n## 推进顺序\nCLI 首版先评审并独立开 PR；平台 CRD 设计、镜像契约整改、离线物料与测量方案可并行。需要有效安装环境的性能终验和断网终验等待正确的 CRD/runtime/仓库/凭据就绪，不把整项准备工作强制串行。\n\n## 平台核心组件升级（新增工作线）\n\n来源：theriseunion/freeland#3249 的多集群宿主版本滞后。先完成 190 两成员的开发环境运行时发布修复；生产平台升级能力作为本母单后续工作，本轮不扩大实现。\n\n已确认方向：\n\n- 复用插件跨集群交付的底层技术，在已有“平台组件”页面管理核心组件的目标集群、当前/期望版本、部署升级和状态；后端提供相应 API。\n- 核心组件升级使用正式发布包和精确制品引用，检查宿主 SDK、插件、CRD 与主/成员版本兼容范围。生产实例显式选择期望版本，不直接跟随开发 main。\n- 执行状态持久化，升级执行能够跨越 Console/apiserver 自身重启；支持预检、分批执行、暂停、失败恢复与可审计结果。具体执行器和 API 规格在该工作线设计，不在此预设新增控制器或恢复旧 PCI 远程 Helm。\n- 有 GitOps 的实例维持既有期望声明的唯一写者；本项不扩大 CLI 首版 #2114 的职责，也不改写 #563“全新部署、不迁移”的原验收。\n\n后续验收：\n\n- [ ] 从现有平台组件页发起核心组件对指定集群的部署/升级，页面与 API 对当前/期望版本、步骤、失败原因一致。\n- [ ] 正式版本的制品、架构、兼容范围、CRD/迁移顺序及回退边界明确，离线物料覆盖实际升级组合。\n- [ ] 自升级时任务不随被升级进程丢失；离线成员、部分失败、重试和分批恢复有真实验证。\n- [ ] 主集群及成员实际 Pod imageID、身份/配置保留、SDK/插件页面与关键接口验收完成；开发环境 ArgoCD 修复不替代本项生产验收。\n\n## 母单关闭门槛\n全部必要子项按各自验收取证后才关闭母单。CLI 单测或发布成功不关闭母单及其它子单。自动化验证和真实环境验收分开记录。\n\n## 尚需确认\n新客户支持的部署形态、OS/K8s/CPU 架构矩阵、核心/infra 分界、离线包责任方和安装入口，继续在总体设计与 #563 中裁决，不扩大 CLI 首版隐含范围。\n\n## 紧急程度\n常规，3.0。\n\n— reported by codex/global-delivery","prs":[{"url":"https://github.com/theriseunion/rise-global/pull/1673","number":1673,"title":"fix(gitops): 让 190 成员运行时跟随宿主发布","repo":"theriseunion/rise-global","state":"MERGED","relation":"交叉引用"},{"url":"https://github.com/theriseunion/rise-global/pull/1693","number":1693,"title":"fix(gitops): 开启已验收的 190 成员运行时自动发布","repo":"theriseunion/rise-global","state":"MERGED","relation":"交叉引用"}]},{"id":1395,"title":"[Task] 插件安装链路性能优化：安装/values 请求不再逐插件调用 K8s，并分段测量端到端耗时","shortTitle":"插件安装链路性能优化：安装/values 请求不再逐插件调用 K8s，并分段测量端到端耗时","url":"https://github.com/theriseunion/freeland/issues/1395","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"OPEN","projectStatus":"进行中","milestone":"3.0","tags":["enhancement","ready-for-agent","size:M","project:rise-global"],"parent":2104,"children":[],"body":"## 现状\n\n在扩展中心安装一个插件，要经过四段：打开安装向导时 `GET .../values` 预填默认值 → 提交 `POST /plugins/catalog/{group}/{name}/install` → PluginReconciler 执行 Helm 安装和前端分发 → 前端刷新目录，看到 `Installed`。四段各自耗多少时间还没有测过。下面是对照 `rise-global@08579586` 代码找到的可疑点。\n\n### API 侧：只装一个插件，却要为全部插件逐个调用 K8s\n\n- `InstallCatalogPlugin`（`apiserver/pkg/oapis/plugin/v1alpha1/catalog.go:225`）通过 `findCatalogPlugin`（`catalog.go:648`）找目标插件，而它会重建**整个**本地目录（`loadRepositoryPlugins`）。\n- `loadRepositoryPlugins` 对每个本地插件调用一次 `claimPluginSource`（`catalog.go:743`）。每次 claim 都会先 `Create` ConfigMap，已存在时收到 409，再用不走缓存的 APIReader `Get` 一次（`catalog_source.go:74`、`catalog_source.go:95`）。一个插件就是 2 次串行请求。\n- `loadClaimedMarketplacePlugins` 对每个 Marketplace 插件再 `Get` 一次（`catalog.go:674`）。\n- 找到目标后，`claimPluginSource` / `createPluginWithSource` 还要再 claim 一次（`catalog.go:289`、`handler.go:444`）。\n- `GetCatalogPluginValues`（`catalog.go:416`）走同一个 `findCatalogPlugin`。随后 `loadChartValues`（`catalog.go:453`）每次都新建 Helm client（执行 `actionConfig.Init`），完整下载一次 Chart 包，结果不缓存。\n\nAPIServer 的 rest.Config 没有设置 QPS/Burst（`apiserver/pkg/clients/clients.go:61`、`:83-85`），所以使用 client-go 默认的**每个 REST client 5 QPS、burst 10**。以 114 环境的 47 个插件估算，一次安装请求约有 `2N + M + 3` 个串行 K8s 请求（N 为本地插件数，M 为 Marketplace 插件数），取 values 的请求也是同样的量级。按限流估算，每个请求要十几秒，**而且耗时随插件总数线性增长**。这个数是推算，需要在任务 1 实测确认。\n\n### Controller 侧\n\n- `handleInstall`（`apiserver/internal/controller/plugin_controller.go:568`）每次 reconcile 都调用 `r.newHelmClient`。`helm.NewClient` 每次新建 memory discovery cache（`apiserver/pkg/helm/client.go:196-201`），第一次 REST mapping 时要做一次完整的 API discovery。CRD 多的集群，或者 split 控制面下，这一步的开销还没有测过。\n- 同一次 reconcile 内 Chart 只下载一次，通过 `spec.LoadedChart` 复用（`plugin_controller.go:2012`、`client.go:553`），这部分没有问题。\n- Helm 使用 `Wait: true`、`WaitForJobs: true`、`Timeout: 5m`（`plugin_controller.go:1342-1344`），要等工作负载 Ready 才返回，包含镜像拉取时间。这符合 `Installed` 的语义，不在本 issue 范围内。但每次安装会占住 4 个 worker 之一（`pluginMaxConcurrentReconciles = 4`），批量安装时要排队。\n- Chart 暂时 404、依赖检查失败等情况按 `chartPropagationRequeueAfter = 30s` 重试（`plugin_controller.go:52`），用户最多多等 30 秒。\n\n### 前端侧\n\n安装提交后，界面如何轮询、是否重新拉取整个 `/plugins/catalog` 还没有核实。如果会重新拉取，每次轮询都要承受 #1350 描述的目录 GET 开销。\n\n## 目标\n\n1. 安装向导的 values 请求和安装请求，K8s 调用次数与插件总数无关（固定次数），热态 P95 不超过 1 秒（目标值，需要基线确认）。\n2. 从点击\"安装\"到界面显示 `Installed` 的端到端耗时有分段数据：API、reconcile 排队、Helm client 初始化、Chart 下载、Helm 执行与等待、前端分发、状态回写、前端刷新。据此判断后续还要优化哪一段。\n\n## 方案\n\n1. **安装和取 values 只查目标插件。**\n   - `findCatalogPlugin` 不再经过会写入的 `loadRepositoryPlugins`，改为从 `RepositoryClient` 已缓存的元数据（`apiserver/pkg/helm/repository.go:113-118`）中，按身份只挑出目标 Chart。\n   - Marketplace 侧只 `Get` 目标身份的 claim。\n   - claim 只对目标身份做一次，保留 `createPluginWithSource` 的冲突检查语义。\n2. **`loadRepositoryPlugins` 改为纯读，不再写入。**\n   - 这一项和 #1350 的任务 5 重叠，只做一次即可。本 issue 改动面更小，建议先落地，#1350 直接复用。\n   - 当前由目录 GET 补建的 Local claim，要有明确的替代位置：导入流程、`ensureExistingCatalogSourceClaims`（`catalog.go:198`，目前依赖 `loadRepositoryPlugins` 的副作用来补建）、直接上传 Chart 后的认领。旧 claim 和已安装插件的 claim 都不能漏。\n3. **给 APIServer 的 rest.Config 显式设置 QPS/Burst。** 取值依据任务 1 的请求数和集群 APF 配置确定，并在代码注释中记录依据。\n4. **缓存 values.yaml。**\n   - 按 `chart@version` 缓存，在元数据提取阶段（`apiserver/pkg/helm/archive_meta.go` 的 `ChartArchiveMeta`）一并取出，或者用有大小上限的 LRU。\n   - 不能回到 #600 那种缓存完整 Chart 导致 OOM 的做法。\n   - 前提是 ChartMuseum 不允许覆盖已有版本。`Publish` 把 409 映射为 `ErrChartVersionExists`（`chart_store.go`），说明当前不允许覆盖，但需要确认部署配置。\n5. **Controller 复用 Helm client 或 discovery（视测量结果决定）。** 如果任务 1 显示 discovery 占比明显，就按 namespace 复用 `RESTClientGetter` 和 discovery cache，遇到 no-match 时失效重建。\n\n## 实施任务\n\n- [ ] **1. 测基线（rise-global）。** 在同一环境、同一认证账号下测三类请求：`GET .../values`、`POST .../install`、安装后的前端刷新请求。记录每类的 P50/P95，以及单次请求触发的 K8s 请求数（APIServer 侧日志，或 client-go metrics `rest_client_requests_total`）。controller 侧从 Plugin CR 创建到 `Installed` 的各段耗时用日志或 span 分段记录。选 2～3 个代表插件：纯前端、带工作负载、带 agent。验收：留下原始数据，找出耗时前两位的环节，确认或推翻上面\"限流导致十几秒\"的推算。\n- [ ] **2. 安装和 values 路径只查目标插件（rise-global/apiserver）。** 实现方案 1 和 2。验收：\n  - 单测断言，一次安装请求和一次 values 请求的 claim store 调用次数是固定值，不随本地或 Marketplace 插件数增加；\n  - 同身份的 Local/Marketplace 冲突仍然返回 409；\n  - Marketplace 同步、导入、直接上传 Chart 后的 claim 行为与改动前一致；\n  - 已安装但仓库已无 Chart 的插件，以及旧 claim，都有回归测试。\n- [ ] **3. 设置 QPS/Burst（rise-global/apiserver）。** 验收：rest.Config 构建处有显式值和注释说明依据；任务 1 的请求在新配置下不再出现 client-side throttling 日志（`Waited for ... due to client-side throttling`）。\n- [ ] **4. 缓存 values（rise-global/apiserver）。** 验收：同一 `chart@version` 第二次请求不下载 Chart 包；缓存内存有上限，并有测试覆盖；版本被删除后不返回过期内容，或者先确认版本不可变再免除这一要求。\n- [ ] **5. Controller 侧优化（按任务 1 结论决定是否做）。** 验收：只有在 discovery 或 Helm client 初始化占端到端耗时明显比例时才实施。实施后给出前后对比，并保证 CRD 新增后仍能正确完成 mapping。\n- [ ] **6. 集成验收。** 在目标环境用实际镜像版本重测任务 1 的全部指标，给出前后对比：P50/P95、K8s 请求数、端到端分段耗时。未达到目标时，按分段数据定位原因，不直接宣称完成。\n\n## 不在范围\n\n- Helm 等待工作负载 Ready 的时间，包括镜像拉取、Pod 调度，由 Chart 本身决定。\n- 目录列表 `GET /plugins/catalog` 的整体改造，见 #1350。本 issue 只和它共享\"`loadRepositoryPlugins` 不再写入\"这一项。\n\n## 待确认\n\n- ChartMuseum 部署是否禁止覆盖同名版本（影响 values 缓存键的安全性）。\n- APIServer QPS/Burst 的取值，以及 Karmada 或目标集群的 APF 配额。\n- 前端安装后的轮询方式和间隔，是否每次都拉取整个目录。\n- 是否提高 `pluginMaxConcurrentReconciles`，或者对批量安装做排队提示。\n\n参考：#1350、#600、[rise-global#686](https://github.com/theriseunion/rise-global/pull/686)。代码位置以 `rise-global@08579586` 为准。\n","prs":[{"url":"https://github.com/theriseunion/rise-global/pull/1362","number":1362,"title":"docs(delivery): define Global deployment and acceptance boundaries","repo":"theriseunion/rise-global","state":"MERGED","relation":"交叉引用"},{"url":"https://github.com/theriseunion/rise-global/pull/1481","number":1481,"title":"perf(plugin): bound and validate values/schema cache","repo":"theriseunion/rise-global","state":"MERGED","relation":"交叉引用"}]},{"id":563,"title":"[需求] 新的部署方式 - 服务端","shortTitle":"新的部署方式 - 服务端","url":"https://github.com/theriseunion/freeland/issues/563","repo":"theriseunion/freeland","owners":["jason0730","imneov","qzl-bot"],"mine":true,"remote":"OPEN","projectStatus":"待处理","milestone":"3.0","tags":["enhancement"],"parent":2104,"children":[],"body":"### 需求描述\n\n- 3.0 如何部署？\n- 暂不考虑迁移老版本和数据问题，全新部署方式；\n\n\n### 来源\n\n研发\n\n### 紧急程度\n\n常规\n\n### 补充信息（选填）\n\n_No response_","prs":[{"url":"https://github.com/theriseunion/rise-global/pull/1360","number":1360,"title":"feat(cli): add Global login and plugin package publishing","repo":"theriseunion/rise-global","state":"MERGED","relation":"交叉引用"},{"url":"https://github.com/theriseunion/rise-global/pull/1362","number":1362,"title":"docs(delivery): define Global deployment and acceptance boundaries","repo":"theriseunion/rise-global","state":"MERGED","relation":"交叉引用"}]},{"id":1284,"title":"[Bug] 平台安装 chart 的 crds/ 在 GitOps 链路无交付路径——skipCrds + storage-only include 导致 IAM CRD 静默缺失","shortTitle":"平台安装 chart 的 crds/ 在 GitOps 链路无交付路径——skipCrds + storage-only include 导致 IAM CRD 静默缺失","url":"https://github.com/theriseunion/freeland/issues/1284","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"CLOSED","projectStatus":"已修复","milestone":"3.0","tags":["bug","needs-design-review","a2d2:main"],"parent":2104,"children":[],"body":"## 问题\n\n平台**安装 chart**（`install/rise-global/`）的 `crds/` 目录在 rg-meta 这类 GitOps 环境里**没有任何 ArgoCD 应用会 apply**，导致其中的 CRD（如 `iamroles`/`roletemplates`）在集群中缺失。任何渲染这些 kind 的插件在升级时会因 `no matches for kind` 直接失败，且 ArgoCD 全程 `Synced/Healthy` 不报错。\n\n与 #665 同源但**不同层**：#665 记的是「插件 chart 的 `crds/` 在 Helm upgrade 静默不落地」；本单是「**平台安装 chart** 的 `crds/` 在 GitOps 链路里根本没有交付路径」。\n\n## 已验证现象（rg-meta，2026-09-24）\n\n把 registry 从 chart 1.2.20 升到 1.2.26 时，`helm upgrade` dry-run 直接失败：\n\n```\nUPGRADE FAILED: no matches for kind \"IAMRole\" in version \"iam.theriseunion.io/v1alpha1\"\n# 补装 IAMRole CRD 后再失败：\nUPGRADE FAILED: no matches for kind \"RoleTemplate\" in version \"iam.theriseunion.io/v1alpha1\"\n```\n\nrg-meta 的 `iam.theriseunion.io` 组当时只有 `ReverseProxy`，缺 `IAMRole`/`RoleTemplate`。\n\n## 根因（均已 commit 在部署仓库 `theriseunion/rise-global` origin/main，影响所有同源环境）\n\n1. CRD **确实随安装 chart 交付**（自 #35 `e2d6341b` 起，已是 rg-meta 同步版本 `84ab1456` 的祖先）：\n   - `install/rise-global/crds/iam.theriseunion.io_iamroles.yaml`\n   - `install/rise-global/crds/iam.theriseunion.io_roletemplates.yaml`\n   - 目录内共 **41 个 CRD 文件**。\n\n2. `rise-global-runtime` app 关掉了 CRD 应用 —— `install/argocd/rg-meta/apps/rise-global-runtime.yaml`：\n   ```yaml\n   source:\n     path: install/rise-global\n     helm:\n       skipCrds: true          # ← 跳过 chart 自带 crds/\n   ```\n\n3. 唯一实际 apply CRD 的 app `rise-global-storage-crds` 用 include 白名单**只放了 3 个 storage CRD** —— `install/argocd/rg-meta/apps/rise-global-storage-crds.yaml`：\n   ```yaml\n   source:\n     path: install/rise-global/crds\n     directory:\n       recurse: false\n       include: '{storage.rise.io_storageprofiles.yaml,storage.rise.io_storagevolumes.yaml,storage.rise.io_storageretentions.yaml}'\n   ```\n\n**结果**：`install/rise-global/crds/` 里除 3 个 storage CRD 外的其余（IAM 的 `iamroles`/`roletemplates` 等平台自有 CRD）**没有任何 ArgoCD 路径会 apply**。ArgoCD 报 `Synced`，因为被 include 排除的文件不在其对账范围内，缺失完全静默。\n\n## 影响\n\n- 任何渲染 `IAMRole`/`RoleTemplate`（或其它未被白名单覆盖的平台 CRD）的插件——registry、billing、metering、storage、export 等——在这类存量环境升级/安装时会因 kind 不存在而失败；\n- 属于平台安装层的「存量集群安全收敛到 chart 声明 schema」缺口，与 #665 的验收目标相邻但不重叠。\n\n## 现场临时处置（仅 unblock，非修复）\n\n从部署仓库官方 CRD 定义手动 apply（cluster-scoped，纯新增，未改存量对象）：\n\n```bash\nkubectl apply -f apiserver/config/crd/bases/iam.theriseunion.io_iamroles.yaml\nkubectl apply -f apiserver/config/crd/bases/iam.theriseunion.io_roletemplates.yaml\n```\n\n（注：这只补齐 CRD；registry 插件的运行版本另由 rise-apiserver 的 plugin_controller 按 `Plugin.spec.version` 对账，见下方关联，不在本单范围。）\n\n## 建议验收标准\n\n- [ ] 平台安装 chart 的 `crds/` 有明确、覆盖全量的受控交付路径（要么给一个覆盖 `install/rise-global/crds/**` 的 CRD app，要么去掉 storage-only 白名单）；\n- [ ] 被 include/`skipCrds` 排除导致的 CRD 缺失能被检测并给出可操作错误，不再静默 `Synced`；\n- [ ] 存量集群（rg-meta 等）能安全收敛到安装 chart 声明的全部 CRD；\n- [ ] 覆盖「新增 CRD 未落地」的回归测试。\n\n## 关联\n\n- 同源不同层：#665（插件 chart CRD 静默不落地，P1）。\n- 环境：rg-meta（dev），ArgoCD app `rise-global-runtime` / `rise-global-storage-crds`，同步版本 `84ab1456`。\n","prs":[{"url":"https://github.com/theriseunion/rise-global/pull/1362","number":1362,"title":"docs(delivery): define Global deployment and acceptance boundaries","repo":"theriseunion/rise-global","state":"MERGED","relation":"交叉引用"},{"url":"https:// 物、冲突、授权失败、精确目录确认、超时和上传不重试。\n- [x] 不保存用户密码，不收集或内置服务端私有机密；允许沿用当前浏览器已公开的客户端协议参数。不输出密码或 token；本地凭据目录0700、文件0600。\n- [x] 构建产物可运行，提供构建入口和自有使用文档。\n- [x] 用户名登录经同一 Console 调用既有 /oauth/token password form，不新增 CLI 专用登录 URL。保留原客户端注册/secret 匹配、用户认证和 session 检查；本次登录最小整改经独立安全评审，合并批准归 LF，不自动合并。HMAC/RSA 原 password grant 策略缺口另记，不夹带整改或虚报统一检查。\n- [x] 明确区分插件产品版本和 Chart 包版本。\n\n## 非目标\n不编译源码或构建镜像，不自动覆盖、不安装或升级、不直接修改 Plugin CR/GitOps/CRD，不直连 ChartMuseum、不调用 Marketplace sync。不修复母单其它子项，不把 publish 成功当安装可用。\n\n## 固定评审基线\nowner 确认的开工 main：4ec622cb918c5735c82fc6bb0964fbc479dbb6c6。\n\n## 已验收证据\n实际代码与策略：https://github.com/theriseunion/rise-global/pull/1360 、https://github.com/theriseunion/rise-global/pull/1472 。文档：https://github.com/theriseunion/rise-global/pull/1475 。最终CLI完整race和7组符号链接实际fixture日志已由控制者亲读，CI：https://github.com/theriseunion/rise-global/actions/runs/38734937918 。原spec的本地HTTP/真实文件测试边界不扩大成安装环境前置；不宣称全平台现场验收。详细本机记录见 .dsh/a2d2/issue-2114-acceptance-20261015.md。\n\n## 紧急程度\n常规，3.0。\n\n— reported by codex/global-cli\n","prs":[{"url":"https://github.com/theriseunion/rise-global/pull/1362","number":1362,"title":"docs(delivery): define Global deployment and acceptance boundaries","repo":"theriseunion/rise-global","state":"MERGED","relation":"交叉引用"},{"url":"https://github.com/theriseunion/rise-global/pull/1475","number":1475,"title":"docs(cli): clarify actual merged symlink rejection policy","repo":"theriseunion/rise-global","state":"MERGED","relation":"交叉引用"}]},{"id":2637,"title":"[Task] 拒绝插件 IAMRole/Category 并保护旧角色（母单 #2633）","shortTitle":"拒绝插件 IAMRole/Category 并保护旧角色（母单 #2633）","url":"https://github.com/theriseunion/freeland/issues/2637","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"CLOSED","projectStatus":"已修复","milestone":"3.0","tags":["ready-for-agent"],"parent":2633,"children":[],"body":"Part of theriseunion/freeland#2633. 关联 theriseunion/freeland#1994 与 #2549。\n\n设计：[ADR0045](https://github.com/theriseunion/rise-global/blob/docs/2633-plugin-iam-boundary/docs/a  只删 IAMRole，保留 grantOwner，挂载判断另开单）。\n\n## 现状（2026-10-17，rise-global-extension main）\n\n- storage 判断挂载读写的两处代码只看 IAMRoleBinding 上的 `iam.theriseunion.io/role` 标签是否为 `storage-writer` 或 `storage-owner`，再比对 scope 标签：\n  - `plugins/storage/backend/internal/handler/mounts.go` 的 `authorizedMode`；\n  - `plugins/storage/backend/internal/webhook/server.go` 的 `authorizedMode`（挂载准入 webhook）。\n- 平台创建绑定时，把这个标签设为角色名：rise-global `apiserver/internal/controller/iam/iamrolebinding_controller.go:314`、`apiserver/pkg/oapis/iam/v1alpha1/handler_member.go:453`。\n- 后端 `grantOwner`（`handler/iam.go`，由 `handler/volume.go` 建卷时调用）为建卷人创建 namespace 范围的绑定 `storage-owner-\u003cns>-\u003cuser>`，`roleRef` 指向 `storage-owner` IAMRole。\n\n## 问题\n\n1. 插件只交付 RoleTemplate 后，角色由用户或平台在具体 Scope 内创建，角色名任意。这类角色即使聚合了 `storage-writer` / `storage-owner` 模板，绑定上的 role 标签也不是这两个名字，挂载只能只读。\n2. chart 原来交付的 `storage-owner` IAMRole 没有 scope 标签，namespace 范围的 `grantOwner` 绑定被绑定控制器按 scope 不匹配跳过（190 新 apiserver 日志，2026-10-17，5 个 `storage-owner-*` 绑定）。因此建卷人通过网关访问 storage API 的权限没有投影；挂载读写仍因标签判断而生效。\n3. #2645 删除 chart 的 IAMRole 后，新环境里 `grantOwner` 绑定的 `roleRef` 指向不存在的角色，只起挂载标签的作用。\n\n## 目标\n\n- 挂载读写改为按实际权限判断，不依赖角色名（具体做法在设计阶段确定，例如对 storage 资源做授权检查，或解析绑定角色聚合的模板）。\n- 去掉 `grantOwner`，建卷人的权限由其所在 Scope 的角色决定。\n- 存量 `storage-owner-*` 绑定的处置单独说明，不自动删除。\n\n## 验收（草稿）\n\n- 用户在 namespace Scope 自建角色并聚合 `storage-writer`，绑定后获得读写挂载；只聚合 `storage-reader` 的只读挂载；跨 Scope 拒绝。API 挂载与准入 webhook 两条路径结论一致。\n- 去掉 `grantOwner` 后，新建卷不再产生 `storage-owner-*` 绑定。\n- 后端改动同时 bump `version` 与 `appVersion`。\n\n## 依赖\n\n- theriseunion/freeland#2645\n","prs":[{"url":"https://github.com/theriseunion/rise-global-extension/pull/1860","number":1860,"title":"fix(storage): 仅交付 RoleTemplate (theriseunion/freeland#2645)","repo":"theriseunion/rise-global-extension","state":"MERGED","relation":"交叉引用"}]},{"id":2944,"title":"[Bug] novanotebook 回收站模板授权的 API 组与插件路由不一致，非管理员读回收站 403（母单 #2633）","shortTitle":"novanotebook 回收站模板授权的 API 组与插件路由不一致，非管理员读回收站 403（母单 #2633）","url":"https://github.com/theriseunion/freeland/issues/2944","repo":"theriseunion/freeland","owners":["imneov"],"mine":true,"remote":"CLOSED","projectStatus":"已修复","milestone":"3.0","tags":["bug","ready-for-agent"],"parent":2633,"children":[],"body":"Part of theriseunion/freeland#2633。在 theriseunion/freeland#2646 验收中发现（2026-10-17，173）。\n\n## 现象\n\n非管理员用户的 platform 角色聚合了 `novanotebook-platform-view`，请求插件回收站列表 `GET /oapis/novanotebook.rise.io/v1alpha1/recyclerecords` 返回 403：\n\n```\nrecyclerecords.novanotebook.rise.io is forbidden: User \"iam2646-u1\" cannot list resource \"recyclerecords\" in API group \"novanotebook.rise.io\" at the cluster scope: no RBAC permission for iam2646-u1:list:recyclerecords\n```\n\n同一用户请求 `GET /oapis/task.rise.io/v1alpha1/recyclerecords` 返回 200，说明角色聚合与投影本身生效。平台管理员的规则是 `*`，不受影响，所以之前用管理员验证时发现不了。\n\n## 根因（已核实）\n\n- 插件的回收站代理路径是 `/oapis/novanotebook.rise.io/v1alpha1/recyclerecords*`（173 上的 ReverseProxy `risecloud/risecloud-rise.io--novanotebook-recycle-proxy`；前端 `plugins/novanotebook/src/api.ts:153-167`）。\n- 授权器按路径里的组 `novanotebook.rise.io` 判断（rise-global `apiserver/pkg/apiserver/request/requestinfo.go`）。\n- 两个模板授权的却是 `task.rise.io` 组：\n  - `novanotebook-platform-view`：`task.rise.io` `recyclerecords` `get,list,watch`；\n  - `novanotebook-platform-manage`：`task.rise.io` `recyclerecords/restore` `update`，以及 `recyclerecords` `delete`。\n- 前端恢复用 `POST .../recyclerecords/{name}/restore`，请求动词是 `create`，而模板给的是 `update`，动词也不匹配。\n\n## 影响\n\n只靠这两个模板授权的非管理员，无法通过插件路由查看、恢复、删除回收站记录。与 IAMRole 由插件预置还是由用户自建无关，是此前就存在的模板缺陷。\n\n## 修复方向（待确认）\n\n- 模板改为授权 `novanotebook.rise.io` 组的 `recyclerecords`（list / get / delete）与 `recyclerecords/restore`（create），并核对后端用调用者凭据访问 `task.rise.io` 时还需要哪些权限。\n- 用非管理员角色按插件实际路由回归。\n\n## 依赖\n\n- theriseunion/freeland#2646（验收中发现）\n","prs":[{"url":"https://github.com/theriseunion/rise-global-extension/pull/1885","number":1885,"title":"fix(novanotebook,custom-service): 回收站 RBAC 撤下平台 task 轴（theriseunion/freeland#2944）","repo":"theriseunion/rise-global-extension"," function prTable(list){return `<div class="table-scroll"><table><thead><tr><th>PR</th><th>标题 / 仓库</th><th>相关 Issue</th><th>远端状态快照</th></tr></thead><tbody>${list.map(p=>`<tr><td><a href="${esc(p.url)}" target="_blank" rel="noreferrer">#${p.number} ↗</a></td><td class="title-cell">${esc(p.title)}<div class="sub">${esc(p.repo)} · ${esc(p.relation)}</div></td><td><div class="row">${p.issues.map(id=>B('#'+id,'issue',id,'link small')).join('')}</div></td><td>${badge(p.state,p.state==='MERGED'?'purple':'')}<div class="sub">引用不代表任务验收</div></td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">此样例未收录 PR 引用。</div></td></tr>'}</tbody></table></div>`}
function sourceAttention(t){if(t.question&&!WorkModel.done(t))return t.question;if(t.handoff?.phase==='failed')return '接续准备失败，当前会话仍负责';const failed=workers(t).find(x=>x.state==='failed'&&!x.superseded);if(failed)return failed.title+' · '+(failed.result||'执行失败');const returned=[...workers(t),...jobs(t)].filter(x=>['returned','ended'].includes(x.state)&&!x.consumed);return returned.length?returned.length+' 项结果待收取':null}
function sourceOverview(){const list=sourceIssues(),prs=allPrs(),current=list.filter(t=>t.control&&!WorkModel.done(t)),attention=list.map(t=>({task:t,reason:sourceAttention(t)})).filter(x=>x.reason),recent=list.flatMap(t=>t.events.map(e=>({...e,issue:t.id,title:t.shortTitle}))).sort((a,b)=>b.time.localeCompare(a.time)).slice(0,6);return `<div class="source-overview stack">${queueIntentSummary()}<div class="facts" style="margin:0"><div><label>开放 Issue · 样例</label><strong class="count-number">${list.filter(t=>t.remote==='OPEN').length}</strong></div><div><label>已收录 PR</label><strong class="count-number">${prs.length}</strong></div><div><label>正在处理的工作</label><strong class="count-number">${current.length}</strong></div><div><label>需要关注</label><strong class="count-number">${attention.length}</strong></div></div><div class="row">${repositorySource()?'':B('查看项目视图 →','object','projects','link small')}${B('查看 Issue →','object','issues','link small')}${B('查看 PR →','object','prs','link small')}</div><section class="section flush"><div class="section-head"><h2>需要关注</h2><p>待你确认、待收取结果和当前尚未解决的执行问题。</p></div>${attention.length?`<div class="table-scroll"><table><thead><tr><th>工作</th><th>当前事项</th><th></th></tr></thead><tbody>${attention.map(({task:t,reason})=>`<tr><td class="title-cell">${B('#'+t.id+' '+esc(t.shortTitle),'issue',t.id,'link issue-title')}</td><td>${esc(reason)}</td><td>${B('查看执行','open-execution',t.id,'small')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">当前没有需要关注的事项。</p>'}</section><section class="section flush"><div class="section-head"><h2>正在处理</h2><p>当前来源中的工作及对应处理会话，接替后入口随之更新。</p></div>${current.length?`<div class="table-scroll"><table><thead><tr><th>Issue</th><th>当前处理</th><th>状态</th><th>进展</th><th></th></tr></thead><tbody>${current.map(t=>`<tr><td class="title-cell">${B('#'+t.id+' '+esc(t.shortTitle),'issue',t.id,'link issue-title')}</td><td>${esc(main(t).title)}<div class="sub">第 ${main(t).generation} 段</div></td><td>${execBadge(t)}</td><td>${esc(activity(t))}</td><td>${entry(t)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">尚无处理会话，可以从 Issue 开始。</p>'}</section><section class="section"><h2>最近进展</h2><div class="space">${recent.map(e=>`<div class="event"><time>${esc(e.time)}</time><div>${B('#'+e.issue,'issue',e.issue,'link small')} · ${esc(e.text)}</div></div>`).join('')||'<p class="empty">暂无本地执行记录。</p>'}</div></section><small class="muted">统计基于当前内置样例；来源内容为快照，本地执行为模拟。</small></div>`}
function sourceContent(){if(ui.object==='overview')return sourceOverview();if(ui.object==='prs')return `<div class="summary"><span>${repositorySource()?'该仓库的 PR 样例 · 当前仅内置已采集的交叉引用记录':'Project 相关 PR · 选取 Issue 最近交叉引用'}</span><span>GitHub 快照：2026-10-21</span></div>${prTable(allPrs())}`;const list=visibleIssues(),views=viewDefs(),v=views.find(x=>x.id===ui.projectView)||views[0];return `<nav class="views" aria-label="${ui.object==='projects'?'项目视图':'Issue 筛选'}">${views.map(x=>B(esc(x.name),'project-view',x.id,ui.projectView===x.id?'active':'')).join('')}</nav><div class="toolbar"><div class="search"><input id="issue-search" aria-label="搜索 Issue" placeholder="搜索标题、编号或标签" value="${esc(ui.query)}"><select id="label-filter" aria-label="标签筛选"><option value="">所有标签</option>${[...new Set(sourceIssues().flatMap(t=>t.tags))].sort().map(x=>`<option ${ui.tag===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><span class="field-caption">${ui.object==='projects'?'按 Project 视图组织内容':'按 Issue 的负责人和开闭状态筛选'}</span></div><div class="summary"><span>${list.length} 项样例 · ${esc(v.filter)}</span><span>选取 ${sourceIssues().length} 个代表 Issue，非${repositorySource()?'仓库':'Project'}全量</span></div>${issueTable(list,ui.object==='projects')}`}
function panel(){const p=currentProject();return `<div class="topline project-topline"><span>A²D² 控制面板</span>${projectSwitcher()}</div><div class="panel"><div class="between object-tabs"><nav class="tabs" role="tablist" aria-label="来源内容">${objectTabs().map(([id,title])=>`<button type="button" role="tab" data-act="object" data-id="${id}" aria-selected="${ui.object===id}" class="${ui.object===id?'active':''}">${title}</button>`).join('')}</nav></div>${!state.sourceOnline?'<div class="note amber" style="margin-bottom:15px">模拟来源不可用 · 保留已读取内容和本地工作。</div>':''}<section class="workbench"><div class="toolbar"><div><h3>${esc(p.name)}</h3><div class="source-info"><span>${esc(sourceLabel(p))}</span><span>账号：imneov</span></div></div>${queueControls()}</div><div role="tabpanel" aria-label="${objectTabs().find(x=>x[0]===ui.object)?.[1]||'概览'}">${sourceContent()}</div></section></div>`}
function activityList(t){return t.events.slice().reverse().map(e=>`<div class="event"><time>${e.time}</time><span>${esc(e.text)}</span></div>`).join('')||'<p class="empty">尚无本地执行记录。</p>'}
function taskHeader(t){return `<header class="detail-heading"><div class="grow"><div class="row">${B('← 返回任务列表','panel','','link small')}<span class="muted">/ #${t.id}</span></div><h1>${esc(t.title)}</h1><div class="row"><small class="muted">${esc(currentProject().name)} · ${esc(t.repo)}</small><a href="${esc(t.url)}" target="_blank" rel="noreferrer" class="small">GitHub ↗</a></div></div><div class="detail-actions">${entry(t,'primary small')}${B('自动接续','policy','','small')}</div></header>`}
function currentSection(t){const s=main(t);return `<section class="section execution-summary"><div class="between"><h2>${WorkModel.done(t)?'最后处理会话':'当前处理会话'}</h2>${B('会话与执行 →','issue-tab','execution','link small')}</div>${s?`<div class="task-current"><div class="grow"><div class="row"><b>${esc(s.title)}</b>${execBadge(t)}</div><small>第 ${s.generation} 段 · ${esc(activity(t))}</small></div>${B(WorkModel.done(t)?'查看记录':'进入当前会话','session',s.id,'small')}</div>`:`<p class="space">${t.mine?'尚未开始处理。开始后自动创建对应会话，并保留这个 Issue 入口。':'此项由其他负责人处理，可在这里查看关系与协作背景。'}</p>`}</section>`}
function questionSection(t){return `<section class="section"><div class="between"><h2>需要你确认 · #${t.id}</h2>${B('回复并继续','answer',t.id,'small')}</div><p class="space">${esc(t.question)}</p></section>`}
function syncNotice(t){return `<div class="note amber between"><span>本地已验收完成，Issue 关闭${t.sync==='error'?'同步失败':'待同步'}。</span>${B('模拟补同步','sync',t.id,'small')}</div>`}
function overview(t){const scope=taskScope(t);return `<div class="stack"><section class="section"><h2>工作概览</h2><div class="facts"><div><label>本地处理 · 模拟</label>${execBadge(t)}</div><div><label>${repositorySource()?'来源范围':'Project 状态'}</label>${repositorySource()?badge('仓库 '+currentProject().repository):badge(t.projectStatus)}</div><div><label>GitHub 状态</label>${badge(t.remote,t.remote==='OPEN'?'green':'')}</div><div><label>协作 / 后台</label><strong>${scope.flatMap(workers).filter(x=>x.state==='running').length} 个会话运行中 · ${scope.flatMap(jobs).filter(x=>x.state==='running').length} 个作业</strong></div></div>${t.children.length?`<p class="space">${kids(t).filter(WorkModel.done).length} / ${kids(t).length} 个直接子 Issue 已结束 · ${kids(t).filter(c=>!c.mine).length} 个协作项不属于当前负责人范围</p>`:''}</section>${currentSection(t)}<section class="section"><h2>Issue 信息</h2><div class="facts two"><div><label>负责人</label><strong>${esc(t.owners.join(', ')||'未分配')}</strong></div><div><label>迭代</label><strong>${esc(t.milestone)}</strong></div><div><label>父任务</label>${t.parent?B('#'+t.parent+' '+esc(task(t.parent)?.shortTitle||''),'issue',t.parent,'link small'):'<span class="muted">无原生父任务</span>'}</div><div><label>标签</label><div class="row">${t.tags.map(x=>badge(x)).join('')||'<span class="muted">无</span>'}</div></div><details class="space"><summary class="muted small" style="cursor:pointer">查看 Issue 原文快照 · 2026-10-21</summary><div class="native-description">${esc(t.body||'此项仅收录关系与基本字段。')}</div></details></section><section class="section"><div class="between"><h2>自动接续</h2>${B('查看参数与接续记录 →','issue-tab','continuation','link small')}</div><p class="space">${state.policy.enabled?'已开启 · '+state.policy.threshold+'K tokens':'已关闭'} · 项目主处理会话共用此设置</p></section>${scope.filter(x=>x.question&&!WorkModel.done(x)).map(questionSection).join('')}${t.execution==='done'&&t.sync!=='synced'?syncNotice(t):''}</div>`}
function workerRows(list){return list.map(x=>`<tr><td>${B('#'+x.issue,'issue',x.issue,'link small')}</td><td>${badge(roleNames[x.role])}</td><td>${B(esc(x.title),'session',x.id,'link')}<div class="sub">由第 ${sess(x.createdBy)?.generation||1} 段派发</div></td><td>${badge(sessionNames[x.state],tone(x.state))}${x.state==='returned'?`<div class="sub">${x.consumed?'已收取':'待收取'}</div>`:''}</td><td>${esc(x.result||'')}</td><td>${x.state==='failed'&&!x.superseded?B('沿原范围重试','retry-child',x.id,'small'):x.state==='returned'&&!x.consumed?B('收取结果','consume',x.issue,'small'):B('查看','session',x.id,'link small')}</td></tr>`).join('')}
function execution(t){const scope=taskScope(t),ws=scope.flatMap(workers),js=scope.flatMap(jobs),liveWorkers=ws.filter(x=>!x.superseded),oldWorkers=ws.filter(x=>x.superseded),liveJobs=js.filter(x=>!x.superseded),historic=scope.flatMap(x=>state.sessions.filter(s=>s.issue===x.id&&s.role==='control'&&s.state==='retired'));const unconsumed=liveWorkers.filter(x=>x.state==='returned'&&!x.consumed).length+liveJobs.filter(x=>x.state==='ended'&&!x.consumed).length;return `<div class="stack"><section class="section execution-summary"><div class="between"><h2>当前执行概览</h2>${execBadge(t)}</div><p class="space">${esc(activity(t))}</p><div class="facts"><div><label>运行中的协作会话</label><strong class="count-number">${liveWorkers.filter(x=>x.state==='running').length}</strong></div><div><label>后台工作</label><strong class="count-number">${liveJobs.filter(x=>x.state==='running').length}</strong></div><div><label>待收取结果</label><strong class="count-number">${unconsumed}</strong></div><div><label>待你确认</label><strong class="count-number">${scope.filter(x=>x.question&&!WorkModel.done(x)).length}</strong></div></div><p class="space small">${t.children.length?'汇总当前 Issue 与已收录子 Issue 的执行；其他负责人协作项只展示背景。':'包含这项工作的主处理、协作会话和各执行者的后台工作。'}</p></section>${currentSection(t)}${scope.filter(x=>x.question&&!WorkModel.done(x)).map(questionSection).join('')}${kids(t).length?`<section class="section flush"><div class="section-head"><h2>子 Issue 的处理入口</h2><p>每项保留自己的处理会话，父任务负责协调。</p></div>${issueTable(kids(t))}</section>`:''}<section class="section flush"><div class="section-head between"><div><h2>协作执行 · ${liveWorkers.length}</h2><p>实施、评审与验证按用途展示；返回结果不等于任务验收。</p></div>${t.control&&!WorkModel.done(t)?B('委派工作','delegate',t.id,'small'):''}</div><div class="table-scroll"><table><thead><tr><th>工作</th><th>用途</th><th>会话</th><th>执行状态</th><th>最近结果 / 待办</th><th></th></tr></thead><tbody>${workerRows(liveWorkers)||'<tr><td colspan="6"><div class="empty">暂无协作会话。</div></td></tr>'}</tbody></table></div></section><section class="section flush"><div class="section-head"><h2>后台工作 · ${liveJobs.length}</h2><p>保留所属执行者，主会话没有作业时也能看到子会话的工作。</p></div><div class="table-scroll"><table><thead><tr><th>工作</th><th>作业</th><th>所属执行者</th><th>状态</th><th>最近结果</th><th></th></tr></thead><tbody>${liveJobs.map(j=>`<tr><td>${B('#'+j.issue,'issue',j.issue,'link small')}</td><td>${esc(j.title)}<div class="sub">${esc(j.kind)}</div></td><td>${B(esc(sess(j.owner)?.title||'未知执行者'),'session',j.owner,'link small')}</td><td>${badge(j.state==='ended'?'已结束':j.state==='failed'?'失败':'运行中',tone(j.state))}<div class="sub">${j.state==='ended'?(j.consumed?'已收取':'待收取'):''}</div></td><td>${esc(j.result)}</td><td>${j.state==='ended'&&!j.consumed?B('收取结果','consume',j.issue,'small'):B('详情','job',j.id,'link small')}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">暂无后台作业。</div></td></tr>'}</tbody></table></div></section><details class="history"><summary>历史接替与已替换尝试 · ${historic.length+oldWorkers.length+js.filter(x=>x.superseded).length} 条</summary><div class="history-content">${historic.map(x=>`<div class="relationship-row"><div class="grow">#${x.issue} · 第 ${x.generation} 段 · ${esc(x.title)}<div class="sub">已由后继接替，历史记录保留。</div></div>${B('查看历史','session',x.id,'small')}</div>`).join('')}${oldWorkers.map(x=>`<div class="relationship-row"><div class="grow">${esc(x.title)}<div class="sub">${esc(x.result)} · 不计入当前阻塞</div></div>${B('查看尝试','session',x.id,'small')}</div>`).join('')}${js.filter(x=>x.superseded).map(x=>`<div class="relationship-row"><div class="grow">${esc(x.title)}<div class="sub">${esc(x.result)}</div></div>${B('查看','job',x.id,'small')}</div>`).join('')}${!historic.length&&!oldWorkers.length&&!js.some(x=>x.superseded)?'<p class="empty">暂无历史记录。</p>':''}</div></details>${t.execution==='done'&&t.sync!=='synced'?syncNotice(t):''}</div>`}
function continuation(t,viewing=null){const s=main(t),h=t.handoff,owns=!viewing||viewing.role==='control'&&viewing.id===t.control,pending=WorkModel.pending(state,t),phase=h?.phase;const stages=[['preparing','准备接续'],['collecting','收尾与交接'],['ready','等待接任'],['taken','继续工作']],index=phase==='collecting'?1:phase==='ready'?2:phase==='taken'?3:0;return `<div class="stack"><section class="section"><h2>当前接续配置</h2><div class="policy-fields"><div><label>自动接续</label><strong>${state.policy.enabled?'已开启':'已关闭'}</strong></div><div><label>接续目标</label><strong>${state.policy.threshold}K tokens</strong></div><div><label>适用范围</label><strong>项目管理 v3.0 · 主处理会话</strong></div><div><label>当前负责会话</label><strong>${s?'第 '+s.generation+' 段':'尚未开始'}</strong></div><div><label>上下文用量 · 模拟</label><strong>${s?s.tokens+'K / 400K':'—'}</strong></div><div><label>接续时保留</label><strong>目标、决定、结果、待办与历史</strong></div></div><p class="space">在安全边界接续。新会话准备好后，原会话仍负责，直到正式接任。</p>${viewing&&!owns?'<div class="note space">当前查看的是协作或历史会话；这里展示对应任务的主处理接续记录。</div>':''}</section>${h?`<section class="section"><div class="between"><h2>${phase==='taken'?'最近一次接续':'本次接续'}</h2>${badge(({preparing:'准备中',collecting:'收取必要结果',ready:'可接替',failed:'准备失败',taken:'已接替'})[phase],tone(phase))}</div><div class="step-list">${stages.map(([id,name],i)=>`<span class="step ${i===index&&phase!=='failed'?'active':i<index?'done':''}">${i+1}. ${name}</span>`).join('')}</div><div class="facts two"><div><label>来源会话</label>${B('第 '+sess(h.from).generation+' 段 · '+esc(sess(h.from).title),'session',h.from,'link small')}</div><div><label>后继会话</label><strong>第 ${sess(h.to).generation} 段 · ${phase==='taken'?'已正式接任':'尚未成为当前处理会话'}</strong></div><div><label>原因</label><span>${esc(h.reason)}</span></div><div><label>下一步</label><span>${esc(h.nextStep)}</span></div></div>${phase==='collecting'?`<div class="note amber space">还有 ${pending.length} 项执行或结果需要收尾。待办和历史会保留。</div><div class="space">${pending.map(x=>`<div class="relationship-row"><span class="grow">${esc(x.title)}</span>${badge(x.state==='running'?'运行中':'待收取',x.state==='running'?'purple':'amber')}</div>`).join('')}</div>`:''}${phase==='failed'?'<div class="note amber space">后继准备未成功，原会话与 Issue 入口保持不变。重试复用本次后继。</div>':''}${h.summary?`<div class="note space">${esc(h.summary)}</div>`:''}<div class="row space">${phase==='failed'&&owns?B('重试本次接续','handoff-retry',t.id,'primary small'):phase==='ready'&&owns?B('接替并继续','take',t.id,'primary small'):phase==='taken'?B('进入当前会话','session',t.control,'small'):owns&&pending.some(x=>['returned','ended'].includes(x.state)&&!x.consumed)?B('收取已返回结果','consume',t.id,'primary small'):''}${phase!=='taken'?B('查看全部执行','open-execution',t.id,'link small'):''}</div></section>`:s&&!WorkModel.done(t)&&owns?`<section class="section between"><div><h2>尚未开始本次接续</h2><p class="space">当前仍由第 ${s.generation} 段负责，可按阈值自动接续或提前准备。</p></div>${B('准备接续','prepare',t.id,'small')}</section>`:''}${t.decisions.length?`<section class="section"><h2>已确认的决定</h2>${t.decisions.map(text=>`<p class="space">${esc(text)}</p>`).join('')}</section>`:''}<section class="section"><h2>接续历史</h2>${t.history.map(x=>`<div class="relationship-row"><div class="grow"><b>第 ${sess(x.from).generation} 段 → 第 ${sess(x.to).generation} 段</b><div class="sub">${esc(x.reason)} · ${esc(x.summary)}</div></div>${B('查看旧段','session',x.from,'link small')}</div>`).join('')||'<p class="space">暂无接续记录。会话换段后，这里的记录持续保留。</p>'}</section></div>`}
function relatedView(t){return `<div class="stack">${t.parent?`<section class="section"><h2>父 Issue</h2><div class="space">${B('#'+t.parent+' '+esc(task(t.parent)?.title||'查看原生父任务'),'issue',t.parent,'link')}</div><p class="space">父子任务关系与 DSH 会话父子关系分别呈现。</p></section>`:''}<section class="section flush"><div class="section-head"><h2>原生子 Issue · ${kids(t).length}</h2><p>保留跨负责人或迭代的关系背景，不自动扩大个人执行范围。</p></div>${kids(t).length?issueTable(kids(t)):'<p class="empty">暂无原生子 Issue。正文中的步骤或引用不自动变成子任务。</p>'}</section><section class="section flush"><div class="section-head"><h2>PR 引用 · ${t.prs.length}</h2><p>选取最近引用快照；PR 合并与本任务验收分别判断。</p></div>${prTable(t.prs.map(p=>({...p,issues:[t.id]})))}</section></div>`}
function issuePage(){const t=task(ui.issue);if(!t)return '<div class="panel"><h1>此项未收录在当前样例中</h1></div>';const tabs=[['overview','概览'],['execution','会话与执行'],['continuation','接续'],['related','相关工作'],['activity','活动']];return `<div class="topline"><span>${esc(currentProject().name)} / #${t.id}</span><span class="mock">GitHub 结构快照 · 本地执行模拟</span></div><div class="issue-page">${taskHeader(t)}<nav class="detail-tabs" role="tablist" aria-label="Issue 详情">${tabs.map(([id,title])=>`<button type="button" role="tab" data-act="issue-tab" data-id="${id}" aria-selected="${ui.issueTab===id}" class="${ui.issueTab===id?'active':''}">${title}</button>`).join('')}</nav><div role="tabpanel" aria-label="${tabs.find(x=>x[0]===ui.issueTab)?.[1]}">${ui.issueTab==='overview'?overview(t):ui.issueTab==='execution'?execution(t):ui.issueTab==='continuation'?continuation(t):ui.issueTab==='related'?relatedView(t):`<section class="section"><h2>本地活动 · 模拟</h2><div class="space">${activityList(t)}</div></section>`}</div></div>`}
function headerPopover(s,t){if(!ui.headerMenu)return '';let body='';if(ui.headerMenu==='task')body=`<h3>关联任务</h3><div class="row">${badge(s.role==='control'?(s.id===t.control?'当前处理':'接替历史'):roleNames[s.role]+'会话')}${execBadge(t)}</div><p><b>#${t.id} ${esc(t.shortTitle)}</b></p><p>${esc(activity(t))}</p><div class="row">${B('查看任务详情','issue',t.id,'link small')}${B('查看全部执行','open-execution',t.id,'link small')}</div>${s.role==='control'&&s.id!==t.control?`<div class="space">${B('进入当前处理会话','session',t.control,'small')}</div>`:''}`;else if(ui.headerMenu==='children'){const list=state.sessions.filter(x=>x.createdBy===s.id);body=`<h3>本会话的子智能体 · ${list.length}</h3>${list.map(x=>`<div class="relationship-row"><div class="grow">${B(esc(x.title),'session',x.id,'link small')}<div class="sub">${roleNames[x.role]} · ${sessionNames[x.state]}</div></div></div>`).join('')||'<p>此段尚未派发子会话。</p>'}<div class="space">${B('按任务查看全部执行','open-execution',t.id,'link small')}</div>`}else{const list=state.jobs.filter(j=>j.owner===s.id);body=`<h3>本会话的后台工作 · ${list.length}</h3>${list.map(j=>`<div class="relationship-row">${B(esc(j.title),'job',j.id,'link small')}</div>`).join('')||'<p>本会话没有直接拥有的后台作业。子执行者的工作可以在任务详情统一查看。</p>'}<div class="space">${B('查看任务的后台工作','open-execution',t.id,'link small')}</div>`}return `<section class="header-popover" aria-label="会话关联浮层"><div class="between"><small class="muted">${ui.headerMenu==='task'?'工作与进展':'DSH 会话入口示意'}</small>${B('×','header-close','','quiet icon')}</div>${body}</section>`}
function chat(){const s=sess(ui.session);if(!s)return '<div class="panel"><h1>选择会话</h1></div>';const t=task(s.issue),isMain=s.role==='control',readonly=['retired','prepared','failed','completed'].includes(s.state),children=state.sessions.filter(x=>x.createdBy===s.id),ownedJobs=state.jobs.filter(x=>x.owner===s.id);return `<header class="chat-header"><h1>${esc(s.title)}</h1><div class="header-anchor">${B('▤ 关联任务 #'+t.id+' ⌄','header-menu','task','header-action')}${headerPopover(s,t)}</div>${B(children.length+' 个子智能体 ⌄','header-menu','children','header-action')}${B(ownedJobs.length+' 个后台任务 ⌄','header-menu','jobs','header-action')}</header><nav class="chat-tabs" role="tablist" aria-label="会话视图">${[['dialogue','对话'],['trace','轨迹'],['continuation','接续']].map(([id,label])=>`<button type="button" role="tab" data-act="chat-tab" data-id="${id}" aria-selected="${ui.chatTab===id}" class="${ui.chatTab===id?'active':''}">${label}</button>`).join('')}</nav>${ui.chatTab==='continuation'?`<div class="continuation-view" role="tabpanel" aria-label="接续">${continuation(t,s)}</div>`:ui.chatTab==='trace'?`<div class="trace-view" role="tabpanel" aria-label="轨迹"><section class="section"><h2>当前工作事件 · 模拟</h2><p class="space">用于观察状态变化；这里不执行真实工具。</p><div class="space">${activityList(t)}</div></section></div>`:`<div class="chat-body" role="tabpanel" aria-label="对话">${s.state==='retired'?`<div class="handoff-note between"><span>第 ${s.generation} 段已接替，历史内容保留。</span>${B('进入当前会话','session',t.control,'small')}</div>`:s.handoffSummary?`<div class="handoff-note"><b>已接续当前工作 · 第 ${s.generation} 段</b><p style="margin-top:8px">${esc(s.handoffSummary)}</p></div>`:''}${t.handoff&&t.handoff.phase!=='taken'&&s.id===t.control?`<div class="handoff-note between"><span>正在准备接续，当前仍由本段负责。</span>${B('查看接续进度','chat-tab','continuation','link small')}</div>`:''}<div class="message user"><div class="speaker">LF</div><div class="text">${esc(isMain?'请处理 #'+t.id+'，沿用项目现有工作方式；保留已确认范围和相关进展。':'请完成这项独立的'+roleNames[s.role]+'工作，结果交回负责会话。')}</div></div><div class="message assistant"><div class="speaker">Assistant · ${sessionNames[s.state]}</div><div class="text">${esc(isMain?t.children.length?'已关联 #'+t.id+'。我会协调子 Issue 的处理，各项保留自己的会话与验收。\n\n'+activity(t):t.question?'当前需要确认：'+t.question+'\n已有工作与结果保留，回复后继续。':s.state==='completed'?'这项工作已收到模拟验收通过结果，处理记录已保留。':'已关联 #'+t.id+'。'+activity(t)+'。\n\n任务的“会话与执行”页会统一显示实施、评审、后台工作和接替历史。':s.result||'已接收独立工作。')}</div></div>${s.messages.map(m=>`<div class="message ${m.role}"><div class="speaker">${m.role==='user'?'LF':'Assistant'}</div><div class="text">${esc(m.text)}</div></div>`).join('')}</div>`}<div class="composer"><form id="chat-form" class="composer-box"><textarea id="chat-input" aria-label="消息" placeholder="${readonly?'此会话仅保留记录':'发送消息，继续当前工作'}" ${readonly?'disabled':''}>${esc(ui.drafts[s.id]||'')}</textarea><div class="composer-foot"><span>${readonly?'历史 / 结束记录':'沿用项目配置'} · 内存模拟</span><div class="row"><span>${roleNames[s.role]}会话</span><button type="submit" class="primary small" ${readonly?'disabled':''}>发送 ↑</button></div></div></form></div>`}
function orb(){if(ui.page!=='chat')return '';const s=sess(ui.session),t=task(s.issue),pct=Math.min(100,Math.round(s.tokens/400*100)),warn=s.tokens>=state.policy.threshold*.85;const position=ui.orbPoint?`left:${ui.orbPoint.x}px;top:${ui.orbPoint.y}px;right:auto;bottom:auto`:'';const current=s.id===t.control&&!WorkModel.done(t);return `<div class="orb-anchor" style="${position}">${!ui.orb?`<div class="orb-hover">${B('下一步','orb-toggle','','small')}</div>`:''}<button type="button" class="orb-button ${warn?'warn':''}" data-act="orb-toggle" aria-label="上下文 ${s.tokens}K，打开下一步" aria-expanded="${ui.orb}" title="点击查看下一步，拖动可移动"><span class="orb-water" style="--fill:${pct}%"></span><b>${s.tokens}K</b><small>${pct}%</small></button>${ui.orb?`<section class="orb-card" aria-label="下一步"><div class="between"><h2>下一步</h2>${B('×','orb-close','','quiet icon')}</div><section><div class="row">${badge(sessionNames[s.state],tone(s.state))}${badge(roleNames[s.role])}</div><p class="space">${esc(s.role==='control'?activity(t):s.result||'')}</p><div class="between space"><span>上下文 ${s.tokens}K / 400K</span><small>${pct}%</small></div><div class="progressbar"><span style="width:${pct}%"></span></div><div class="between"><small class="muted">费用：未配置费率</small>${B('自动接续 '+(state.policy.enabled?state.policy.threshold+'K':'关闭'),'policy','','link small')}</div>${warn&&current?`<p class="space" style="color:var(--amber)">接近接续目标，必要结果收齐后再切换。</p>`:''}</section><section><h3>当前工作</h3><p class="space">#${t.id} · ${esc(t.shortTitle)}</p>${B('查看完整执行状态','open-execution',t.id,'chip')}${B('查看接续参数与记录','chat-tab','continuation','chip')}${!['retired','prepared','completed','failed'].includes(s.state)?B((t.question?'补充当前确认':'继续当前工作')+'<small>填入输入框，由你发送</small>','draft','continue','chip'):''}</section><details><summary>其他走法</summary><div class="row">${current?B('准备接续','prepare',t.id,'small'):''}${!['retired','prepared','completed','failed'].includes(s.state)?B('准备委派指令','draft','delegate','small'):''}${ui.orbPoint?B('恢复悬浮球位置','orb-reset','','small'):''}</div></details><p class="micro">原型模拟 · 建议不调用真实模型</p></section>`:''}</div>`}
const scenarios={overview:{name:'统一状态',description:'打开 #3342，查看跨子 Issue 的当前会话、协作执行、后台工作和待你确认事项。'},start:{name:'Issue 开始',description:'从尚未处理的 #3026 开始，创建对应会话；重复进入复用同一个入口。'},handoff:{name:'会话接替',description:'后继准备时原会话仍负责；执行返回、结果收齐后再接替。自动接续可用 +30K 事件触发。'},results:{name:'失败与重试',description:'失败尝试保留历史；沿原范围重试后，新尝试成为当前协作，避免把已替换的失败当现有阻塞。'},attention:{name:'确认与保留',description:'回复当前问题，再接续；后继的摘要应保留你的具体决定。'},queue:{name:'持续处理',description:'用一段话委托 AI，查看排好序的 Issue 和每项下一步；Block 名单约束后续安排，不需要手动排序。'}};

'可接替',taken:'已接替',failed:'需重试',preparing:'准备中'})[h?.phase]||'未准备'}</div><div><label>本地状态</label>${stateNames[t.execution]}</div><div><label>持续处理</label>${state.queue.enabled?'#'+(state.queue.current||'等待'):'未开启'}</div></div><div class="demo-actions">${B('上下文 +30K','context',t.id,'',!s||WorkModel.done(t))}${B('执行结果返回','results',t.id)}${B('评审开始','review',t.id)}${B('后继准备失败','handoff-fail',t.id,'',!h||!['collecting','ready'].includes(h.phase))}${B('收到验收通过','complete',t.id,'',!s||WorkModel.done(t))}${B(state.sourceOnline?'来源不可用':'恢复来源','network')}${B('恢复初始样例','reset')}</div><p>结果返回、收取、验收通过分别改变状态；父任务不会自动把所有子项标为完成。</p></section></div></details>`}
let formSubmit=null,toastTimer=null;

let queueDraft=null;
const QUEUE_EXAMPLE='持续推进分配给我的镜像相关 Issue，先收尾已有工作，后端优先。页面调整先放着，已有会话直接继续，需要我决定的地方再问我。';
function continuousPrompt(source,instruction,blocklist){const context=sourceIssues().map(t=>({issue:t.id,title:t.title,owners:t.owners,state:t.remote,parent:t.parent,children:t.children,projectStatus:source.sourceType==='project'?t.projectStatus:undefined,session:t.control,execution:t.execution,question:t.question,recent:t.events.slice(-3)}));return ['你负责在指定来源内持续推进工作。','用户委托：',instruction,'来源：'+JSON.stringify({id:source.id,type:source.sourceType,url:source.entryUrl}),'Block名单：'+JSON.stringify(blocklist),'工作上下文：'+JSON.stringify(context),'结合用户原话、Issue范围、依赖、既有会话和最新进展决定处理顺序；不能把所有开放Issue直接当待办。Block项不得接入或重新派发。已有会话优先复用，父子协调和独立执行分清，避免重复工作。','返回可展示的有序Issue列表，每项写明纳入原因、下一步、已有会话/新建会话，以及等待或暂缓原因；保留Block名单。用户通过补充自然语言调整，列表不要求手动排序。'].join('\n\n')}
function demoContinuousPlan(){return [3270,3026,3025].map(task).filter(t=>t&&sourceIssues().some(x=>x.id===t.id)&&!WorkModel.done(t)).map(t=>({issue:t.id,status:t.question?'waiting':'pending',reason:t.id===3270?'已有实施、评审和检查，先把当前修复收尾。':t.id===3026?'已有独立 Issue，处理迟到写回问题，不扩大页面范围。':'这项页面工作仍在等你确认，暂缓推进。',nextAction:t.id===3270?'继续普通用户路径修复与回归。':t.id===3026?'读取现有证据，定位写回竞争并完成验证。':'保留已有会话，等待范围确认。'}))}
function queueStepState(step,q){const t=task(step.issue);if(q.current===step.issue&&!WorkModel.done(t))return q.blocklist.includes(step.issue)?'当前收尾 · 后续 Block':'当前处理';if(WorkModel.done(t))return '已完成';if(t?.question||['waiting-human','waiting-result'].includes(t?.execution))return '等待中';return q.enabled?'接下来':'准备处理'}
function queuePlanList(plan,q,preview=false){const list=plan.filter(step=>!q.blocklist.includes(step.issue)||q.current===step.issue);return `<ol style="list-style:none;padding:0;margin:12px 0">${list.map((step,index)=>{const t=task(step.issue);return `<li class="relationship-row" style="align-items:flex-start"><span class="badge">${index+1}</span><div class="grow"><b>#${step.issue} ${esc(t?.shortTitle||'')}</b><div class="row" style="margin-top:5px">${badge(queueStepState(step,q),step.issue===q.current?'purple':t?.question?'amber':'')}${badge(t?.control?'继续已有会话':'需要时创建会话')}</div><p class="small" style="margin-top:7px">${esc(step.reason)}</p><div class="sub">下一步：${esc(step.nextAction)}</div></div>${B('Block',preview?'queue-draft-block':'queue-block',step.issue,'quiet small')}</li>`}).join('')||'<li class="empty">当前安排均在 Block 名单中，不启动处理。</li>'}</ol>`}
function queueBlockList(q,preview=false){return `<details class="space" ${q.blocklist.length?'open':''}><summary style="cursor:pointer" class="small">Block 名单 · ${q.blocklist.length}</summary><div style="margin-top:9px">${q.blocklist.map(id=>`<div class="relationship-row"><div class="grow">#${id} ${esc(task(id)?.shortTitle||'')}<div class="sub">后续安排不再接入此项</div></div>${B('解除 Block',preview?'queue-draft-unblock':'queue-unblock',id,'link small')}</div>`).join('')||'<p class="small">尚无 Block 项。</p>'}${preview?'<div class="row space"><input id="queue-block-id" aria-label="加入Block的Issue编号" placeholder="Issue 编号，例如 #3025" style="width:190px">'+B('加入 Block','queue-block-add','','small')+'</div>':''}<p class="small space">已在处理的工作保留收尾，不会因加入 Block 被强行终止。</p></div></details>`}
function queueIntentSummary(){const q=state.queue;if(!q.instruction||q.sourceId!==currentProject().id)return '';const t=task(q.current);return `<section class="section"><div class="between"><h2>持续处理</h2><div class="row">${badge(q.enabled?'已开启':'已暂停',q.enabled?'green':'')}${B('补充 / 调整委托','queue-settings','','link small')}</div></div><p class="space" style="white-space:pre-wrap">${esc(q.instruction)}</p><div class="task-current"><div class="grow"><b>${!q.enabled?'已暂停接新工作':t?'当前推进 #'+t.id:q.awaitingDecision?'等待条件满足后继续':'本次安排已处理完或已 Block'}</b><small>${esc(!q.enabled?'当前处理会话及历史继续保留。':t?q.reason:'后续根据工作变化再判断。')}</small></div>${q.enabled&&t?B('查看执行','open-execution',t.id,'small'):''}</div>${queuePlanList(q.plan,q)}${queueBlockList(q)}<small class="muted">当前排序为固定场景的模拟 AI 安排，未调用模型解释任意委托。</small></section>`}
function queueInstructionForm(){const p=currentProject(),q=state.queue,same=q.sourceId===p.id,previous=queueDraft?.source.id===p.id?queueDraft.instruction:same?q.instruction:'';showModal('持续处理',`<small class="muted">${esc(p.name)}</small><label>你希望如何持续推进？<textarea name="instruction" required style="min-height:150px" placeholder="${esc(QUEUE_EXAMPLE)}">${esc(previous)}</textarea></label>${B('填入示例委托','queue-example','','link small')}<p class="small muted">这段话会与当前来源、Issue 和会话进展一起带入提示词模板，生成具体处理安排。</p>`,'查看处理安排',v=>{if(!v.instruction.trim())throw Error('请描述你希望持续推进的工作。');queueDraft={source:structuredClone(p),instruction:v.instruction.trim(),plan:demoContinuousPlan(),blocklist:queueDraft?.source.id===p.id?[...queueDraft.blocklist]:same?[...q.blocklist]:[]};closeModal();queuePlanModal()})}
function queuePlanModal(){const d=queueDraft;if(!d)return;const q={...d,enabled:false,current:state.queue.sourceId===d.source.id?state.queue.current:null};showModal('持续处理安排',`<small class="muted">${esc(d.source.name)}</small><p style="white-space:pre-wrap">${esc(d.instruction)}</p>${B('补充或修改委托','queue-adjust','','link small')}<div class="note">本原型用 #3342 系列演示排序结果，未调用真实模型理解你的文字。正式功能应由模型按委托返回此列表。</div>${queuePlanList(d.plan,q,true)}${queueBlockList(q,true)}`,'开始持续处理',()=>{if(!d.plan.length)throw Error('当前样例没有可展示的安排。');const prompt=continuousPrompt(d.source,d.instruction,d.blocklist);closeModal();apply({type:'queue',enabled:true,instruction:d.instruction,source:d.source,plan:d.plan,blocklist:d.blocklist,prompt})})}
function resetScenario(id='overview'){state=WorkModel.initial();Object.assign(ui,{page:'panel',object:'overview',projectView:'mine',query:'',tag:'',issue:3342,issueTab:'overview',session:'main-3342',chatTab:'dialogue',focus:3270,headerMenu:null,orb:false,orbPoint:null,drafts:{},scenario:id});if(id==='overview'){ui.page='issue';ui.issueTab='execution';ui.focus=3342}else if(id==='start'){ui.page='issue';ui.issue=3026;ui.focus=3026}else if(id==='handoff'){ui.page='chat';ui.session='main-3270-2';ui.chatTab='continuation';ui.focus=3270}else if(id==='results'){ui.page='issue';ui.issue=3270;ui.issueTab='execution';ui.focus=3270}else if(id==='attention'){ui.page='issue';ui.issue=3025;ui.issueTab='execution';ui.focus=3025}closeModal();render();window.scrollTo(0,0)}

 'panel':()=>{ui.page='panel';ui.headerMenu=null;ui.orb=false;render()},
 'object':id=>{ui.object=objectTabs().some(x=>x[0]===id)?id:'overview';ui.projectView='mine';ui.query='';ui.tag='';render()},

 'header-menu':id=>{ui.headerMenu=ui.headerMenu===id?null:id;render()},

 'prepare':id=>{apply({type:'prepare',issue:Number(id)});if(ui.page==='chat')ui.chatTab='continuation';else{ui.page='issue';ui.issue=Number(id);ui.issueTab='continuation'}ui.orb=false;render()},
 'take':id=>apply({type:'take',issue:Number(id)}),
 'handoff-retry':id=>apply({type:'handoff-retry',issue:Number(id)}),
 'consume':id=>apply({type:'consume',issue:Number(id)}),
 'retry-child':id=>{const s=sess(id);apply({type:'retry-child',issue:s.issue,session:id})},
 'answer':id=>{const t=task(id);if(!t.question){notify('当前没有待确认问题。');return}showModal('回复 #'+id,`<div class="note">${esc(t.question)}</div><label>你的决定<textarea name="answer" required placeholder="这项决定会在接续时保留"></textarea></label>`,'记录并继续',v=>{if(!v.answer.trim())throw Error('请输入具体决定。');closeModal();apply({type:'answer',issue:t.id,text:v.answer.trim()})})},
 'delegate':id=>{const t=task(id);showModal('委派独立工作',field('工作范围','title','','required placeholder="例如：核对普通用户错误提示"')+selectField('用途','role',[['implement','实施'],['review','评审']],'review')+`<div class="note">关联 #${t.id}；不新建子 Issue，不替换当前处理会话。</div>`,'创建协作会话',v=>{if(!v.title.trim())throw Error('请输入工作范围。');closeModal();apply({type:'delegate',issue:t.id,title:v.title.trim(),role:v.role})})},
 'queue-settings':()=>{const q=state.queue,p=currentProject();if(q.instruction&&q.sourceId===p.id){queueDraft={source:structuredClone(p),instruction:q.instruction,plan:structuredClone(q.plan),blocklist:[...q.blocklist]};queuePlanModal()}else{queueDraft=null;queueInstructionForm()}},
 'queue-example':()=>{const input=$('#modal textarea[name="instruction"]');if(input){input.value=QUEUE_EXAMPLE;input.focus()}},
 'queue-adjust':()=>{closeModal();queueInstructionForm()},
 'queue-draft-block':id=>{if(queueDraft&&!queueDraft.blocklist.includes(Number(id)))queueDraft.blocklist.push(Number(id));closeModal();queuePlanModal()},

 'queue-block-add':()=>{const value=$('#queue-block-id')?.value.trim().replace(/^#/,'');if(!value||!/^\d+$/.test(value)||!Number.isSafeInteger(Number(value))||Number(value)<1){$('#form-error').textContent='请输入有效的 Issue 编号。';return}actions['queue-draft-block'](value)},
 'queue-block':id=>apply({type:'queue-block',issue:Number(id)}),
 'queue-unblock':id=>apply({type:'queue-unblock',issue:Number(id)}),
 'queue-pause':()=>apply({type:'queue',enabled:false}),
 'project-info':()=>showModal('当前项目来源','<div><h3>项目管理 v3.0</h3><p class="space">theriseunion · Project #14<br>Issue 来源：theriseunion/freeland<br>负责人筛选：imneov</p><p class="space">本版选取 '+state.issues.length+' 个真实 Issue 结构快照，聚焦创建会话、接替和统一执行状态。</p><p class="space"><a href="https://github.com/orgs/theriseunion/projects/14/views/9?sliceBy%5Bvalue%5D=imneov" target="_blank" rel="noreferrer">打开 GitHub 原视图 ↗</a></p></div>','知道了',closeModal),
 'native-new':()=>showModal('新会话','<p>本版聚焦 Issue 驱动。选择一个尚未处理的 Issue，即可创建对应会话。</p>'+selectField('Issue','issue',state.issues.filter(t=>t.mine&&!t.control&&!WorkModel.done(t)).map(t=>[t.id,'#'+t.id+' '+t.shortTitle]),3026),'开始处理',v=>{closeModal();actions.start(v.issue)}),
 'job':id=>{const j=state.jobs.find(x=>x.id===id);showModal(j.title,`<div class="row">${badge(j.state==='running'?'运行中':j.state==='ended'?'已结束':'失败',tone(j.state))}${badge('#'+j.issue)}</div><p>执行者：${esc(sess(j.owner)?.title||'')}</p><p>${esc(j.result)}</p><p class="muted small">${j.consumed?'结果已收取':'结果尚未收取'} · 原型模拟</p>`,'知道了',closeModal)},
 'draft':kind=>{const s=sess(ui.session),t=task(s.issue);const text=kind==='delegate'?'请把可独立推进的工作委派给合适的执行者，明确范围和验收。':t.question?'关于「'+t.question+'」，我的决定是：':'请按已确认范围继续 #'+t.id+'，保留已有结果和未完成事项。';ui.drafts[s.id]=[ui.drafts[s.id],text].filter(Boolean).join('\n\n');ui.orb=false;render();$('#chat-input')?.focus()},
 'scenario':id=>{ui.demoOpen=true;resetScenario(id)},
 'reset':()=>{resetScenario('overview');ui.page='panel';ui.focus=3270;render();notify('已恢复初始样例。')},
 'modal-close':closeModal
};
