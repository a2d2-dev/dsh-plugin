function controlHeight(){return $('#demo')?.getBoundingClientRect().height||44}
function layoutControls(){document.documentElement.style.setProperty('--controls-height',Math.ceil(controlHeight())+'px');if(ui.orbPoint){ui.orbPoint.y=Math.max(8,Math.min(innerHeight-controlHeight()-88,ui.orbPoint.y));const a=$('.orb-anchor');if(a)a.style.top=ui.orbPoint.y+'px'}const toggle=$('.demo-controls .toggle');if(toggle)toggle.textContent=$('#demo').open?'收起':'展开'}
const controlObserver=new ResizeObserver(layoutControls);
function render(){const focused=document.activeElement?.id,pos=document.activeElement?.selectionStart;$('#app').innerHTML=sidebar()+`<main class="main">${ui.page==='panel'?panel():ui.page==='issue'?issuePage():chat()}</main>`+demo()+orb();$('#demo').addEventListener('toggle',e=>{ui.demoOpen=e.target.open;layoutControls()});controlObserver.disconnect();controlObserver.observe($('#demo'));layoutControls();if(focused==='issue-search'){$('#issue-search')?.focus();$('#issue-search')?.setSelectionRange(pos,pos)}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(b&&!b.disabled)actions[b.dataset.act]?.(b.dataset.id)});
document.addEventListener('input',e=>{if(e.target.id==='issue-search'){ui.query=e.target.value;render()}if(e.target.id==='chat-input')ui.drafts[ui.session]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='demo-target'){openIssue(e.target.value,'execution');return}if(e.target.id==='label-filter'){ui.tag=e.target.value;render()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='modal-form'){try{formSubmit?.(Object.fromEntries(new FormData(e.target)))}catch(error){$('#form-error').textContent=error.message}}if(e.target.id==='chat-form'){const s=sess(ui.session),t=task(s.issue),value=(ui.drafts[s.id]||'').trim();if(!value||['retired','prepared','failed','completed'].includes(s.state))return;ui.drafts[s.id]='';apply(s.id===t.control&&t.question?{type:'answer',issue:t.id,text:value}:{type:'message',issue:t.id,session:s.id,text:value})}});
$('#modal').addEventListener('cancel',()=>formSubmit=null);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').open&&(ui.orb||ui.headerMenu)){ui.orb=false;ui.headerMenu=null;render()}});
document.addEventListener('pointerdown',e=>{if(ui.headerMenu&&!e.target.closest('.header-anchor')&&!e.target.closest('[data-act="header-menu"]')){ui.headerMenu=null;$('.header-popover')?.remove()}});
let drag=null,dragged=false;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.orb-button');if(!b||e.button!==0)return;const r=b.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top,moved:false};dragged=false;b.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;drag.moved=true;ui.orbPoint={x:Math.max(8,Math.min(innerWidth-72,drag.left+dx)),y:Math.max(8,Math.min(innerHeight-controlHeight()-88,drag.top+dy))};const a=$('.orb-anchor');if(a)Object.assign(a.style,{left:ui.orbPoint.x+'px',top:ui.orbPoint.y+'px',right:'auto',bottom:'auto'})});
document.addEventListener('pointerup',()=>{if(drag){dragged=drag.moved;drag=null}});document.addEventListener('pointercancel',()=>{drag=null;dragged=false});document.addEventListener('click',e=>{if(dragged&&e.target.closest('.orb-button')){e.stopImmediatePropagation();dragged=false}},true);
window.addEventListener('resize',()=>{if(ui.orbPoint)ui.orbPoint.x=Math.max(8,Math.min(innerWidth-72,ui.orbPoint.x));layoutControls()});

let projectSearch='',projectDraft={link:'',name:''};
const currentProject=()=>projectRegistry.items.find(p=>p.id===projectRegistry.selected)||projectRegistry.items[0];

const sourceLabel=p=>p.sourceType==='repository'?'GitHub 仓库 · '+p.repository:p.owner+' · GitHub Project #'+p.number;

function parseProject(value){try{const url=new URL(value.trim());if(url.protocol!=='https:'||url.hostname!=='github.com'||url.port||url.username||url.password)return null;const m=url.pathname.match(/^\/(orgs|users)\/([\w.-]+)\/projects\/([1-9]\d*)(?:\/views\/([1-9]\d*))?\/?$/);if(m){const number=Number(m[3]);if(!Number.isSafeInteger(number))return null;return {id:m[1]+'/'+m[2].toLowerCase()+'/'+number,sourceType:'project',owner:m[2],number,kind:m[1],url:'https://github.com/'+m[1]+'/'+m[2]+'/projects/'+number,entryUrl:url.href,view:m[4]||null,slice:url.searchParams.get('sliceBy[value]')}}const repo=url.pathname.match(/^\/([\w.-]+)\/([\w.-]+)\/?$/);if(!repo||['orgs','users','settings','marketplace','topics','collections'].includes(repo[1].toLowerCase()))return null;const name=repo[2].replace(/\.git$/i,'');if(!name||name==='.'||name==='..')return null;const repository=repo[1]+'/'+name,canonical='https://github.com/'+repository;return {id:'repo/'+repository.toLowerCase(),sourceType:'repository',owner:repo[1],repo:name,repository,url:canonical,entryUrl:canonical}}catch{return null}}
function projectSwitcher(){return `<nav class="project-tabs" role="tablist" aria-label="项目标签">${projectRegistry.items.map(p=>`<button type="button" role="tab" data-act="choose-project" data-id="${esc(p.id)}" aria-selected="${p.id===projectRegistry.selected}" class="project-tab ${p.id===projectRegistry.selected?'active':''}" title="${esc(sourceLabel(p))}">${esc(p.name)}</button>`).join('')}<button type="button" data-act="add-project" class="project-tab-add" aria-label="添加项目" title="添加项目">＋</button></nav>`}
function projectList(){const q=projectSearch.trim().toLowerCase();return projectRegistry.items.filter(p=>!q||(p.name+' '+p.owner+' '+p.number).toLowerCase().includes(q)).map(p=>`<div class="relationship-row"><div class="grow">${B(esc(p.name),'choose-project',p.id,'link')}<div class="sub">${esc(sourceLabel(p))}</div></div>${p.id===projectRegistry.selected?badge('当前'):B('打开','choose-project',p.id,'small')}</div>`).join('')||'<p class="empty">没有匹配的已添加项目。可以通过链接添加。</p>'}
function chooseProject(id){if(!projectRegistry.items.some(p=>p.id===id))return;projectRegistry.selected=id;ui.page='panel';ui.object='overview';ui.projectView='mine';ui.query='';ui.tag='';ui.orb=false;ui.headerMenu=null;closeModal();render();notify('已切换到 '+currentProject().name+'，已有执行范围保持不变。')}
function projectPicker(){projectSearch='';showModal('选择项目','<label>搜索已添加的项目<input id="project-search" placeholder="项目名称或所属组织"></label><div id="project-list" style="max-height:280px;overflow:auto">'+projectList()+'</div><div class="row">'+B('＋ 添加项目','add-project','','small')+'</div>','关闭',closeModal)}
function addProjectForm(){showModal('添加项目',field('GitHub Project 或仓库链接','projectLink',projectDraft.link,'type="url" required placeholder="粘贴 GitHub Project 或仓库地址"')+field('显示名称（可选）','projectName',projectDraft.name,'placeholder="默认使用来源名称"')+'<div class="note"><b>GitHub Project</b><p>例如 github.com/orgs/theriseunion/projects/14<br>展示看板中收录的 Issue 和相关 PR。</p><b>GitHub 仓库</b><p>例如 github.com/theriseunion/freeland<br>直接展示该仓库的 Issue 和 PR，无需 Project。</p></div>','识别链接',v=>{projectDraft={link:v.projectLink.trim(),name:v.projectName.trim()};const parsed=parseProject(projectDraft.link);if(!parsed)throw Error('请粘贴 GitHub Project 或仓库链接，不能使用单个 Issue、PR 或代码文件链接。');if(!state.sourceOnline)throw Error('来源暂不可用，已保留输入；恢复后可以重试。');const existing=projectRegistry.items.find(p=>p.id===parsed.id),repo=parsed.sourceType==='repository',name=existing?.name||projectDraft.name||(repo?parsed.repo:parsed.owner+' · Project #'+parsed.number);closeModal();showModal(existing?'项目已添加':'确认添加项目',`<div><div class="row">${badge(repo?'GitHub 仓库':'GitHub Project','purple')}</div><h3 class="space">${esc(name)}</h3><p class="space">${esc(sourceLabel(parsed))}</p><p class="small space" style="overflow-wrap:anywhere">${esc(parsed.entryUrl)}</p><p class="space">${repo?'内容范围：该仓库的 Issue 和 PR。':'内容范围：Project 收录的 Issue，以及它们的相关 PR。'}</p>${parsed.view||parsed.slice?'<p class="small space">原链接中的视图与切片参数会保留。</p>':''}</div><div class="note">${existing?'已有记录将直接打开，不重复添加。':'添加后进入对应范围；浏览和添加不会创建会话或开启持续处理。'}</div><small class="muted">原型模拟识别，未调用 GitHub。</small><div>${B('← 返回修改','edit-project-draft','','link small')}</div>`,existing?'打开已有项目':'添加并进入',()=>{if(!state.sourceOnline)throw Error('来源暂不可用，请恢复后重试。');if(!projectRegistry.items.some(p=>p.id===parsed.id))projectRegistry.items.push({...parsed,name,hasSnapshot:repo&&state.issues.some(t=>t.repo.toLowerCase()===parsed.repository.toLowerCase())});projectRegistry.items.find(p=>p.id===parsed.id).entryUrl=parsed.entryUrl;chooseProject(parsed.id)})})}
const originalPanelForProjects=panel;
panel=()=>{const p=currentProject();if(p.hasSnapshot)return originalPanelForProjects();const title=objectTabs().find(x=>x[0]===ui.object)?.[1]||'概览';return `<div class="topline project-topline"><span>A²D² 控制面板</span>${projectSwitcher()}</div><div class="panel"><div class="between object-tabs"><nav class="tabs" role="tablist" aria-label="来源内容">${objectTabs().map(([id,label])=>`<button type="button" role="tab" data-act="object" data-id="${id}" aria-selected="${ui.object===id}" class="${ui.object===id?'active':''}">${label}</button>`).join('')}</nav></div><section class="workbench"><div class="toolbar"><div><h3>${esc(p.name)}</h3><div class="source-info"><span>${esc(sourceLabel(p))}</span><span>账号：imneov</span></div></div>${B('持续处理…','queue-settings','','small',true)}</div><div class="empty" role="tabpanel" aria-label="${title}"><h2>${title==='概览'?'来源已添加':'尚未收录'+title+'样例'}</h2><p class="space">本原型尚未内置这个来源的${title==='概览'?'内容快照':title+'内容'}，不显示零项统计。</p><p class="small space">已有会话与持续处理规则保持原范围。</p><div class="row space" style="justify-content:center"><a href="${esc(p.sourceType==='repository'?p.url+(ui.object==='prs'?'/pulls':'/issues'):p.entryUrl)}" target="_blank" rel="noreferrer">查看 GitHub 来源 ↗</a>${B('切回项目管理 v3.0 样例','choose-project','orgs/theriseunion/14','small')}</div></div></section>${state.queue.enabled?`<div class="note space">持续处理仍在 ${esc(state.queue.sourceName)} 的原授权范围内运行。</div>`:''}</div>`};
actions['project-info']=projectPicker;
actions['add-project']=()=>{projectDraft={link:'',name:''};closeModal();addProjectForm()};
actions['edit-project-draft']=()=>{closeModal();addProjectForm()};
actions['choose-project']=chooseProject;
document.addEventListener('input',e=>{if(e.target.id==='project-search'){projectSearch=e.target.value;$('#project-list').innerHTML=projectList()}});
const openIssueInOriginalProject=openIssue,openSessionInOriginalProject=openSession,resetOriginalScenario=resetScenario;
function keepSourceForIssue(t){if(!t)return;if(repositorySource()&&t.repo.toLowerCase()!==currentProject().repository.toLowerCase())projectRegistry.selected='orgs/theriseunion/14';else if(!currentProject().hasSnapshot)projectRegistry.selected='orgs/theriseunion/14'}
openIssue=(id,tab='overview')=>{keepSourceForIssue(task(id));openIssueInOriginalProject(id,tab)};
openSession=id=>{keepSourceForIssue(task(sess(id)?.issue));openSessionInOriginalProject(id)};
actions.session=openSession;
resetScenario=(id='overview')=>{projectRegistry.selected='orgs/theriseunion/14';resetOriginalScenario(id)};
render();
</script>
</body></html>
