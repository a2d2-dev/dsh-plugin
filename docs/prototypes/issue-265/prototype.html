der-color:#a8cbbb;background:var(--soft)}.walk-steps{display:grid;gap:8px}.walk-steps button{text-align:left}.walk-steps button.done{background:var(--soft);color:var(--accent)}.other-view{height:100%;overflow:auto;padding:24px}.other-view h1{font-size:20px;line-height:28px}.overview{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.overview div{padding:16px;border:1px solid var(--line);border-radius:8px;min-width:140px}.overview strong{display:block;font-size:24px;line-height:32px}.overview span{font-size:12px;color:var(--muted)}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.result-count{color:var(--accent);font-size:13px}.note-small{color:var(--muted);font-size:12px;line-height:20px}a{color:var(--accent);text-underline-offset:3px}h1,h2,h3,p,td{overflow-wrap:anywhere}button,input,select{max-width:100%}.content>*,.heading-line>*,.rule-actions>*,.modal>*,.form>*{min-width:0}[hidden]{display:none!important}

.form-footer{position:sticky;bottom:-24px;background:#fff;padding:12px 0;border-top:1px solid var(--line);z-index:1}@media(max-width:760px){.form-footer{bottom:-20px}}
.queue-page{height:100%}.queue-filters{display:flex;gap:4px;flex-wrap:wrap}.queue-filters button{border-color:transparent;background:transparent;font-size:13px;padding:6px 10px}.queue-filters button[aria-pressed=true]{background:var(--soft);color:var(--accent);font-weight:600}.queue-filters button span{font-size:12px;margin-left:4px}.list-header{gap:12px}@media(max-width:760px){.queue-filters{width:100%;gap:2px}.queue-filters button{padding:6px 8px;font-size:12px}.counts{width:100%;justify-content:space-between}}
.task-table .col-task{width:auto}.task-table .col-status{width:160px}.task-table .col-session{width:160px}.task-table td{padding-block:14px}@media(max-width:760px){.task-table td{padding:0}.task-table td[data-cell=session]{grid-column:3;grid-row:2;align-self:center}.task-table td[data-cell=status]{grid-column:2;grid-row:2}}

<body>
<div class="app">
<header class="appbar"><span class="brand">A²D² 控制面板</span><label class="project-control"><select id="project-select" aria-label="当前 Project"><option value="dsh">DSH A²D² · Project #1</option><option value="sample">界面评审 · 示例 Project</option></select></label><span class="prototype-mark">原型 · 演示数据</span></header>
<nav id="nav" class="nav" aria-label="控制面板页签"></nav>
<div id="view"></div>
<footer class="demo-bar"><span class="demo-label">演示</span><select id="demo-task" aria-label="选择演示中的执行任务"></select><button data-action="complete">完成一项</button><button data-action="problem">发现会话问题</button><button data-action="external-resolved" hidden title="模拟人在现有任务或会话中处理并恢复后，同步队列状态">模拟外部已处理</button><button class="mobile-hide" data-action="new-task">新增待办 Task</button><button data-action="tick">时间 +10 分钟</button><button data-action="walk">场景</button><button class="mobile-hide" data-action="state">状态</button><button data-action="reset">重置</button><span id="clock" class="demo-time"></span></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div><div id="overlay"></div>
<script>
// Standalone prototype: one queue per current Project, settings are queue attributes.
const initialTasks=[
{id:138,title:'统一执行状态与会话入口',labels:['bug','ready-for-agent'],priority:1,state:'In Progress',execution:'running',parent:136},
{id:166,title:'修复窄窗口下的面板裁切',labels:['bug','ready-for-agent'],priority:1,state:'In Progress',execution:'running',parent:136},
{id:254,title:'修复 Project 视图读取失败',labels:['bug','ready-for-agent'],priority:1,state:'Todo',execution:'idle'},
{id:248,title:'列表滚动加载更多内容',labels:['bug','ready-for-agent'],priority:2,state:'Todo',execution:'idle'},
{id:257,title:'Issue 详情先打开，再异步加载',labels:['bug','ready-for-agent'],priority:2,state:'Todo',execution:'idle'},
{id:250,title:'恢复处理时保留当前模型选择',labels:['bug','ready-for-agent'],priority:2,state:'Done',execution:'done',accepted:true},
{id:221,title:'补充项目使用说明',labels:['documentation','ready-for-agent'],priority:2,state:'Todo',execution:'idle'},
{id:222,title:'整理界面操作示例',labels:['documentation','ready-for-agent'],priority:3,state:'Todo',execution:'idle',parent:221},
{id:136,title:'控制面板整体交付',labels:['enhancement'],priority:1,state:'In Progress',execution:'idle'}];
const defaultSettings={labels:['bug','ready-for-agent'],projectState:'Todo',order:'priority',interval:10,concurrency:2};
function seed(){return {clock:840,projectId:'dsh',nextTask:301,last:'',projects:{
 dsh:{name:'DSH A²D²',tasks:structuredClone(initialTasks),queue:{id:'queue-dsh',enabled:true,nextDue:850,lastUpdated:840,trigger:'timer',settings:structuredClone(defaultSettings),items:[{taskId:138,status:'running'},{taskId:166,status:'running'},{taskId:254,status:'queued'},{taskId:248,status:'queued'},{taskId:257,status:'queued'},{taskId:250,status:'done'}],events:['13:42 #250 已通过验收并完成执行收口，保留为历史。','14:00 更新等待任务，开始处理 #138 与 #166，并发上限 2。']}},
 sample:{name:'界面评审',tasks:[{id:401,title:'核对页面布局',labels:['bug','ready-for-agent'],priority:2,state:'Todo',execution:'idle'},{id:402,title:'补充交互说明',labels:['documentation'],priority:3,state:'Todo',execution:'idle'}],queue:{id:'queue-sample',enabled:false,nextDue:null,lastUpdated:null,trigger:null,settings:structuredClone(defaultSettings),items:[],events:[]}}
}};}
const time=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const inProgress=item=>['running','needs-human'].includes(item.status);
const waiting=item=>['queued','waiting'].includes(item.status);
function matching(p,settings){return p.tasks.filter(t=>(settings.projectState==='open'?t.state!=='Done':t.state===settings.projectState)&&settings.labels.every(l=>t.labels.includes(l))).sort((a,b)=>settings.order==='priority'?a.priority-b.priority||a.id-b.id:a.id-b.id);}
function pump(p){const q=p.queue;if(!q.enabled)return [];let free=q.settings.concurrency-q.items.filter(inProgress).length;const started=[];
 for(const item of q.items){if(free<=0)break;if(!waiting(item))continue;const task=p.tasks.find(t=>t.id===item.taskId);if(['running','needs-human'].includes(task.execution))continue;item.status='running';task.execution='running';task.state='In Progress';free--;started.push(task.id);}return started;}
function refreshQueue(s,p,trigger){const q=p.queue,active=q.items.filter(inProgress),history=q.items.filter(i=>!inProgress(i)&&!waiting(i)),keep=new Set([...active,...history].map(i=>i.taskId));
 const oldWaiting=q.items.filter(waiting).map(i=>i.taskId);
 const selected=matching(p,q.settings).filter(t=>!keep.has(t.id)&&!['running','needs-human'].includes(t.execution));
 const nextWaiting=selected.map(t=>({taskId:t.id,status:'queued'}));
 q.items=[...active,...nextWaiting,...history];q.lastUpdated=s.clock;q.trigger=trigger;if(q.enabled)q.nextDue=s.clock+q.settings.interval;
 const removed=oldWaiting.filter(id=>!selected.some(t=>t.id===id)),added=selected.filter(t=>!oldWaiting.includes(t.id)).map(t=>t.id);
 q.events.push(time(s.clock)+' '+(trigger==='timer'?'定时更新':trigger==='settings'?'设置更新':'手动更新')+'：保留 '+active.length+' 项在途、'+history.length+' 项历史；重新选取 '+selected.length+' 项等待任务。'+(added.length?'新增 '+added.map(id=>'#'+id).join('、')+'。':'')+(removed.length?'移出等待 '+removed.map(id=>'#'+id).join('、')+'，Task仍在Project中。':''));
 const started=pump(p);if(started.length)q.events.push(time(s.clock)+' 空位启动 '+started.map(id=>'#'+id).join('、')+'。');
 s.last='同一队列已更新：在途与历史保留，等待部分已重新筛选。';
}
function reduce(state,action,data={}){const s=structuredClone(state),p=s.projects[s.projectId],q=p.queue;s.last='';
 if(action==='refresh')refreshQueue(s,p,'manual');
 else if(action==='toggle'){q.enabled=!q.enabled;q.nextDue=q.enabled?s.clock+q.settings.interval:null;const added=pump(p);s.last=q.enabled?'自动处理已开启。'+(added.length?added.map(id=>'#'+id).join('、')+' 已开始处理。':''):'已暂停后续启动；正在处理的Task和历史记录保持不变。';q.events.push(time(s.clock)+' '+s.last);}
 else if(action==='save-settings'){q.settings=data.settings;refreshQueue(s,p,'settings');s.last='设置已保存，等待部分已更新；当前执行和历史未改动。';}
 else if(action==='tick'){s.clock+=10;if(q.enabled&&q.nextDue<=s.clock)refreshQueue(s,p,'timer');else s.last='演示时间 '+time(s.clock)+(q.enabled?'，尚未到下次更新时间。':'，后续自动处理已暂停。');}
 else if(action==='new-task'){const id=s.nextTask++;p.tasks.push({id,title:'新增待处理的界面问题',labels:['bug','ready-for-agent'],priority:2,state:'Todo',execution:'idle'});s.last='Project 新增 Task #'+id+'；更新等待任务时进入同一队列。';}
 else if(['complete','problem','resolve'].includes(action)){const item=q.items.find(i=>i.taskId===data.taskId),task=p.tasks.find(t=>t.id===data.taskId);if(!item||!task){s.last='请选择队列中的任务。';return s;}
  if(action==='complete'){if(item.status!=='running'){s.last='只能模拟完成正在处理的Task。';return s;}item.status='done';item.endedAt=s.clock;task.execution='done';task.state='Done';task.accepted=true;const added=pump(p);q.events.push(time(s.clock)+' #'+task.id+' 已模拟完成验收与执行收口，留在队列历史中。'+(added.length?'补入 '+added.map(id=>'#'+id).join('、')+'。':''));s.last='#'+task.id+' 已进入历史。'+(added.length?added.map(id=>'#'+id).join('、')+' 自动补入。':q.enabled?'当前无可补入任务。':'后续启动已暂停。');}
  else if(action==='problem'){if(item.status!=='running'){s.last='请选择正在处理的Task。';return s;}item.status='needs-human';item.issue='会话对任务边界的理解与原始要求不一致，需要人确认方向。';task.execution='needs-human';task.problem=item.issue;q.events.push(time(s.clock)+' #'+task.id+' 的问题已记录，保留当前位置，等待人处理。');s.selectedTask=task.id;s.last='问题已记录，没有自动纠偏、重试或丢弃该Task。';}
  else{if(item.status!=='needs-human'||!data.note?.trim()){s.last='请填写人工处理说明。';return s;}task.humanNote=data.note.trim();delete task.problem;delete item.issue;item.status='running';task.execution='running';q.events.push(time(s.clock)+' 同步到 #'+task.id+' 已在现有会话完成人工处理并继续。');s.last='已同步外部处理结果，同一个Task继续。';}
 }
 return s;
}
let state=seed(),ui={tab:'持续委托',filter:'all',modal:null,task:null,conversation:false,walk:'parallel',step:0},toastTimer;
const $=s=>document.querySelector(s);
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={running:'正在处理',queued:'等待处理',waiting:'等待处理',done:'已结束','needs-human':'需人工处理'};
const tone={running:'good',queued:'',waiting:'',done:'','needs-human':'warn'};
const badge=(label,color='')=>`<span class="tag ${color}"><span class="dot"></span>${label}</span>`;
const button=(label,action,extra='',cls='')=>`<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
function current(){const project=state.projects[state.projectId];return {project,queue:project.queue};}
function notify(text){clearTimeout(toastTimer);$('#toast').textContent=ui.modal?'':text;if(!ui.modal)toastTimer=setTimeout(()=>{$('#toast').textContent='';},4000);}
function dispatch(action,data={}){state=reduce(state,action,data);if(state.selectedTask){ui.task=state.selectedTask;ui.modal='problem';delete state.selectedTask;}render();if(state.last)notify(state.last);}
function visibleItems(q){const items=[...q.items.filter(inProgress),...q.items.filter(waiting),...q.items.filter(i=>!inProgress(i)&&!waiting(i))];return items.filter(i=>ui.filter==='all'||ui.filter==='active'&&i.status==='running'||ui.filter==='waiting'&&waiting(i)||ui.filter==='history'&&i.status==='done'||ui.filter==='human'&&i.status==='needs-human');}
function taskTable(items,project){return `<table class="task-table"><colgroup><col class="col-order"><col class="col-task"><col class="col-status"><col class="col-session"></colgroup><thead><tr><th>顺序</th><th>Task</th><th>处理状态</th><th>处理会话</th></tr></thead><tbody>${items.map((i,n)=>{const t=project.tasks.find(t=>t.id===i.taskId);return `<tr class="${i.status==='needs-human'?'needs-human':''}"><td class="order">${n+1}</td><td data-cell="task"><button class="link task-title" data-action="task" data-id="${t.id}" title="进入已有任务详情">#${t.id} ${escape(t.title)}</button></td><td data-cell="status">${i.status==='needs-human'?button('需人工处理 ›','problem-summary',`data-id="${t.id}"`,'tag warn'):badge(labels[i.status],tone[i.status])}</td><td data-cell="session">${inProgress(i)?button('进入会话','session',`data-id="${t.id}"`,'link session-link'):i.status==='done'?button('会话记录','history-session',`data-id="${t.id}"`,'link session-link'):'<span class="muted small">尚未开始</span>'}</td></tr>`;}).join('')}</tbody></table>`;}
function queuePage(){const {project,queue:q}=current(),c=status=>q.items.filter(i=>i.status===status).length,occupied=q.items.filter(inProgress).length,rows=visibleItems(q),issue=q.items.find(i=>i.status==='needs-human');
 const filters=[['all','全部',q.items.length],['active','正在处理',c('running')],['waiting','等待处理',q.items.filter(waiting).length],['history','历史',c('done')],['human','需人工处理',c('needs-human')]];
 return `<main class="content queue-page"><header class="rule-header"><div class="heading-line"><h1>任务队列</h1>${badge(q.enabled?'自动处理已开启':'后续执行已暂停',q.enabled?'good':'')}<div class="rule-actions">${button('更新等待任务','refresh','','primary')}${button('队列设置','settings')}${button(q.enabled?'暂停后续执行':'继续处理队列','toggle','','quiet')}</div></div><div class="rule-summary"><span>筛选 <strong>${q.settings.projectState==='open'?'未完成':q.settings.projectState}</strong></span><span>标签 <strong>${escape(q.settings.labels.join(' ＋ ')||'不限')}</strong></span><span>每 <strong>${q.settings.interval} 分钟</strong>更新</span><span>并发上限 <strong>${q.settings.concurrency}</strong></span><span class="schedule">${q.enabled?'下次 '+time(q.nextDue):occupied?'在途任务继续保留':'等待继续'}</span></div></header><div class="list-header"><nav class="queue-filters" aria-label="队列状态筛选">${filters.map(([id,label,count])=>`<button aria-pressed="${ui.filter===id}" data-action="filter" data-filter="${id}">${label} <span>${count}</span></button>`).join('')}</nav><div class="counts"><span>并发占用 <strong>${occupied} / ${q.settings.concurrency}</strong></span><span>${q.lastUpdated===null?'尚未更新':'最近更新 '+time(q.lastUpdated)}</span></div></div>${!q.enabled?`<div class="notice"><span>已暂停启动后续 Task；当前处理和历史记录不变。</span></div>`:occupied>q.settings.concurrency?`<div class="notice"><span>保留现有 ${occupied} 项在途任务，后续按并发上限 ${q.settings.concurrency} 补位。</span></div>`:''}${issue?`<div class="notice"><span>#${issue.taskId} 的会话问题已记录，等待人处理。刷新队列不会移除它。</span>${button('进入现有会话','session',`data-id="${issue.taskId}"`)}</div>`:''}<div class="run-scroll">${rows.length?taskTable(rows,project):`<div class="empty"><h2>${ui.filter==='all'?'队列当前为空':'当前分类没有任务'}</h2><p>${ui.filter==='all'?'点击更新等待任务，按当前设置从 Project 选择已有 Task。':'这些只是同一队列的状态筛选，其他任务仍保留在队列中。'}</p>${ui.filter==='all'?button('更新等待任务','refresh','','primary'):button('查看全部','filter','data-filter="all"')}</div>`}<details class="history-box"><summary>运行记录 · ${q.events.length} 条</summary><ol class="events">${q.events.map(e=>`<li>${escape(e)}</li>`).join('')}</ol></details></div></main>`;
}
function render(){clearTimeout(toastTimer);$('#toast').textContent='';const {project,queue:q}=current();$('#project-select').value=state.projectId;$('#nav').innerHTML=['概览','项目','Issue','PR','持续委托'].map(t=>`<button role="tab" aria-selected="${ui.tab===t}" data-action="nav" data-tab="${t}">${t}</button>`).join('');
 if(ui.tab==='持续委托')$('#view').innerHTML=queuePage();else $('#view').innerHTML=`<main class="other-view"><p role="status">${escape(ui.tab)}复用现有页面，原型不重新制作。</p>${button('返回任务队列','nav','data-tab="持续委托"')}</main>`;
 const candidates=q.items.filter(inProgress),prior=$('#demo-task').value;$('#demo-task').innerHTML=candidates.length?candidates.map(i=>`<option value="${i.taskId}">#${i.taskId} ${labels[i.status]}</option>`).join(''):'<option value="">无在途任务</option>';if(candidates.some(i=>String(i.taskId)===prior))$('#demo-task').value=prior;
 const selected=candidates.find(i=>String(i.taskId)===$('#demo-task').value);document.querySelector('.demo-bar [data-action=complete]').disabled=selected?.status!=='running';document.querySelector('.demo-bar [data-action=problem]').disabled=selected?.status!=='running';document.querySelector('.demo-bar [data-action=external-resolved]').hidden=selected?.status!=='needs-human';$('#clock').textContent='演示时间 '+time(state.clock);renderOverlay();
}
function closeModal(){ui.modal=null;ui.conversation=false;$('#overlay').innerHTML='';}
function modalShell(title,body,drawer=false){return `<div class="overlay ${drawer?'drawer-overlay':''}"><section class="modal ${drawer?'drawer':''}" role="dialog" aria-modal="true" aria-label="${title}"><header class="modal-head"><h2>${title}</h2>${button('×','close','aria-label="关闭窗口"','icon quiet')}</header>${body}</section></div>`;}
function settingsForm(){const {project,queue:q}=current(),r=q.settings;return modalShell('队列设置',`<form id="settings-form" class="form"><div class="form-grid"><label>Project 状态<select name="projectState"><option value="Todo" ${r.projectState==='Todo'?'selected':''}>Todo</option><option value="open" ${r.projectState==='open'?'selected':''}>全部未完成</option></select></label><label>必须包含的标签<input name="labels" value="${escape(r.labels.join(', '))}" placeholder="逗号分隔；留空不限"></label></div><div class="form-grid"><label>更新周期<select name="interval">${[10,30,60].map(n=>`<option value="${n}" ${r.interval===n?'selected':''}>每 ${n} 分钟</option>`).join('')}</select></label><label>并发上限<select name="concurrency">${[1,2,3,4].map(n=>`<option value="${n}" ${r.concurrency===n?'selected':''}>最多 ${n} 个 Task 同时执行</option>`).join('')}</select></label></div><label>等待任务排序<select name="order"><option value="priority" ${r.order==='priority'?'selected':''}>优先级从高到低，再按编号</option><option value="oldest" ${r.order==='oldest'?'selected':''}>按编号从小到大</option></select></label><div class="form-summary">Project：${escape(project.name)}<p>保存后只重新筛选等待部分。已经在途的 Task、需人工处理项和历史记录全部保留。</p><p>沿用项目 Agent 和现有执行上下文。</p></div><div class="actions">${button('检查匹配 Task','match')}<span id="match-result" class="result-count"></span></div><div class="form-footer">${button('取消','close')}<button type="submit" class="primary">保存并更新等待任务</button></div></form>`);}
function problemSummary(){const {project,queue:q}=current(),task=project.tasks.find(t=>t.id===ui.task),item=q.items.find(i=>i.taskId===ui.task);return modalShell('队列问题',`<p><strong>#${task.id} ${escape(task.title)}</strong></p><p>${escape(item.issue??task.problem??'暂无待处理问题')}</p><div class="drawer-actions">${button('打开已有任务详情','task',`data-id="${task.id}"`)}${button('进入现有处理会话','session',`data-id="${task.id}"`,'primary')}</div><p class="note-small">在现有任务页或会话中处理，队列同步处理状态。</p>`);}
function openExisting(kind,taskId){ui.lastNavigation={target:kind==='session'?'current-session':kind==='history-session'?'task-session-history':'task-detail',projectId:state.projectId,taskId};closeModal();notify('原型跳转示意：打开 Task #'+taskId+' 的'+(kind==='session'?'现有处理会话':kind==='history-session'?'现有会话记录':'已有详情页')+'。');}
const walks={parallel:{label:'并发补位',text:'完成一项后留在历史中，等待部分补入下一项。',steps:[['完成一项，观察补位','complete'],['再完成一项，查看历史累积','complete']]},refresh:{label:'刷新等待部分',text:'当前任务继续运行，新增待办将在刷新后进入同一队列。',steps:[['Project 新增 Task','new-task'],['更新等待任务','refresh']]},timer:{label:'定时更新队列',text:'不用等当前任务结束。周期到来只更新等待部分，历史与在途不动。',steps:[['Project 新增 Task','new-task'],['时间推进 10 分钟','tick']]},human:{label:'需人工处理',text:'队列只记录问题，跳转已有任务或会话处理，随后同步状态。',steps:[['模拟发现会话问题','problem'],['进入已有处理会话（演示）','open-problem'],['模拟人在外部处理完成','external-resolved']]}};
function walkModal(){const w=walks[ui.walk];return modalShell('演示场景',`<nav class="walk-tabs" role="tablist">${Object.entries(walks).map(([id,w])=>`<button role="tab" data-action="choose-walk" data-walk="${id}" aria-selected="${ui.walk===id}">${w.label}</button>`).join('')}</nav><p>${w.text}</p><div class="walk-steps">${w.steps.map(([text,command],i)=>`<button data-action="walk-step" data-command="${command}" data-step="${i}" ${i>ui.step?'disabled':''} class="${i<ui.step?'done':''}">${i<ui.step?'✓':i+1} ${text}</button>`).join('')}</div><p class="note-small">仅内存演示；切换场景重置数据，不操作真实项目。</p>`);}
function stateModal(){const {project,queue:q}=current();return modalShell('当前演示状态',`<dl class="facts"><dt>Project</dt><dd>${escape(project.name)}</dd><dt>队列</dt><dd>唯一队列：${q.id}</dd><dt>自动处理</dt><dd>${q.enabled?'开启':'后续执行已暂停'}</dd><dt>更新</dt><dd>${q.lastUpdated===null?'尚未更新':time(q.lastUpdated)}</dd><dt>设置</dt><dd>每 ${q.settings.interval} 分钟；并发 ${q.settings.concurrency}</dd><dt>正在处理</dt><dd>${q.items.filter(i=>i.status==='running').map(i=>'#'+i.taskId).join('、')||'无'}</dd><dt>等待处理</dt><dd>${q.items.filter(waiting).map(i=>'#'+i.taskId).join('、')||'无'}</dd><dt>历史</dt><dd>${q.items.filter(i=>i.status==='done').map(i=>'#'+i.taskId).join('、')||'无'}</dd><dt>需人工</dt><dd>${q.items.filter(i=>i.status==='needs-human').map(i=>'#'+i.taskId).join('、')||'无'}</dd><dt>刷新边界</dt><dd>只替换等待部分，保留在途与历史，不创建新队列、不重复启动。</dd><dt>演示约定</dt><dd>需人工任务暂保留并发位置，不自动跳过；此细节仍可按评审调整。</dd></dl>`);}
function renderOverlay(){if(ui.modal){clearTimeout(toastTimer);$('#toast').textContent='';}$('#overlay').innerHTML=ui.modal==='settings'?settingsForm():ui.modal==='problem'?problemSummary():ui.modal==='walk'?walkModal():ui.modal==='state'?stateModal():'';}
function formSettings(){const data=new FormData($('#settings-form'));return {labels:String(data.get('labels')).split(',').map(x=>x.trim()).filter(Boolean),projectState:String(data.get('projectState')),order:String(data.get('order')),interval:Number(data.get('interval')),concurrency:Number(data.get('concurrency'))};}
function demo(action){const {queue:q}=current();let taskId=Number($('#demo-task').value)||q.items.find(i=>i.status==='running')?.taskId;
 if(action==='open-problem'){const problem=q.items.find(i=>i.status==='needs-human');if(problem)openExisting('session',problem.taskId);return;}
 if(action==='external-resolved'){const problem=q.items.find(i=>i.taskId===taskId&&i.status==='needs-human')??q.items.find(i=>i.status==='needs-human');if(!problem){notify('当前没有待人工处理的Task。');return;}ui.modal=null;dispatch('resolve',{taskId:problem.taskId,note:'已在现有任务/会话中完成人工处理并明确继续（演示）'});return;}
 dispatch(action,{taskId});}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;event.preventDefault();const action=el.dataset.action;
 if(action==='nav'){ui.tab=el.dataset.tab;render();return;}if(action==='filter'){ui.filter=el.dataset.filter;render();return;}
 if(['settings','walk','state'].includes(action)){ui.modal=action;renderOverlay();return;}if(action==='close'){closeModal();return;}
 if(action==='reset'){state=seed();ui={tab:'持续委托',filter:'all',modal:null,task:null,conversation:false,walk:'parallel',step:0};render();return;}
 if(['task','session','history-session'].includes(action)){openExisting(action,Number(el.dataset.id));return;}
 if(action==='problem-summary'){ui.task=Number(el.dataset.id);ui.modal='problem';renderOverlay();return;}
 if(action==='match'){const tasks=matching(current().project,formSettings());$('#match-result').textContent=tasks.length+' 项匹配：'+(tasks.map(t=>'#'+t.id).join('、')||'无');return;}
 if(action==='choose-walk'){state=seed();ui={...ui,tab:'持续委托',filter:'all',walk:el.dataset.walk,step:0,modal:'walk'};render();return;}
 if(action==='walk-step'){ui.step=Number(el.dataset.step)+1;ui.modal=null;demo(el.dataset.command);if(!ui.modal){ui.modal='walk';renderOverlay();}return;}
 if(['complete','problem','new-task','tick','external-resolved'].includes(action))demo(action);else if(['refresh','toggle'].includes(action))dispatch(action);
});
document.addEventListener('change',event=>{if(event.target.id==='project-select'){state.projectId=event.target.value;ui.filter='all';ui.modal=null;render();}if(event.target.id==='demo-task'){const item=current().queue.items.find(i=>String(i.taskId)===event.target.value);document.querySelector('.demo-bar [data-action=complete]').disabled=item?.status!=='running';document.querySelector('.demo-bar [data-action=problem]').disabled=item?.status!=='running';document.querySelector('.demo-bar [data-action=external-resolved]').hidden=item?.status!=='needs-human';}});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='settings-form'){const settings=formSettings();ui.modal=null;dispatch('save-settings',{settings});}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();});render();

</script>
</body>
