function progress(t){if(!t.parts.length)return t.status==='review'?'实现已提交，等待评审':t.status==='blocked'?'等待确认后继续':t.status==='done'?'验收完成':t.status==='running'?'正在按现有 skill 处理':'尚无处理会话';const n=s=>t.parts.filter(p=>s.includes(p.status)).length;return `${n(['done'])}/${t.parts.length} 项完成 · ${n(['running','review'])} 项推进${n(['blocked'])?' · '+n(['blocked'])+' 项待确认':''}`}
function startIssue(t){if(t.status!=='queued')return t.session;t.status='running';const s={id:nextId('session'),issue:t.id,project:t.project,name:t.title,generation:1,state:'running',tokens:18,role:'main',messages:[]};state.sessions.push(s);t.session=s.id;t.events.push('从工作列表开始处理，沿用项目 skill。');return s.id}
function driveQueue(){const q=state.queue;if(!q.enabled)return;const current=issue(q.current);if(current&&current.status==='running')return;const eligible=state.issues.filter(t=>(q.project==='all'||t.project===q.project)&&(!q.mine||t.mine));const existing=eligible.find(t=>t.status==='running');if(existing){q.current=existing.id;return}const next=eligible.find(t=>t.status==='queued');q.current=next?.id||null;if(next)startIssue(next)}
function rotate(s){if(s.role!=='main'||s.state!=='running')return;const t=issue(s.issue),p=project(s.project);if(!p.auto||s.tokens<p.limit)return;s.state='archived';const checkpoint={goal:t.title,specification:t.description,parts:structuredClone(t.parts),decisions:[...(t.decisions||[])],question:t.question||'',recentMessages:structuredClone(s.messages.slice(-6))};const notes=checkpoint.decisions.length?' 已接受的确认：'+checkpoint.decisions.map(v=>v.replace(/[。；;]+$/,'')).join('；')+'。':'';const recent=checkpoint.recentMessages.filter(m=>m.role==='user'&&!checkpoint.decisions.includes(m.text.trim())).map(m=>m.text.replace(/[。；;]+$/,''));const next={...s,id:nextId('session'),previous:s.id,generation:s.generation+1,tokens:24,state:'running',checkpoint,messages:[],handoff:`已从第 ${s.generation} 段会话接续。${progress(t)}。${notes}${recent.length?' 近期补充：'+recent.join('；')+'。':''} 下一步：${t.question?'继续可推进的工作，保留待确认问题。':'按已确认的范围继续未完成工作。'}`};state.sessions.push(next);t.session=next.id;t.events.push(`上下文达到 ${s.tokens}K，自动接续至第 ${next.generation} 段；工作进展保持不变。`);if(ui.session===s.id)ui.session=next.id;notify('已自动接续，继续同一项工作')}
let toastTimer;function notify(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3000)}
function openSession(id){ui.session=id;ui.view='chat';ui.inspector=null;render();window.scrollTo(0,0)}
function openIssue(id){ui.inspector={type:'issue',id};render()}
function sidebar(){return `<aside class="sidebar"><div class="brand"><span><span class="brand-mark">◈</span>DSH</span><span class="muted" style="font-size:13px">◧</span></div><div class="side-top">${btn('<span class="icon-text">＋</span>新会话','new-session')}${btn('<span class="icon-text">▦</span>A²D² 控制面板','panel',ui.view==='panel'?'active':'')}</div><div class="side-label"><span>项目与会话</span><span>⌄</span></div><nav class="session-nav" aria-label="DSH 项目与会话">${state.projects.map(p=>`<div class="project-group"><div class="project-name"><span class="muted">▱</span>${p.name}</div>${state.sessions.filter(s=>s.project===p.id&&s.state!=='archived').map(s=>`<button class="session-item ${s.state==='running'?'live':''} ${ui.view==='chat'&&ui.session===s.id?'active':''}" data-action="session" data-id="${s.id}"><span class="session-name">${esc(s.name)}</span><small>E5Box${s.generation>1?' · 已接续 '+(s.generation-1)+' 次':''}</small></button>`).join('')||'<div style="padding:10px 28px;color:#aaa;font-size:11px">暂无会话</div>'}${state.sessions.some(s=>s.project===p.id&&s.state==='archived')?`<details class="history"><summary>历史会话</summary>${state.sessions.filter(s=>s.project===p.id&&s.state==='archived').map(s=>btn(esc(s.name)+' · 第 '+s.generation+' 段','session','session-item',false,s.id)).join('')}</details>`:''}</div>`).join('')}</nav><div class="side-bottom"><div class="avatar">LF</div><span>LF</span><span style="margin-left:auto">E5Box · 模拟</span></div></aside>`}
function filteredIssues(){return state.issues.filter(t=>(ui.project==='all'||t.project===ui.project)&&(ui.filter==='all'||ui.filter==='mine'&&t.mine&&t.remote!=='Closed'||ui.filter==='attention'&&(t.status==='blocked'||t.sync==='error'))).filter(t=>{let q=ui.query.toLowerCase().trim();if(q.includes('assignee:@me')&&!t.mine)return false;if(q.includes('is:open')&&t.remote==='Closed')return false;q=q.replace(/assignee:@me|is:open|is:issue/g,'').trim();return !q||(t.title+' '+ref(t)+' '+project(t.project).name).toLowerCase().includes(q)})}
function issueTable(list){return `<div class="table-scroll"><table><thead><tr><th style="width:60px">Issue</th><th>标题 / 处理进展</th><th class="optional">负责人</th><th>Issue 状态</th><th>处理情况</th><th>会话</th></tr></thead><tbody>${list.map(t=>`<tr class="${ui.inspector?.id===t.id?'row-selected':''}"><td class="number">${ref(t)}</td><td class="title-cell">${btn(esc(t.title),'issue','link issue-title',false,t.id)}<div class="issue-sub">${esc(progress(t))}${t.sync==='error'?' · 关闭同步失败':''}</div></td><td class="optional"><span class="muted" style="font-size:11px">${t.mine?'LF':'产品团队'}</span></td><td>${t.number?badge(t.remote,t.remote==='Closed'?'purple':'green'):badge('纯本地')}</td><td>${status(t)}</td><td>${t.session?btn('↗ '+(t.status==='done'?'查看记录':'进入会话'),'session','link session-link',false,t.session):btn('开始处理','start','small',false,t.id)}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">没有匹配的工作，可以调整项目或筛选条件。</div></td></tr>'}</tbody></table></div>`}
function issuesPage(){const list=filteredIssues();return `<div class="workbench"><div class="toolbar"><div class="pills">${[['mine','分配给我'],['all','全部'],['attention','需要关注']].map(([k,n])=>`<button data-filter="${k}" class="${ui.filter===k?'active':''}">${n}</button>`).join('')}</div><div class="search"><input id="issue-search" aria-label="筛选 Issue" placeholder="搜索标题、#编号，或 assignee:@me" value="${esc(ui.query)}">${btn('＋','add-work','icon',false)}${btn('↻','refresh','icon')}</div></div><div class="summarybar"><span><b>${list.length}</b> 项工作 · ${list.filter(t=>t.status==='running').length} 项处理中 · ${list.filter(t=>t.status==='blocked').length} 项待确认</span><span>已有处理会话会自动关联</span></div>${issueTable(list)}</div>`}
function prsPage(){const ps=state.prs.filter(p=>(ui.project==='all'||p.project===ui.project)&&(ui.filter!=='review'||p.review==='waiting')&&(ui.filter==='all'||p.state==='Open'));return `<div class="workbench"><div class="toolbar"><div class="pills">${[['mine','开放'],['review','待我评审'],['all','全部']].map(([k,n])=>`<button data-filter="${k}" class="${ui.filter===k?'active':''}">${n}</button>`).join('')}</div><span class="source">关联 Issue，回到会话中继续工作</span></div><div class="table-scroll"><table><thead><tr><th>PR</th><th>标题</th><th>关联 Issue</th><th>检查</th><th>评审</th><th>状态</th></tr></thead><tbody>${ps.map(p=>`<tr><td class="number">#${p.number}</td><td class="title-cell">${btn(esc(p.title),'pr','link issue-title',false,p.number)}<div class="issue-sub">${project(p.project).name} · ${p.files} 个文件变更</div></td><td>${btn(ref(issue(p.issue)),'issue','link',false,p.issue)}</td><td>${badge(p.checks==='passed'?'✓ 通过':'1 项失败',p.checks==='passed'?'green':'amber')}</td><td>${badge(p.review==='approved'?'已批准':'待评审',p.review==='approved'?'green':'')}</td><td>${badge(p.state,p.state==='Merged'?'purple':'green')}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">当前筛选下没有 PR。</div></td></tr>'}</tbody></table></div>`}
function projectsPage(){const p=ui.projectDetail?project(ui.projectDetail):null;if(p){const ts=state.issues.filter(t=>t.project===p.id);return `<div class="project-card"><div class="between"><div>${btn('← 项目','project-back','link small')}<h2 style="margin-top:10px">${p.name}</h2><p style="font-size:11px;margin-top:4px">${p.source} · ${p.milestone} · ${p.repo}</p></div>${btn('来源设置','source-settings','small',false,p.id)}</div><div class="project-stats">${[['总工作',ts.length],['处理中',ts.filter(t=>t.status==='running').length],['待确认',ts.filter(t=>t.status==='blocked').length],['已完成',ts.filter(t=>t.status==='done').length]].map(([n,v])=>`<span><b>${v}</b>${n}</span>`).join('')}</div></div><div class="workbench"><div class="summarybar"><span>按原始 Issue 查看整体进展，展开后再看需求与子 Issue</span></div>${issueTable(ts)}</div>`}return `<div class="workbench"><div class="toolbar"><h3>项目</h3><span class="source">汇总现有项目中的工作与会话</span></div><div class="table-scroll"><table><thead><tr><th>项目</th><th>迭代</th><th>Issue 处理分布</th><th>待关注</th><th>来源</th></tr></thead><tbody>${state.projects.filter(p=>ui.project==='all'||p.id===ui.project).map(p=>{const ts=state.issues.filter(t=>t.project===p.id);return `<tr><td class="title-cell">${btn(p.name,'project','link issue-title',false,p.id)}<div class="issue-sub">${p.repo}</div></td><td><span class="muted">${p.milestone}</span></td><td style="font-size:11px;color:#8c8d98">${ts.filter(t=>t.status==='running').length} 处理中 · ${ts.filter(t=>t.status==='queued').length} 未开始 · ${ts.filter(t=>t.status==='done').length} 已完成</td><td>${badge(ts.filter(t=>t.status==='blocked').length+' 项待确认',ts.some(t=>t.status==='blocked')?'amber':'')}</td><td>${badge(p.connected?'GitHub Project':'已断开',p.connected?'':'amber')}</td></tr>`}).join('')}</tbody></table></div></div>`}
function queuebar(){const q=state.queue,t=issue(q.current);return `<div class="queuebar"><div><b>${q.enabled?'● 持续处理已开启':'让这些工作持续推进'}</b><div style="margin-top:3px">${q.enabled?`${q.project==='all'?'所有项目':project(q.project).name} / ${q.mine?'分配给我':'全部负责人'} · ${t?'当前 '+ref(t)+' '+esc(t.title):'等待下一项符合条件的工作'} · 已完成 ${q.handled} 项`:'沿用现有开发 skill，完成一项后接着处理下一项。'}</div></div><div class="row">${q.enabled?btn('暂停接新任务','pause-queue','small'):btn(q.handled?'恢复持续处理':'持续处理…','queue-settings','small')}${q.enabled?btn('设置','queue-settings','quiet small'):''}</div></div>`}
function partTree(t){return `<div class="tree">${t.parts.map((p,i)=>`<div class="tree-row"><span class="status-dot ${p.status}">${p.status==='done'?'✓':p.status==='blocked'?'!':'◦'}</span><span class="grow">${esc(p.name)}</span><span class="muted" style="font-size:10px">${labels[p.status]}</span></div>${p.children?`<div class="tree-children">${p.children.map(c=>`<div class="tree-row"><span class="status-dot ${c.status}">${c.status==='done'?'✓':'◦'}</span>${btn('#'+c.number+' '+esc(c.name),'child-info','link small',false,t.id+':'+c.number)}<span class="muted" style="margin-left:auto;font-size:10px">${labels[c.status]}</span></div>`).join('')}</div>`:''}`).join('')}</div>`}
function inspector(){if(!ui.inspector)return '';if(ui.inspector.type==='pr'){const p=state.prs.find(p=>p.number===Number(ui.inspector.id)),t=issue(p.issue);return `<aside class="inspector" aria-label="PR 详情"><div class="inspector-header"><span class="muted">PR #${p.number}</span>${btn('×','close-inspector','icon quiet')}</div><h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p><div class="factgrid"><div><div class="mini-label">检查</div>${badge(p.checks==='passed'?'全部通过':'1 项集成检查失败',p.checks==='passed'?'green':'amber')}</div><div><div class="mini-label">评审</div>${badge(p.review==='approved'?'已批准':'等待评审')}</div></div><div class="inspector-block"><h3>关联工作</h3><div style="margin-top:9px">${btn(ref(t)+' '+esc(t.title),'issue','link',false,t.id)}</div><p style="margin-top:8px">${progress(t)}</p></div><div class="inspector-block"><h3>在 DSH 中继续</h3><p style="margin-top:8px">将 PR 摘要与检查结果带入会话，沿用项目现有评审 skill。</p><div class="actions">${btn(p.checks==='failed'?'进入会话检查失败项':'在会话中评审','review-pr','primary',p.state==='Merged',p.number)}</div></div></aside>`}
const t=issue(ui.inspector.id),s=session(t.session),p=project(t.project);return `<aside class="inspector" aria-label="Issue 详情"><div class="inspector-header"><span class="muted">${p.name} / ${ref(t)}</span>${btn('×','close-inspector','icon quiet')}</div><h2>${esc(t.title)}</h2><div class="row" style="margin:13px 0">${status(t)}${t.number?badge('Issue '+t.remote,t.remote==='Closed'?'purple':'green'):badge('纯本地')}</div><p>${esc(t.description)}</p><div class="actions">${s?btn('↗ 进入处理会话','session','primary',false,s.id):btn('开始处理','start','primary',false,t.id)}${state.prs.filter(pr=>pr.issue===t.id).map(pr=>btn('PR #'+pr.number,'pr','',false,pr.number)).join('')}</div>${t.sync==='error'||t.sync==='pending'?`<div class="inline-note space">本地工作已验收完成，Issue 关闭${t.sync==='error'?'同步失败':'待同步'}。<br>${btn('重试同步','retry-sync','link small',false,t.id)}</div>`:''}<div class="inspector-block space"><div class="between"><h3>整体进展</h3><small class="muted">${t.parts.length?'7 项工作':'当前工作'}</small></div><p style="margin-top:7px">${progress(t)}</p>${t.parts.length?`<div class="progress-track"><span style="width:${t.parts.filter(p=>p.status==='done').length/t.parts.length*100}%"></span></div>${partTree(t)}`:''}</div>${t.question&&t.status!=='done'?`<div class="inspector-block"><h3>需要确认</h3><p style="margin-top:8px">${esc(t.question)}</p><div class="actions">${btn('回复到会话','answer','small',false,t.id)}</div></div>`:''}<div class="inspector-block"><div class="between"><h3>处理会话</h3>${btn('接续设置','context-settings','link small',false,t.project)}</div>${s?`<div style="margin-top:10px">${btn(esc(s.name),'session','link',false,s.id)}</div><p style="font-size:11px;margin-top:7px">第 ${s.generation} 段 · ${s.tokens}K 上下文<br>${p.auto?'达到 '+p.limit+'K 自动接续':'自动接续已关闭'}</p>`:'<p style="margin-top:8px">开始处理后，关联的 DSH 会话会出现在这里。</p>'}</div><div class="inspector-block"><h3>最近进展</h3><div class="activity">${t.events.slice(-3).reverse().map(e=>`<div>${esc(e)}</div>`).join('')||'<div>尚未开始处理。</div>'}</div></div></aside>`}
function panel(){return `<div class="topline"><div class="row">${btn('×','return-chat','icon quiet')}<span class="title">A²D² 控制面板</span></div><div class="row"><span class="source">GitHub · E5Box</span><span class="mock">独立原型 · 内存演示</span></div></div><div class="panel"><div class="page-title"><h1>任务</h1><p>查看 Issue、PR 及其关联会话。</p></div><div class="tabbar"><div class="tabs" role="tablist" aria-label="工作对象">${[['issues','Issue'],['prs','PR'],['projects','项目']].map(([k,n])=>`<button role="tab" aria-selected="${ui.tab===k}" data-tab="${k}" class="${ui.tab===k?'active':''}">${n}</button>`).join('')}</div><select id="project-filter" aria-label="筛选项目"><option value="all" ${ui.project==='all'?'selected':''}>所有项目</option>${state.projects.map(p=>`<option value="${p.id}" ${ui.project===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>${!state.sourceOnline?'<div class="notice">GitHub 来源暂不可用 · 显示最近同步结果。正在进行的本地工作与会话保持不变。</div>':ui.project!=='all'&&!project(ui.project).connected?'<div class="notice">此项目已断开 GitHub 协同 · 保留已有工作、会话和待同步操作。</div>':''}<div class="board"><section class="board-content">${({issues:issuesPage,prs:prsPage,projects:projectsPage}[ui.tab])()}${queuebar()}</section>${inspector()}</div></div>`}
function chat(){const s=session(ui.session);if(!s)return `<div class="panel"><h1>DSH 会话</h1><p class="space">从左侧选择会话，或开始一个新会话。</p></div>`;const t=issue(s.issue),p=project(s.project);return `<div class="topline"><span class="title">${p.name} <span class="muted">/ 会话</span></span><div class="row"><span class="source">E5Box · DSH native</span><span class="mock">会话界面示意</span></div></div><div class="chat-top"><div><h2>${esc(s.name)}</h2><small class="muted">${s.state==='archived'?'历史会话 · 已接续到后继':s.role==='review'?'PR 评审会话':'沿用当前项目 skill'} · 第 ${s.generation} 段</small></div>${btn(s.tokens+'K / '+p.limit+'K · '+(p.auto?'自动接续':'手动接续'),'context-settings','small',false,p.id)}</div>${t?`<div class="task-strip"><div class="row">${btn(ref(t)+' '+esc(t.title),'chat-issue','link',false,t.id)}${status(t)}</div>${btn(progress(t)+' ↗','chat-issue','link small',false,t.id)}</div>`:''}<div class="chat">${s.handoff?`<div class="handoff-note"><b>已接续当前工作</b><p style="margin-top:7px">${esc(s.handoff)}</p></div>`:''}<div class="message user"><div class="message-header"><div class="avatar">LF</div><span>LF</span></div><div class="message-body">${esc(t?'按项目现有的 skill 处理 '+ref(t)+'，有需要我确认的地方再告诉我。':'在这个项目中开始工作，继续使用现有 skill。')}</div></div><div class="message"><div class="message-header"><div class="avatar" style="background:#eeedf7;color:#8a83a9">◈</div><span>Assistant</span><span style="margin-left:auto">${s.state==='running'?'工作中':'已有记录'}</span></div><div class="message-body">${esc(s.role==='review'?'已关联 PR，将检查变更与失败项，并把评审结论留在当前会话。':t?.parts.length?'已整理为 '+t.parts.length+' 项工作。'+progress(t)+'。\n\n'+(t.status==='done'?'这项工作已验收完成，处理记录已保留。':t.question?'有一处需要确认，其余工作可以继续推进。':'继续按已确认的范围推进，展开工作可查看每一项进展。'):t?.status==='review'?'实现已提交，等待评审结果。关联 PR 与处理进展可以从上方工作入口查看。':t?.status==='blocked'?'当前有一项范围需要确认，回复后可以继续。':t?.status==='done'?'这项工作已经验收完成，处理记录已保留。':'已接收工作，将按项目现有开发流程继续。')}</div>${t?.parts.length?`<div class="toolbox"><div class="between"><span>✓ 最近执行</span><span>结果已记录</span></div><code>检查镜像列表与仓库筛选的集成结果</code><div style="margin-top:10px">${btn('查看 7 项工作及子 Issue →','chat-issue','link small',false,t.id)}</div></div>`:''}</div>${s.messages.map(m=>`<div class="message ${m.role==='user'?'user':''}"><div class="message-header"><div class="avatar">${m.role==='user'?'LF':'◈'}</div>${m.role==='user'?'LF':'Assistant'}</div><div class="message-body">${esc(m.text)}</div></div>`).join('')}</div><div class="composer"><form id="chat-form" class="composer-box"><textarea id="chat-input" name="message" aria-label="发送给当前会话" placeholder="继续对话，或补充当前工作的要求…" ${s.state==='archived'?'disabled':''}></textarea><div class="composer-foot"><span>DSH native · 当前项目 · ${s.state==='archived'?'历史只读':'仅模拟消息'}</span><div class="row">${t?btn('当前进度','ask-progress','quiet small',s.state==='archived'):''}<button class="primary small" type="submit" ${s.state==='archived'?'disabled':''}>发送 ↑</button></div></div></form></div>`}
function demo(){return `<details class="demo" id="demo" ${ui.demo?'open':''}><summary>原型演示<span style="margin-left:auto">单入口 · 不接入真实服务 · 刷新重置</span></summary><div class="demo-buttons">${btn('收到一条新 Issue','demo-new')}${btn('模拟上下文增长 +30K','demo-context')}${btn('收到当前工作验收通过','demo-complete')}${btn(state.sourceOnline?'模拟来源不可用':'恢复来源连接','demo-network')}${btn('恢复初始示例','demo-reset')}</div><p>这些按钮用于模拟事件；日常操作仍从 Issue、PR、项目及 DSH 会话进入。工作完成须有真实验收，本原型仅注入验收已通过的结果。</p></details>`}
function render(){const focus=document.activeElement?.id,pos=document.activeElement?.selectionStart;$('#app').innerHTML=sidebar()+`<main class="main">${ui.view==='panel'?panel():chat()}${demo()}</main>`;$('#demo').addEventListener('toggle',e=>ui.demo=e.target.open);if(focus==='issue-search'){$('#issue-search').focus();$('#issue-search').setSelectionRange(pos,pos)}}
let submitHandler=null;function modal(title,fields,submit,handler){$('#modal').innerHTML=`<form id="dialog-form"><div class="between"><h2>${title}</h2><button type="button" class="quiet icon" data-action="close-modal" aria-label="关闭弹窗">×</button></div><div class="fields">${fields}</div><div class="error" id="form-error" role="alert"></div><div class="dialog-foot"><button type="button" data-action="close-modal">取消</button><button type="submit" class="primary">${submit}</button></div></form>`;submitHandler=handler;$('#modal').showModal();$('#modal').querySelector('input,textarea,select')?.focus()}
function closeModal(){$('#modal').close();submitHandler=null}
function saveModal(fn,text){fn();closeModal();render();notify(text)}
function activeWork(){if(ui.view==='chat')return issue(session(ui.session)?.issue);if(ui.inspector?.type==='issue')return issue(ui.inspector.id);if(ui.inspector?.type==='pr')return issue(state.prs.find(p=>p.number===ui.inspector.id)?.issue);const queued=issue(state.queue.current);if(queued&&(ui.project==='all'||queued.project===ui.project))return queued;return state.issues.find(t=>t.status==='running'&&(ui.project==='all'||t.project===ui.project))}
const handlers={
'panel':()=>{ui.view='panel';ui.inspector=null;render()},'return-chat':()=>openSession(ui.session),'session':openSession,'issue':openIssue,'chat-issue':id=>{ui.view='panel';ui.tab='issues';ui.project=issue(id).project;openIssue(id)},'close-inspector':()=>{ui.inspector=null;render()},'pr':id=>{ui.inspector={type:'pr',id:Number(id)};render()},
'project':id=>{ui.projectDetail=id;ui.project=id;ui.inspector=null;render()},'project-back':()=>{ui.projectDetail=null;render()},
'start':id=>{const t=issue(id);const sid=startIssue(t);driveQueue();openSession(sid);notify('已在 DSH 会话中开始处理（模拟）')},
'new-session':()=>modal('新建 DSH 会话',select('project','项目',state.projects.map(p=>[p.id,p.name]),ui.project==='all'?'rise':ui.project)+field('name','会话名称','','required placeholder="开始一段新的工作"'),'创建会话',v=>{const s={id:nextId('session'),project:v.project,issue:null,name:v.name.trim(),generation:1,state:'running',tokens:0,role:'general',messages:[]};if(!s.name)throw Error('请输入会话名称');state.sessions.push(s);closeModal();openSession(s.id)}),
'queue-settings':()=>modal('持续处理工作列表',select('project','工作来源', [['all','所有项目'],...state.projects.map(p=>[p.id,p.name])],state.queue.enabled?state.queue.project:ui.project)+select('mine','处理范围',[['yes','分配给我的开放 Issue'],['no','所选项目的全部开放工作']],state.queue.mine?'yes':'no')+select('flow','开发流程',[['当前项目的开发 skill','沿用当前项目的开发 skill'],['项目 Bug 修复 skill','使用项目 Bug 修复 skill（演示）']],state.queue.flow)+`<div class="inline-note">一次处理 1 项。已有运行会话直接接续；待确认和待评审的工作单独保留。验收完成后接下一项，不等待可选的 Issue 关闭同步。</div>`,'开启持续处理',v=>saveModal(()=>{state.queue={...state.queue,enabled:true,project:v.project,mine:v.mine==='yes',flow:v.flow,current:null};driveQueue()},'已开启持续处理，沿用已有会话')),
'pause-queue':()=>{state.queue.enabled=false;render();notify('已暂停接新工作，当前会话继续运行')},
'context-settings':id=>{const p=project(id||session(ui.session)?.project||ui.project)||state.projects[0];modal('自动接续',select('auto','适用于 '+p.name+' 的处理会话',[['yes','开启自动接续'],['no','关闭自动接续']],p.auto?'yes':'no')+field('limit','上下文接续阈值（K tokens）',p.limit,'type="number" min="50" max="350" step="10" required')+'<div class="inline-note">200K、300K 均可设置。接续携带目标、已接受的决定、进展和下一步，旧会话保留可查。本原型假设模型窗口为 400K，预留接续空间。</div>','保存设置',v=>saveModal(()=>{const n=Number(v.limit);if(n<50||n>350||n%10)throw Error('请输入 50–350 之间、以 10 为步长的阈值');p.limit=n;p.auto=v.auto==='yes';state.sessions.filter(s=>s.project===p.id&&s.state==='running').forEach(rotate)},'接续设置已保存'))},
'add-work':()=>modal('添加工作',select('project','项目',state.projects.map(p=>[p.id,p.name]),ui.project==='all'?'rise':ui.project)+field('title','工作标题','','required placeholder="要处理什么？"')+field('link','已有 Issue 链接 · 可留空','','placeholder="https://github.com/owner/repo/issues/123"')+area('description','目标与验收说明','','required')+'<div class="inline-note">已有 Issue 关联到工作列表；链接留空时创建本地工作，同样可进入 DSH 会话处理。</div>','添加到列表',v=>{const p=project(v.project);let number=null;if(v.link.trim()){const match=v.link.trim().match(/^https:\/\/github\.com\/([^/]+\/[^/]+)\/issues\/(\d+)\/?$/i);if(!match||match[1].toLowerCase()!==p.repo.toLowerCase())throw Error('请使用所选项目仓库的有效 Issue 链接');number=Number(match[2]);if(!Number.isSafeInteger(number)||number<1)throw Error('Issue 编号无效');const existing=state.issues.find(t=>t.project===p.id&&(t.number===number||t.parts.some(part=>part.children?.some(child=>child.number===number))));if(existing){closeModal();openIssue(existing.id);notify(existing.number===number?'已定位已有工作，没有重复创建':'此子 Issue 已由 '+ref(existing)+' 的会话处理，已返回所属工作');return}}if(!v.title.trim()||!v.description.trim())throw Error('请填写标题与目标/验收说明');const t={id:nextId('work'),number,project:v.project,title:v.title.trim(),mine:true,remote:number?'Open':null,status:'queued',session:null,sync:number?'synced':null,pr:null,description:v.description.trim(),parts:[],events:['添加到本地工作列表。']};state.issues.push(t);driveQueue();closeModal();ui.project=v.project;ui.query='';ui.filter='mine';openIssue(t.id);notify('工作已添加，可直接在会话中开始')}),
'answer':id=>{const t=issue(id);modal('回复到处理会话',`<div class="inline-note">${esc(t.question)}</div>`+area('answer','补充说明','','required'),'发送并继续',v=>saveModal(()=>{if(!v.answer.trim())throw Error('请输入回复');(t.decisions??=[]).push(v.answer.trim());t.question='';if(t.status==='blocked')t.status='running';t.parts.filter(p=>p.status==='blocked').forEach(p=>p.status='queued');const s=session(t.session);if(s){s.messages.push({role:'user',text:v.answer},{role:'assistant',text:'已记录这项确认，继续当前工作。'});s.state='running'}t.events.push('收到 LF 确认：'+v.answer)},'已将确认发送到关联会话'))},
'child-info':id=>{const [parent,num]=id.split(':');const t=issue(parent),c=t.parts.flatMap(p=>p.children||[]).find(c=>String(c.number)===num);modal('子 Issue #'+num,`<div><h3>${esc(c.name)}</h3><p style="margin-top:10px;font-size:12px">归属于 ${ref(t)}「${esc(t.title)}」的工作拆解。</p><div class="row space">${badge(labels[c.status],tones[c.status])}</div></div><div class="inline-note">此项由原始 Issue 的关联会话协调。返回该会话可查看执行过程，并保留父工作背景。</div>`,'进入关联会话',()=>{closeModal();openSession(t.session)})},
'review-pr':id=>{const pr=state.prs.find(p=>p.number===Number(id)),t=issue(pr.issue);let s=state.sessions.find(s=>s.pr===pr.number&&s.state!=='archived');if(!s){s={id:nextId('session'),project:pr.project,issue:t.id,pr:pr.number,name:'评审 PR #'+pr.number+' · '+t.title,generation:1,state:'running',tokens:15,role:'review',messages:[]};state.sessions.push(s)}openSession(s.id);notify('PR 与检查结果已带入评审会话（模拟）')},
'source-settings':id=>{const p=project(id);modal('项目来源',`<div><h3>${p.name}</h3><p class="space" style="font-size:12px">${p.repo}<br>GitHub Project · ${p.source}</p></div><div class="inline-note">${p.connected?'断开后停止外部拉取与发布，保留工作内容、会话、进展和待同步操作。':'重新关联原来源，保留已有工作身份和执行会话。'}</div>`,p.connected?'断开协同':'恢复协同',()=>saveModal(()=>p.connected=!p.connected,p.connected?'已断开协同，本地工作继续':'已恢复原协同来源'))},
'refresh':()=>notify(state.sourceOnline?'示例列表已刷新，已有工作没有重复导入':'来源暂不可用，保留已有记录'),
'retry-sync':id=>{const t=issue(id);if(!state.sourceOnline||!project(t.project).connected){notify('来源尚不可用，保留待同步操作');return}t.remote='Closed';t.sync='synced';t.events.push('补同步成功，Issue 已关闭；未重跑任务。');render();notify('已补同步关闭，处理会话未重启')},
'ask-progress':()=>{const s=session(ui.session),t=issue(s.issue);s.messages.push({role:'user',text:'当前进度怎么样？'},{role:'assistant',text:progress(t)+'。'+(t.question?'需要确认：'+t.question:'可以在上方关联工作中查看展开的进展。')});render()},
'demo-network':()=>{state.sourceOnline=!state.sourceOnline;render();notify(state.sourceOnline?'模拟来源已恢复':'模拟来源不可用，保留现有工作与会话')},
'demo-context':()=>{const t=activeWork(),s=session(t?.session);if(!s||s.state!=='running'){notify('请先选择一个正在处理的工作会话');return}s.tokens+=30;rotate(s);render();if(s.state!=='archived')notify('上下文已增加到 '+s.tokens+'K，尚未触发接续')},
'demo-complete':()=>{const t=activeWork();if(!t||t.status!=='running'){notify('当前没有正在处理的工作');return}t.status='done';t.question='';t.parts.forEach(p=>{p.status='done';p.children?.forEach(c=>c.status='done')});state.sessions.filter(s=>s.issue===t.id&&s.state!=='archived').forEach(s=>s.state='finished');t.sync=t.number?(state.sourceOnline&&project(t.project).connected?'pending':'error'):null;t.events.push('模拟收到验收通过：工作完成，处理会话收口。');if(state.queue.enabled&&state.queue.current===t.id)state.queue.handled++;driveQueue();render();notify(ref(t)+' 已完成'+(state.queue.enabled?'，继续检查下一项工作':''))},
'demo-new':()=>{const p=project(ui.project==='all'?'rise':ui.project);if(!state.sourceOnline||!p.connected){notify('来源不可用，暂不能收到新的远端 Issue');return}const n=++state.serial;state.issues.push({id:'work-new-'+n,number:n,project:p.id,title:'修复镜像标签筛选结果不一致',mine:true,remote:'Open',status:'queued',session:null,sync:'synced',pr:null,description:'模拟从既定来源收到的一项新 Bug。',parts:[],events:['从来源列表发现新 Issue。']});driveQueue();render();notify('发现一条新 Issue，已按规则加入工作列表')},
'demo-reset':()=>{state=initial();Object.assign(ui,{view:'panel',tab:'issues',project:'rise',filter:'mine',query:'',inspector:null,session:'s-02',projectDetail:null});render();notify('已恢复初始示例')},'close-modal':closeModal
};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){ui.tab=b.dataset.tab;ui.filter='mine';ui.inspector=null;ui.projectDetail=null;render()}else if(b.dataset.filter){ui.filter=b.dataset.filter;render()}else if(b.dataset.action)handlers[b.dataset.action]?.(b.dataset.id)});
document.addEventListener('input',e=>{if(e.target.id==='issue-search'){ui.query=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.id==='project-filter'){ui.project=e.target.value;ui.projectDetail=null;ui.inspector=null;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='dialog-form'){e.preventDefault();try{submitHandler?.(Object.fromEntries(new FormData(e.target)))}catch(err){$('#form-error').textContent=err.message}}if(e.target.id==='chat-form'){e.preventDefault();const text=$('#chat-input').value.trim(),s=session(ui.session);if(!text||s.state==='archived')return;s.messages.push({role:'user',text},{role:'assistant',text:'已记录这条补充说明。此处仅模拟 DSH 对话，不调用真实模型。'});render();notify('消息已记录在当前模拟会话')}});
$('#modal').addEventListener('cancel',()=>submitHandler=null);
render();
</script></body></html>
