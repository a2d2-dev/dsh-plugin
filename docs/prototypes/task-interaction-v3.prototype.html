);margin-top:4px}.timeline li:last-child{padding-bottom:0}.progress{height:5px;background:#e8eeea;border-radius:3px;margin:16px 0}.progress span{height:100%;display:block;border-radius:3px;background:#589877}.conflict{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.conflict>div{padding:14px;border:1px solid var(--line);border-radius:8px}.scenario{border:1px dashed #cbd6cf;background:#f0f3f1;border-radius:11px;padding:15px 18px;margin-top:28px}.scenario summary{cursor:pointer;font-size:12px;display:flex;gap:8px;list-style:none;color:#69796e}.scenario summary:before{content:'▸'}.scenario[open] summary:before{content:'▾'}.scenario-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.scenario-tabs button{font-size:12px;background:transparent}.scenario-tabs button.active{background:white;border-color:#b7cbbe;color:var(--accent)}.scenario-body{display:grid;grid-template-columns:1fr 1fr;gap:20px}.scenario-body p{font-size:12px;margin:6px 0 13px}.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.steps span{background:#e3e9e5;color:#88968c;padding:3px 7px;border-radius:4px;font-size:10px}.steps span.done{background:#d7e8dc;color:#487456}.steps span.current{background:white;color:var(--accent)}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;color:#97a39b;margin-top:22px}.dialog{padding:0;border:1px solid var(--line);border-radius:15px;width:calc(100% - 30px);max-width:560px;max-height:90vh;color:var(--ink);box-shadow:0 20px 90px #18312430}.dialog::backdrop{background:#1a30284f;backdrop-filter:blur(2px)}.dialog form{padding:26px}.fields{display:grid;gap:15px;margin-top:20px}.fields label{font-size:12px;color:#5b6e61;display:grid;gap:6px}.dialog-foot{display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--line);margin-top:23px;padding-top:18px}.form-error{font-size:12px;color:var(--red);margin-top:12px}.toast{display:none;position:fixed;right:25px;bottom:24px;max-width:440px;background: <script>
/* THROWAWAY PROTOTYPE — no storage, network, runtime calls, or real tasks.
   Pure in-memory transitions illustrate DDD v3; they are not production contracts. */
const Model=(()=>{
 const stages=['specify','plan','implement','review','done'];
 const empty=()=>({serial:100,projects:[],agents:[],tasks:[],events:[],network:true});
 const id=(s,p)=>p+'-'+(++s.serial);
 const log=(s,t,text)=>s.events.push({n:s.events.length+1,task:t?.id||null,project:t?.project||null,text});
 const touch=t=>{t.rev++;if(t.external){t.external.pending=true;if(!t.external.conflict&&t.external.sync!=='unknown')t.external.sync='pending'}};
 function apply(input,a){const s=structuredClone(input);let t=s.tasks.find(x=>x.id===a.task),p=s.projects.find(x=>x.id===(a.project||t?.project));const must=(x,m)=>{if(!x)throw Error(m)};const active=()=>must(t?.execution?.lock&&t.status==='running','需要有效执行资格与正在运行的协调会话');
 switch(a.type){
 case 'project':must(a.name?.trim(),'请填写项目名称');p={id:id(s,'prj'),name:a.name.trim(),description:a.description||'',github:false,githubRef:''};s.projects.push(p);log(s,{project:p.id},'创建本地项目 · 无外部依赖');break;
 case 'agent':must(p&&a.name?.trim(),'请选择项目并填写 Agent 名称');s.agents.push({id:id(s,'agt'),project:p.id,name:a.name.trim(),role:a.role||'工程师',provider:a.provider||'native'});log(s,{project:p.id},'添加项目 Agent · '+a.name);break;
 case 'task':must(p&&a.title?.trim()&&a.spec?.trim()&&a.criteria?.length,'请填写任务目标、规格和验收标准');if(a.parent)must(s.tasks.some(x=>x.id===a.parent&&x.project===p.id&&x.stage!=='done'),'父任务不存在或已完成');t={id:id(s,'tsk'),project:p.id,title:a.title.trim(),spec:a.spec.trim(),criteria:a.criteria.map(text=>({text,checked:false})),parent:a.parent||null,agent:null,stage:'specify',status:'idle',rev:1,execution:null,external:null,delegations:[],evidence:'',conclusion:'',question:'',answer:'',parentNotified:false};s.tasks.push(t);log(s,t,'任务创建 · 目标、规格、验收已记录在本地');break;
 case 'assign':{must(t&&t.stage!=='done'&&!t.execution?.lock,'请先在安全边界释放执行资格；已完成任务不可重指派');const ag=s.agents.find(x=>x.id===a.agent&&x.project===p.id);must(ag?.provider==='native','协调者需要可交互与可接续的原生会话；one-shot 仅用于委派');t.agent=ag.id;touch(t);log(s,t,'指派给 '+ag.name+' · 尚未授予执行资格');break;}
 case 'claim':must(t?.agent&&t.stage!=='done','请先指派负责 Agent');must(!t.execution?.lock,'认领被拒绝：此任务已有唯一有效协调者');t.execution??={id:id(s,'exe'),lock:false,epoch:0,generation:0,sessions:[],cwd:'',host:'local-runtime',preset:'workspace-write'};t.execution.lock=true;t.execution.epoch++;t.status='claimed';log(s,t,'授予执行资格 · '+t.agent+' · epoch '+t.execution.epoch);break;
 case 'start':must(t?.status==='claimed'&&t.execution.lock,'请先领取执行资格');must(a.cwd?.startsWith('/'),'需要绝对工作目录');t.execution.cwd=a.cwd;t.execution.preset=a.preset||'workspace-write';t.execution.generation++;t.execution.sessions.push({id:id(s,'ses'),generation:t.execution.generation,state:'active',reason:'显式启动执行'});t.status='running';log(s,t,'启动 DSH 原生主会话 · '+a.cwd);break;
 case 'advance':active();must(!['review','done'].includes(t.stage),'请通过验收面板完成任务');t.stage=stages[stages.indexOf(t.stage)+1];touch(t);log(s,t,'业务阶段推进至 '+t.stage);break;
 case 'handoff':active();must(a.summary?.trim(),'请保存接续摘要');t.execution.sessions.at(-1).state='retired';t.execution.epoch++;t.execution.generation++;t.execution.sessions.push({id:id(s,'ses'),generation:t.execution.generation,state:'active',reason:a.summary});log(s,t,'交接至第 '+t.execution.generation+' 代 · 旧会话失去协调权 · 阶段仍为 '+t.stage);break;
 case 'release':must(t?.execution?.lock,'当前没有执行占用');must(!t.delegations.some(d=>d.status==='running'),'先结算运行中的委派');t.execution.lock=false;if(t.execution.sessions.length)t.execution.sessions.at(-1).state='retired';t.status='idle';log(s,t,'安全停止协调执行并释放资格');break;
 case 'wait':active();must(a.question?.trim(),'请填写问题');t.question=a.question;t.answer='';t.status='waiting-human';log(s,t,'等待人类 · '+a.question);break;
 case 'answer':must(t?.status==='waiting-human'&&a.answer?.trim(),'请输入等待问题的回复');t.answer=a.answer;t.status='running';log(s,t,'回复已接收并消费 · '+a.answer);break;
 case 'interrupt':active();t.status='interrupted';t.execution.sessions.at(-1).state='interrupted';log(s,t,'模拟宿主中断 · 恢复点与执行身份保留');break;
 case 'recover':must(t?.status==='interrupted'&&t.execution.lock,'当前没有可恢复的原生会话');t.status='running';t.execution.sessions.at(-1).state='active';log(s,t,'从检查点恢复同一会话 · 未重复启动');break;
 case 'delegate':{active();const ag=s.agents.find(x=>x.id===a.agent&&x.project===p.id);must(ag&&a.title?.trim(),'请选择 Agent 并描述工作');must(!(a.interactive&&ag.provider!=='native'),'one-shot 不支持续聊或冷恢复，请选择原生后端');t.delegations.push({id:id(s,'del'),title:a.title,agent:ag.id,provider:ag.provider,ref:id(s,ag.provider==='native'?'child':'run'),status:'running',result:'',cwd:t.execution.cwd});log(s,t,'派发 '+a.title+' · '+(ag.provider==='native'?'原生子会话':'CLI one-shot run'));break;}
 case 'wait-results':active();must(t.delegations.some(d=>d.status==='running'),'当前没有运行中的子执行');t.status='waiting-results';log(s,t,'等待子执行结果 · 协调资格保留');break;
 case 'settle':{const d=t?.delegations.find(x=>x.id===a.delegation);must(d?.status==='running'&&a.result?.trim(),'需要待结算委派和结果');d.status=a.failed?'failed':'finished';d.result=a.result;log(s,t,'委派结算 · '+d.title+' · '+(a.failed?'失败，待核查副作用':'返回结果，仍需业务验收'));if(t.status==='waiting-results'&&!t.delegations.some(x=>x.status==='running')){t.status='running';log(s,t,'子执行结果已接收并消费 · 协调会话继续，验收仍待负责 Agent 确认');}break;}
 case 'retry':{active();const d=t.delegations.find(x=>x.id===a.delegation);must(d?.status==='failed'&&a.checked,'须先核查失败执行的副作用');t.delegations.push({...d,id:id(s,'del'),ref:id(s,d.provider==='native'?'child':'run'),status:'running',result:''});d.status='retried';log(s,t,'核查后新建委派尝试 · 原 run 保留，不伪称续聊');break;}
 case 'check':must(t?.stage==='review','先推进至 review');t.criteria[a.index].checked=a.checked;touch(t);break;
 case 'evidence':must(t?.stage==='review'&&a.evidence?.trim()&&a.conclusion?.trim(),'需要验收阶段、证据和结论');t.evidence=a.evidence.trim();t.conclusion=a.conclusion.trim();touch(t);log(s,t,'验收证据与结论已保存');break;

后新建尝试','retry','small',!run,d.id):''}</div></div>`).join('')||'<div class="empty" style="padding:23px 0">暂无委派。原生子会话与 one-shot run 分别记录。</div>'}</section></div><section class="panel"><h2>主会话代次</h2><p style="font-size:12px;margin:10px 0 16px">业务阶段 <b>${t.stage}</b> 独立于会话代次。交接继承身份、执行环境与恢复点。</p>${ex?.sessions.slice().reverse().map(s=>`<div class="session ${s.state==='active'?'current':''}"><div class="between"><b>第 ${s.generation} 代</b>${badge({active:'当前',retired:'已交出',interrupted:'中断',completed:'已收口'}[s.state],s.state==='active'?'green':'')}</div><div class="mono" style="margin:8px 0">${s.id}</div><small class="muted">${esc(s.reason)}</small></div>`).join('')||'<p class="space">启动后显示会话历史。</p>'}<div class="note space">交接只转移唯一协调权，已派发工作保留关联。</div></section></div>`}
function acceptanceTab(t){const done=t.stage==='done',can=t.stage==='review',pending=state.tasks.filter(x=>x.parent===t.id&&x.stage!=='done').length,ds=t.delegations.filter(d=>['running','failed'].includes(d.status)).length,count=t.criteria.filter(c=>c.checked).length,ready=can&&t.status==='running'&&count===t.criteria.length&&t.evidence&&t.conclusion&&!pending&&!ds;return `<div class="grid2"><section class="panel"><div class="between"><h2>逐项验收</h2>${badge(count+' / '+t.criteria.length+' 已核验',count===t.criteria.length?'green':'')}</div><div class="progress"><span style="width:${count/t.criteria.length*100}%"></span></div>${!can&&!done?'<div class="note amber">先推进至 review，再由负责 Agent 核验标准与证据。</div>':''}${t.criteria.map((c,i)=>`<div class="check"><input type="checkbox" id="criterion-${i}" data-check="${i}" ${c.checked?'checked':''} ${!can?'disabled':''}><label for="criterion-${i}">${esc(c.text)}<small>负责 Agent：${esc(A(t.agent)?.name||'尚未指派')}</small></label></div>`).join('')}<div class="between space"><h3>证据与验收结论</h3>${btn(t.evidence?'编辑记录':'添加证据','evidence','small',!can)}</div><div class="text space">${esc(t.evidence||'尚无证据。可记录本地文档、测试结果、提交或评审记录。')}</div>${t.conclusion?`<div class="note green space">验收结论：${esc(t.conclusion)}</div>`:''}</section><div class="stack"><section class="panel"><h2>${done?'完成记录':'提交本地完成'}</h2><div class="fact"><label>确认角色</label><strong>${esc(A(t.agent)?.name||'待指派')} · 负责 Agent</strong></div><div class="fact"><label>必要子工作</label><strong>${pending} 项子任务待完成 / ${ds} 项委派待处理</strong></div><div class="fact"><label>外部协同</label><strong>${t.external?syncLabel(t):'未关联 · 无需外部关闭'}</strong></div>${done?`<div class="note green space">✓ 完成事实已保存<br>✓ 执行资格已释放<br>✓ ${t.parent?'父任务通知已记录':'无父任务待通知'}</div>`:`<p style="font-size:12px;margin:16px 0">验收成立，证据与结论完整后，提交本地完成事实并收口执行。</p>${btn('确认验收并完成','complete','primary',!ready)}`}</section>${t.external?`<section class="panel"><h3>关联 Issue</h3><p style="font-size:12px;margin:12px 0">${esc(t.external.ref)}<br>最后观察：${t.external.remote==='closed'?'Closed · 已关闭':'Open · 仍打开'}</p>${btn('查看外部同步 →','github-tab','link small')}</section>`:''}</div></div>`}
function syncLabel(t){const e=t.external;if(!e)return '未关联';if(!e.linked)return '关联已解除 · 操作保留';if(!P().github)return '协同已停用 · 队列保留';if(e.conflict)return '冲突待处理';return {pending:t.stage==='done'?'Issue 关闭待同步':'发布待同步',synced:'已同步',error:t.stage==='done'?'Issue 关闭同步失败':'同步失败',unknown:'结果未知 · 待核对'}[e.sync]}
function githubTab(t){const e=t.external,enabled=P().github&&e?.linked;return `<div class="grid2"><section class="panel"><div class="between"><h2>可选 GitHub 关联</h2>${badge(syncLabel(t),e?.sync==='error'?'red':e?.sync==='synced'?'green':e?'amber':'')}</div>${!P().github?`<div class="note space">项目协同未启用。本地任务、执行与验收可以继续推进。</div><div class="actions">${btn('启用项目 GitHub 协同','enable-github','primary')}</div>`:''}${!e?`<div class="empty"><h3>这个任务尚未关联 Issue</h3><p>关联后 Task、Agent、会话与执行资格保持不变。</p>${btn('关联已有 Issue','bind','primary',!P().github)}</div>`:`<div class="fact space"><label>外部工作项 · 演示引用</label><strong>${esc(e.ref)}</strong><div class="mono muted">ExternalBinding ${e.id} → ${t.id}</div></div><div class="meta space"><div class="fact"><label>本地任务</label><strong>${t.stage==='done'?'已完成':'进行中 · '+t.stage}</strong><div class="mono muted">当前 v${t.rev}</div></div><div class="fact"><label>Issue 最后观察</label><strong>${e.remote==='closed'?'Closed · 已关闭':'Open · 仍打开'}</strong><div class="mono muted">外部观察 v${e.observation}</div></div><div class="fact"><label>最后发布版本</label><strong>${e.published?'v'+e.published:'尚未发布'}</strong></div></div>${e.sync==='error'?'<div class="note red space">网络不可达，外部更新未确认。保留原同步操作；恢复连接后重试，不重跑任务。</div>':''}${e.sync==='unknown'?'<div class="note amber space">响应丢失，发布结果未知。先核对原 Issue 与映射，再决定是否重试。</div>':''}${!e.linked?'<div class="note space">关联已解除，历史与队列保留，远端 Issue 未删除。</div>':''}<div class="actions">${e.sync==='unknown'?btn('核对远端状态','reconcile','primary',!enabled):btn(e.sync==='error'?'重试同步':'同步已提交事实','sync','primary',!enabled||e.conflict||e.sync==='synced')}${e.linked?btn('解除 Issue 关联','unlink'):btn('恢复此关联','rebind','',!P().github)}</div>`}${e?.conflict?`<div class="divider"></div><h3>外部负责人变更与本地指派冲突</h3><div class="conflict"><div><small class="muted">已接受的本地事实</small><div>${esc(A(t.agent)?.name)} · ${t.agent}</div><small>执行资格：${t.execution?.lock?'有效占用 · epoch '+t.execution.epoch:'已释放'}</small></div><div><small class="muted">待校验的外部观察</small><div>external-reviewer</div><small>外部评论提议更换负责人</small></div></div><div class="note amber">外部观察尚未改变负责人或执行锁。接纳前须安全释放资格，再映射到项目 Agent。</div><div class="actions">${btn('保留本地指派','keep-local','',!enabled)}${btn('校验并接纳外部指派','accept-remote','',!enabled||!!t.execution?.lock||t.stage==='done')}</div>`:''}</section><div class="stack"><section class="panel"><h2>身份保持</h2>${[['Project',t.project],['Task',t.id],['Agent',t.agent||'未指派'],['Execution',t.execution?.id||'未启动'],['主会话',t.execution?.sessions.at(-1)?.id||'未启动']].map(([k,v])=>`<div class="fact"><label>${k}</label><strong class="mono">${v}</strong></div>`).join('')}<div class="note green space">关联与停用协同不会创建第二个任务或第二位协调者。</div></section><section class="panel"><h3>项目级协同</h3><p style="font-size:12px;margin:12px 0">停用时保留映射、最后观察与待发布操作。</p>${btn(P().github?'停用 GitHub 协同':'启用 GitHub 协同','toggle-github','small')}</section></div></div>`}
function historyTab(t){return `<section class="panel"><div class="between"><h2>任务活动记录</h2>${badge('本地事实 / 执行事件 / 外部观察')}</div><ol class="timeline space">${state.events.filter(e=>e.task===t.id||e.project===project&&!e.task).slice().reverse().map(e=>`<li>${esc(e.text)}<small>事件 ${String(e.n).padStart(3,'0')} · ${e.task||project}</small></li>`).join('')}</ol></section>`}
function collaborationPage(){return header('GitHub 协同','项目按需启用，每项任务独立选择是否关联。')+`<div class="grid2"><section class="panel"><div class="between"><h2>项目连接</h2>${badge(P().github?'已启用':'未启用',P().github?'green':'')}</div><p class="space" style="font-size:13px">已提交的本地事实可以发布到关联 Issue。外部变更先形成待校验观察。</p><div class="fact space"><label>GitHub Project · 可选演示引用</label><strong>${esc(P().githubRef||'未关联 GitHub Project')}</strong></div><div class="fact"><label>本地 Project</label><strong class="mono">${P().id}</strong></div><div class="actions">${btn(P().github?'停用 GitHub 协同':'启用 GitHub 协同',P().github?'toggle-github':'enable-github',P().github?'':'primary')}</div><div class="note space">所有连接与同步均为内存模拟，不读取凭据或访问 GitHub。</div></section><section class="panel"><h2>保留完整本地闭环</h2><div class="fact"><label>本地工作记录</label><strong>目标、规格、验收、证据</strong></div><div class="fact"><label>执行协调</label><strong>指派、执行资格、接续与恢复点</strong></div><div class="fact"><label>协同停用时</label><strong>保留外部映射与待同步操作</strong></div></section></div><section class="panel flush space"><div class="panel-head"><h2>任务关联</h2></div>${tasks().map(t=>`<div class="task-row"><div class="task-icon">⇄</div><div>${btn(esc(t.title),'open-github','link task-title',false,t.id)}<div class="task-meta">${t.id} · ${esc(t.external?.ref||'未关联 Issue')}</div></div><div style="grid-column:3/-1">${badge(syncLabel(t),t.external?.sync==='error'?'red':'')}</div></div>`).join('')||'<div class="empty">创建本地任务后可按需关联。</div>'}</section>`}
const scenarios={local:{name:'纯本地闭环',desc:'从空白创建 Project、Agent、Task，再指派、领取、启动、验收。所有内容只在页面内存中。',steps:['创建本地项目','添加 Agent','创建本地任务','指派 Agent','领取资格','启动执行','确认规格','确认方案','提交验收','记录证据','验收完成']},handoff:{name:'交接与恢复',desc:'任务处于 implement。主会话换代后阶段不变；中断后恢复同一执行，不重复启动。',steps:['交接主会话','模拟宿主中断','恢复检查点']},switching:{name:'关联与断开',desc:'运行中的任务关联 GitHub 后停用协同，再恢复。观察五个身份与执行占用保持不变。',steps:['启用协同','关联 Issue','发布事实','停用协同','恢复协同']},failure:{name:'完成后同步失败',desc:'断网时本地完成，Issue 仍为 Open。恢复后仅补同步关闭，不重跑任务。',steps:['启用并关联','模拟断网','推进验收','记录证据','本地完成','尝试同步','恢复网络','重试同步']},conflict:{name:'冲突与执行权',desc:'远端评论提议变更负责人。外部观察不能授予执行权；保留本地指派后重新发布。',steps:['启用并关联','外部冲突','尝试重复认领','保留本地指派','同步结果']}};
function scenarioPanel(){const sc=scenarios[ui.scenario];return `<details class="scenario" id="scenario" ${ui.demo?'open':''}><summary><b>演示场景</b><span>可重复走查 · 故障注入</span><span style="margin-left:auto">${state.network?'网络正常':'网络中断'}</span></summary><div class="scenario-tabs">${Object.entries(scenarios).map(([id,s])=>`<button data-scenario="${id}" class="${id===ui.scenario?'active':''}">${s.name}</button>`).join('')}</div><div class="scenario-body"><div><h3>${sc.name}</h3><p>${sc.desc}</p>${btn('载入场景起点','load-scene','small')}<small class="muted" style="margin-left:9px">将替换当前内存演示数据</small></div><div><div class="steps">${sc.steps.map((n,i)=>`<span class="${ui.step>i?'done':ui.step===i?'current':''}">${i+1} ${n}</span>`).join('')}</div>${btn(ui.step<0?'请先载入场景':ui.step>=sc.steps.length?'场景已走完':'下一步 · '+sc.steps[ui.step],'scene-next','primary small',ui.step<0||ui.step>=sc.steps.length)}</div></div><div class="divider"></div><div class="row"><small class="muted">自由注入：</small>${btn(state.network?'模拟网络中断':'恢复网络','network','small')}${btn('模拟宿主中断','interrupt','small',T()?.status!=='running')}${btn('模拟外部指派冲突','inject-conflict','small',!P()?.github||!T()?.external?.linked)}${btn('模拟发布结果未知','unknown','small',!P()?.github||!T()?.external?.linked)}</div><div class="note space"><b>本轮交互提议：</b>指派、领取与启动分步展示；交接在安全边界完成；接纳外部负责人前须释放资格。正式状态机、事务边界与多宿主协调留待下一阶段定稿。</div></details>`}
function page(){if(!P())return `<section class="panel empty"><h1>从一个本地项目开始</h1><p>定义目标，添加 Agent，再创建第一项任务。</p>${btn('创建本地项目','new-project','primary')}</section>`;return ({overview, tasks:taskList,task:taskDetail,agents:agentPage,resources:resourcePage,collaboration:collaborationPage}[ui.page])()}
function render(){const focus=document.activeElement?.id,pos=document.activeElement?.selectionStart;$('#app').innerHTML=`<aside class="sidebar"><div class="brand"><span class="mark">a</span>A²D² <small>WORKSPACE</small></div><div class="project-select"><label for="project-switch">当前项目</label><select id="project-switch" aria-label="当前项目">${state.projects.map(p=>`<option value="${p.id}" ${p.id===project?'selected':''}>${esc(p.name)}</option>`).join('')||'<option>尚无项目</option>'}</select><div style="margin-top:7px">${btn('＋ 新建项目','new-project','ghost small')}</div></div><nav class="nav" aria-label="主导航">${[['overview','◫','项目总览'],['tasks','☷','任务'],['agents','♧','项目 Agent'],['resources','▱','执行资源'],['collaboration','⇄','GitHub 协同']].map(([id,icon,n])=>`<button data-nav="${id}" class="${ui.page===id||id==='tasks'&&ui.page==='task'?'active':''}"><i>${icon}</i>${n}${id==='tasks'?`<span class="count">${tasks().length}</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="local-mark">${badge('● 本地工作记录','green')}<p>项目、Agent 与任务独立存在<br>GitHub 协同按需启用</p></div><div class="profile"><div class="avatar">LF</div><div>LF<small>项目所有者 · 演示身份</small></div></div></div></aside><div class="shell"><header class="topbar"><div>A²D² <span style="margin:0 10px">/</span><b>${esc(P()?.name||'项目')}</b><span style="margin:0 10px">/</span>${esc({overview:'总览',tasks:'任务',task:T()?.id||'任务',agents:'Agent',resources:'资源',collaboration:'协同'}[ui.page])}</div><div class="row"><span class="version">DDD v3</span><span class="prototype">交互原型 · 仅内存演示</span></div></header><main class="content" id="main">${page()}${scenarioPanel()}<footer class="footer"><span>设计问题：纯本地闭环与可选外部协同，能否清楚地共存？</span><span>无网络请求 · 刷新重置 · 不创建真实执行</span></footer></main></div>`;$('#scenario')?.addEventListener('toggle',e=>ui.demo=e.target.open);if(focus==='task-search'){$('#task-search').focus();$('#task-search').setSelectionRange(pos,pos)}}
let submitHandler=null;
function modal(title,fields,submit,handler){$('#modal').innerHTML=`<form id="dialog-form"><div class="between"><h2>${title}</h2><button type="button" class="ghost" data-action="close-modal" aria-label="关闭弹窗">✕</button></div><div class="fields">${fields}</div><div class="form-error" id="form-error" role="alert"></div><div class="dialog-foot"><button type="button" data-action="close-modal">取消</button><button type="submit" class="primary">${submit}</button></div></form>`;submitHandler=handler;$('#modal').showModal();$('#modal').querySelector('input,textarea,select')?.focus()}
function closeModal(){$('#modal').close();submitHandler=null}
function commit(type,v,message){state=act(type,v);closeModal();render();notify(message)}
function taskForm(parent=null){modal(parent?'拆分本地子任务':'创建本地任务',field('title','任务目标','','required maxlength="100" placeholder="例如：梳理模块边界"')+area('spec','规格与预期产出','','required placeholder="描述范围、约束与产出"')+area('criteria','验收标准 · 每行一条','','required placeholder="每一项都应能用证据核验"')+`<div class="note">${parent?'子任务独立验收，作为父任务的必要子工作。':'创建后再指派 Agent 与配置执行资源。'}无需 Issue 或仓库。</div>`,'创建任务',v=>{state=act('task',{...v,criteria:v.criteria.split('\n').map(x=>x.trim()).filter(Boolean),parent});ui.task=state.tasks.at(-1).id;ui.page='task';ui.tab='brief';closeModal();render();notify('本地任务已创建')})}
const handlers={
'new-project':()=>modal('创建本地项目',field('name','项目名称','','required maxlength="60"')+area('description','项目目标')+'<div class="note">无需仓库或 GitHub。建立后可添加 Agent 与任务。</div>','创建项目',v=>{state=act('project',v);project=state.projects.at(-1).id;ui.page='overview';ui.task=null;closeModal();render();notify('本地项目已创建')}),
'new-agent':()=>modal('添加项目 Agent',field('name','Agent 名称','','required maxlength="50"')+select('role','项目职责',[['CEO','CEO · 协调'],['工程师','工程师'],['评审','评审']],'工程师')+select('provider','执行后端',[['native','DSH native · 可交互 / 续聊 / 恢复'],['codex','Codex provider · CLI one-shot'],['claude','Claude provider · CLI one-shot']],'native')+'<div class="note">原生后端可协调任务。one-shot 用于非交互委派，不能作为持久协调会话。</div>','保存 Agent',v=>commit('agent',v,'项目 Agent 已保存')),
'new-task':()=>taskForm(),'new-subtask':()=>taskForm(ui.task),
'assign':()=>modal('指派负责 Agent',select('agent','本项目 Agent',agents().map(a=>[a.id,a.name+' · '+a.role+(a.provider==='native'?'':' · one-shot（不支持协调）')]),T().agent)+'<div class="note">保存职责指派后，需要单独领取执行资格并显式启动。</div>','保存指派',v=>commit('assign',v,'指派已保存 · 尚未启动')),
'claim':()=>dispatch('claim',{},'执行资格已领取 · 等待启动'),
'start':()=>modal('配置执行环境并启动',select('cwd','工作目录 · 演示资源',[['/work/local/research-notes','/work/local/research-notes · 文档目录'],['/work/local/sample-checkout','/work/local/sample-checkout · 本地代码检出']],'/work/local/research-notes')+select('preset','有效权限',[['workspace-write','workspace-write · 目录内写入'],['read-only','read-only · 只读分析']],'workspace-write')+'<div class="note">Host：local-runtime · provider：DSH native。只建立模拟记录，不访问目录或模型。</div>','启动执行',v=>{commit('start',v,'模拟主会话已启动');ui.tab='execution';render()}),
'advance':()=>dispatch('advance',{},'业务阶段已推进'),
'handoff':()=>modal('交接主会话',area('summary','接续摘要','职责边界已梳理；继续核验证据，保持当前业务阶段。','required')+`<div class="note">固定后继为第 ${T().execution.generation+1} 代。旧会话交出资格；Task、Agent、Execution 与阶段 ${T().stage} 保持不变。</div>`,'保存检查点并交接',v=>commit('handoff',v,'会话已换代 · 业务阶段不变')),
'release':()=>modal('安全停止并释放资格','<div class="note amber">模拟已到安全边界：停止协调会话、撤销推进资格，保留阶段与历史。之后可重新指派或领取资格。</div>','确认安全停止',()=>commit('release',{},'执行资格已释放')),
'wait-results':()=>dispatch('wait-results',{},'等待子执行返回 · 执行资格保留'),
'wait':()=>modal('等待人类确认',area('question','需要 LF 确认的问题','','required'),'提交问题',v=>commit('wait',v,'进入等待人类状态')),
'answer':()=>modal('回复并继续',`<div class="note">${esc(T().question)}</div>`+area('answer','LF 的回复','','required'),'记录回复并继续',v=>commit('answer',v,'回复已接收并消费 · 继续执行')),
'interrupt':()=>dispatch('interrupt',{},'已注入模拟中断'),'recover':()=>dispatch('recover',{},'同一执行与会话已恢复'),
'delegate':()=>modal('委派当前任务中的工作',field('title','委派目标','','required placeholder="例如：独立检查模块边界"')+select('agent','执行 Agent',agents().map(a=>[a.id,a.name+' · '+(a.provider==='native'?'原生子会话':a.provider+' one-shot')]),agents().at(-1)?.id)+select('interactive','所需能力',[['no','非交互 · 返回一次结果'],['yes','需要持续交互 / 续聊 / 恢复']],'no')+`<div class="note">继承执行环境：${esc(T().execution.cwd)}。此处创建委派记录；独立子任务在“规格与工作”中拆分。</div>`,'派发工作',v=>commit('delegate',{...v,interactive:v.interactive==='yes'},'工作已委派（模拟）')),
'settle':id=>modal('记录子执行返回',select('outcome','执行结果',[['ok','正常返回 · 等待业务复核'],['failed','失败 · 待核查副作用']],'ok')+area('result','结果 / 证据摘要','','required'),'记录结果',v=>commit('settle',{delegation:id,result:v.result,failed:v.outcome==='failed'},'执行结果已记录，尚未自动通过验收')),
'retry':id=>modal('核查后新建尝试','<div class="note amber">模拟核查文件与外部副作用。原执行记录保留，新尝试生成新委派与 run；one-shot 不伪称可续聊。</div>'+select('checked','副作用核查',[['no','尚未核查'],['yes','已核查，可以重试']],'no'),'新建尝试',v=>commit('retry',{delegation:id,checked:v.checked==='yes'},'已新建委派尝试')),
'evidence':()=>modal('保存验收记录',area('evidence','证据内容或可解析引用',T().evidence,'required placeholder="例如：本地边界说明第 2 节；评审记录已核对三个模块"')+area('conclusion','负责 Agent 的验收结论',T().conclusion,'required')+'<div class="note">只保存演示文本，不打开证据文件。验收本身若要求远端操作，仍须对应证据。</div>','保存证据与结论',v=>commit('evidence',v,'验收记录已保存')),
'complete':()=>dispatch('complete',{},'任务已在本地完成 · 资格已释放'),
'enable-github':()=>modal('启用可选 GitHub 协同',field('ref','GitHub Project 引用 · 可留空',P().githubRef,'placeholder="orgs/example/projects/3"')+'<div class="note">内存连接演示，无需账号或 token。任务仍可保持未关联，已有 Issue 按任务单独关联。</div>','启用协同',v=>commit('github',v,'协同已启用 · 核心身份与执行不变')),
 'toggle-github':()=>P().github?modal('停用 GitHub 协同','<div class="note">停止外部发布与导入，保留映射、最后同步事实与未完成队列。本地执行继续，不删除远端工作项。</div>','停用协同',()=>commit('github',{},'已切回纯本地 · 执行与历史保留')):handlers['enable-github'](),
'bind':()=>modal('关联已有 Issue',field('ref','Issue 引用','','required placeholder="example/research#42"')+'<div class="note">唯一映射检查拒绝将同一 Issue 关联到第二项任务。关联不会重启执行。</div>','保存外部关联',v=>commit('bind',v,'已关联已有 Issue · 等待发布')),
'rebind':()=>dispatch('bind',{ref:T().external.ref},'已恢复原映射'),
'unlink':()=>modal('解除 Issue 关联','<div class="note">停用本任务的外部关联，保留映射历史与队列。任务身份、执行占用和会话不变，远端 Issue 不删除。</div>','解除关联',()=>commit('unlink',{},'关联已解除 · 本地工作继续')),
'sync':()=>dispatch('sync',{},'同步操作已处理，请查看两侧事实'),
'network':()=>dispatch('network',{},state.network?'已模拟网络中断':'模拟网络已恢复'),
'inject-conflict':()=>{dispatch('conflict');ui.tab='github';render()},
'keep-local':()=>dispatch('resolve',{choice:'local'},'保留本地指派 · 等待同步'),
'accept-remote':()=>modal('校验外部负责人变更',select('agent','映射到本项目 Agent',agents().filter(a=>a.provider==='native').map(a=>[a.id,a.name]),agents().find(a=>a.provider==='native'&&a.id!==T().agent)?.id)+'<div class="note">执行资格已释放。接纳只更新指派，不从评论授予新执行权。</div>','接纳指派意图',v=>commit('resolve',{choice:'remote',agent:v.agent},'已接纳指派 · 待重新领取资格')),
'unknown':()=>{dispatch('unknown');ui.tab='github';render()},'reconcile':()=>dispatch('reconcile',{},'已核对原对象 · 可重试原操作'),
'open-task':id=>nav('task',id),'open-github':id=>nav('task',id,'github'),'all-tasks':()=>nav('tasks'),'agents':()=>nav('agents'),'resources':()=>nav('resources'),'collaboration':()=>nav('collaboration'),'execution-tab':()=>{ui.tab='execution';render()},'acceptance-tab':()=>{ui.tab='acceptance';render()},'github-tab':()=>{ui.tab='github';render()},'close-modal':closeModal,
'load-scene':()=>{state=ui.scenario==='local'?Model.empty():Model.seed();project=state.projects[0]?.id||null;ui.task=state.tasks[0]?.id||null;ui.page=ui.task?'task':'overview';ui.tab=ui.scenario==='handoff'?'execution':ui.scenario==='local'?'brief':'github';ui.demo=true;ui.step=0;render();notify('场景起点已载入，可逐步演示或自由操作')},'scene-next':()=>sceneStep()
};
function sceneStep(){const n=ui.step,sc=ui.scenario,go=(type,v={})=>state=act(type,v),bind=()=>{if(!P().github)go('github');go('bind',{ref:'example/research#42'})},evidence=()=>{T().criteria.forEach((_,i)=>go('check',{index:i,checked:true}));go('evidence',{evidence:'演示证据：本地模块边界说明覆盖三个模块；评审确认职责、交互与待决项均可追溯。',conclusion:'负责 Agent 已核验全部标准，接受当前成果。'})};try{
if(sc==='local'){if(n===0){go('project',{name:'本地研发计划'});project=state.projects.at(-1).id;ui.page='agents'}if(n===1)go('agent',{name:'舟 · 工程',role:'工程师',provider:'native'});if(n===2){go('task',{title:'梳理模块边界',spec:'在本地整理模块职责与交互，形成可供复核的说明。',criteria:['模块职责清晰','边界说明和评审结论可追溯']});ui.task=state.tasks.at(-1).id;ui.page='task'}if(n===3)go('assign',{agent:agents()[0].id});if(n===4)go('claim');if(n===5){go('start',{cwd:'/work/local/research-notes'});ui.tab='execution'}if(n>=6&&n<=8){go('advance');if(n===8)ui.tab='acceptance'}if(n===9)evidence();if(n===10)go('complete')}
if(sc==='handoff'){if(n===0)go('handoff',{summary:'职责边界已梳理，后继继续补全本地证据。'});if(n===1)go('interrupt');if(n===2)go('recover')}
if(sc==='switching'){if(n===0||n===3||n===4)go('github');if(n===1)go('bind',{ref:'example/research#42'});if(n===2)go('sync')}
if(sc==='failure'){if(n===0)bind();if(n===1)go('network');if(n===2){go('advance');ui.tab='acceptance'}if(n===3)evidence();if(n===4){go('complete');ui.tab='github'}if(n===5||n===7)go('sync');if(n===6)go('network')}
if(sc==='conflict'){if(n===0)bind();if(n===1)go('conflict');if(n===2){try{go('claim');throw Error('重复认领未被拒绝')}catch(e){if(!e.message.includes('已有唯一有效协调者'))throw e;notify(e.message)}}if(n===3)go('resolve',{choice:'local'});if(n===4)go('sync')}
ui.step++;render();if(!(sc==='conflict'&&n===2))notify('已完成演示步骤：'+scenarios[sc].steps[n]);}catch(e){notify(e.message+'；可重新载入场景起点')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav)nav(b.dataset.nav);else if(b.dataset.tab){ui.tab=b.dataset.tab;render()}else if(b.dataset.scenario){ui.scenario=b.dataset.scenario;ui.step=-1;ui.demo=true;render()}else if(b.dataset.action)handlers[b.dataset.action]?.(b.dataset.id)});
document.addEventListener('change',e=>{if(e.target.id==='project-switch'){project=e.target.value;nav('overview')}if(e.target.id==='task-filter'){ui.filter=e.target.value;render()}if(e.target.dataset.check!==undefined)dispatch('check',{index:Number(e.target.dataset.check),checked:e.target.checked})});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){ui.query=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='dialog-form')return;e.preventDefault();try{submitHandler?.(Object.fromEntries(new FormData(e.target)))}catch(error){$('#form-error').textContent=error.message}});
$('#modal').addEventListener('cancel',()=>submitHandler=null);
render();
</script></body></html>
