# dsh-a2d2 bundle patch: the mount row this plugin contributes to a profile.
#
# Installed through the official CLI —
#
#   dsh plugin --profile web add dsh-a2d2
#
# — the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing the `dsh.bundle.patch` declaration in package.json, appends `dsh-a2d2`
# to the bundle stack. The profile boot then merges THIS patch, which inserts
# the plugin row.
#
# `root`, `projectMarkers`, `suggestedSkills`, `handoffWarnTokens`, and
# `handoffCriticalTokens` belong to the `a2d2` row's own config; omitting them
# keeps the defaults (marker `.git`, project root derived from each session cwd,
# the A²D² mainline skill suggestions, an empty price table, and the 200k / 1M
# context lengths the floating indicator warns and turns critical at).
#
# Three rows, because cordis loads a plugin only once its declared services
# exist. The task store declares none, so `ctx.a2d2` is available in any
# profile; the command row declares `commands` and `a2d2`, so only a profile
# that composes both gets `/handoff`; the tools row declares `tools` and
# `a2d2`, so only a profile that composes both gets the model tools
# (`bind_main_session`). The open-subtask tools row also declares `agents` and
# `llm`, because `open_subtask` creates a root session and selects the grill
# station model; the complete-task tools row declares `agents`, because
# `complete_task` may resume the parent task's main session before sending the
# child-completed notification; the CEO prompt row declares `agents`,
# `systemPrompt`, and `a2d2`, so only a profile with live Agents and system
# prompt assembly gets scoped main-session CEO guidance. The floating orb needs
# drives that same command through the session it already sits on.
- insert:
    - id: a2d2
      name: 'dsh-a2d2'
    - id: a2d2-command
      name: 'dsh-a2d2/command'
    - id: a2d2-tools
      name: 'dsh-a2d2/tools'
    - id: a2d2-open-subtask-tools
      name: 'dsh-a2d2/open-subtask-tools'
    - id: a2d2-complete-task-tools
      name: 'dsh-a2d2/complete-task-tools'
    - id: a2d2-ceo-prompt
      name: 'dsh-a2d2/ceo-prompt'
