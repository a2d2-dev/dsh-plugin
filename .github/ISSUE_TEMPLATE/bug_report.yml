name: Bug report
description: Report a reproducible plugin problem
title: 'bug: '
body:
  - type: markdown
    attributes:
      value: 'Remove credentials and private conversations. For vulnerabilities, follow SECURITY.md instead of posting details here.'
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package version, exact DSH host version, Node/OS, profile and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example and whether the problem occurs consistently.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
      description: Include error text and a sanitized screenshot or accessible evidence link when helpful.
    validations:
      required: true
