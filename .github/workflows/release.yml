name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (for example v0.0.23)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Verify and pack existing tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify package version and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-repository.mjs --tag "$RELEASE_TAG"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:node
      - run: pnpm verify:pack-exports
      - run: pnpm pack --pack-destination .local/release
      - name: Record source and checksums
        run: |
          git rev-parse HEAD > .local/release/SOURCE_COMMIT
          cd .local/release
          sha256sum *.tgz SOURCE_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: .local/release/
          if-no-files-found: error
          retention-days: 14
