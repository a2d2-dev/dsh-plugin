[program:dsh-dev-web-proxy]
; The DSH profile owns the internal listener. Only this proxy binds the mesh IP.
command=/data/_dsh-dev/tools/socat/usr/bin/socat TCP-LISTEN:18780,bind=10.126.126.12,reuseaddr,fork TCP:127.0.0.1:18781
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/data/_dsh-dev/logs/proxy-stdout.log
stderr_logfile=/data/_dsh-dev/logs/proxy-stderr.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_backups=2
