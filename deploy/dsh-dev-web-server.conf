[program:dsh-dev-web-server]
command=/usr/bin/python3 /data/src/github.com/a2d2-dev/dsh-plugin.worktrees/dev-environment/deploy/dev-environment-launch.py
directory=/data/src/github.com/deepseek-ai/deepseek-harness-dev
environment=PATH="/root/.nvm/versions/node/v22.23.1/bin:/usr/local/bin:/usr/bin:/bin"
priority=20
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/data/_dsh-dev/logs/web-stdout.log
stderr_logfile=/data/_dsh-dev/logs/web-stderr.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
